<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Administrador | Aquí tái</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --accent-color: #ff9d00;
      --danger-color: #ef4444;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      padding: 20px 16px 80px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      display: none; /* Se muestra solo al estar autenticado */
    }

    /* MODAL LOGIN */
    .login-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg-main);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 16px;
    }

    .login-box {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 30px;
      border-radius: 16px;
      width: min(100%, 380px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .login-title { font-size: 20px; font-weight: 800; margin-bottom: 4px; text-align: center; }
    .login-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; text-align: center; }

    /* ESTILOS PANEL */
    .top-admin {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .btn-logout {
      background: transparent;
      border: 1px solid var(--danger-color);
      color: var(--danger-color);
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 13px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }

    label { font-size: 13px; color: var(--text-muted); font-weight: 600; }

    input, textarea, select {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--accent-color);
    }

    .btn-submit {
      width: 100%;
      background: var(--accent-color);
      color: #0f172a;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
    }

    /* INVENTARIO */
    .item-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border-color);
    }

    .item-img { width: 45px; height: 45px; border-radius: 8px; object-fit: cover; background: var(--bg-main); }
    .item-info { flex: 1; }
    .item-title { font-size: 14px; font-weight: 700; }
    .item-meta { font-size: 12px; color: var(--text-muted); }

    .btn-del {
      background: var(--danger-color);
      color: #fff;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- FORMULARIO DE INICIO DE SESIÓN SUPABASE -->
  <div class="login-overlay" id="loginOverlay">
    <div class="login-box">
      <div class="login-title">🔐 Iniciar Sesión</div>
      <div class="login-sub">Acceso administrativo vía Supabase</div>
      
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Correo Electrónico</label>
          <input type="email" id="emailInput" placeholder="admin@ejemplo.com" required autofocus>
        </div>
        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" id="passInput" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-submit" id="btnLogin">Entrar</button>
      </form>
    </div>
  </div>

  <!-- PANEL DE ADMINISTRACIÓN -->
  <div class="container" id="adminContainer">
    <div class="top-admin">
      <div>
        <h2 style="margin:0; font-size: 20px;">📦 Panel de Control</h2>
        <span id="userEmail" style="font-size: 12px; color: var(--text-muted);"></span>
      </div>
      <button class="btn-logout" onclick="logout()">🔒 Cerrar Sesión</button>
    </div>

    <!-- FORMULARIO AGREGAR PRODUCTO -->
    <div class="card">
      <h3 style="margin-top:0; margin-bottom:16px;">➕ Nuevo Producto</h3>
      <form id="productForm" onsubmit="saveProduct(event)">
        <div class="form-group">
          <label>Nombre del Producto *</label>
          <input type="text" id="pName" required>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
          <div class="form-group">
            <label>Precio (Bs) *</label>
            <input type="number" step="0.01" id="pPrice" required>
          </div>
          <div class="form-group">
            <label>Stock *</label>
            <input type="number" id="pStock" value="1" required>
          </div>
        </div>

        <div class="form-group">
          <label>Categoría</label>
          <input type="text" id="pCat" placeholder="Ej: Electrónica, Sorpresas...">
        </div>

        <div class="form-group">
          <label>URL de Imagen (o separadas por coma)</label>
          <input type="text" id="pImg" placeholder="https://...">
        </div>

        <div class="form-group">
          <label>Descripción</label>
          <textarea id="pDesc" rows="3"></textarea>
        </div>

        <button type="submit" class="btn-submit" id="btnSave">Guardar Producto</button>
      </form>
    </div>

    <!-- LISTA DE INVENTARIO -->
    <div class="card">
      <h3 style="margin-top:0; margin-bottom:16px;">📋 Inventario Actual</h3>
      <div id="productList">Cargando...</div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://ztsthkoejosgwkhmzfbd.supabase.co";
    const SUPABASE_KEY = "sb_publishable_PUxkUNfWJbdoNYuYGynqAA_3Z02D4MA";

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // COMPROBAR SESIÓN AUTOMÁTICAMENTE
    async function checkAuth() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      
      if (session) {
        document.getElementById("loginOverlay").style.display = "none";
        document.getElementById("adminContainer").style.display = "block";
        document.getElementById("userEmail").textContent = session.user.email;
        loadProducts();
      } else {
        document.getElementById("loginOverlay").style.display = "flex";
        document.getElementById("adminContainer").style.display = "none";
      }
    }

    // INICIAR SESIÓN CON SUPABASE AUTH
    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById("btnLogin");
      const email = document.getElementById("emailInput").value.trim();
      const password = document.getElementById("passInput").value;

      btn.disabled = true;
      btn.textContent = "Verificando...";

      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (error) {
        alert("Error al iniciar sesión: " + error.message);
        btn.disabled = false;
        btn.textContent = "Entrar";
      } else {
        document.getElementById("passInput").value = "";
        btn.disabled = false;
        btn.textContent = "Entrar";
        checkAuth();
      }
    }

    // CERRAR SESIÓN
    async function logout() {
      await supabaseClient.auth.signOut();
      checkAuth();
    }

    // CARGAR INVENTARIO
    async function loadProducts() {
      const list = document.getElementById("productList");
      try {
        const { data, error } = await supabaseClient
          .from("products")
          .select("*")
          .order("id", { ascending: false });

        if (error) throw error;

        if (!data || !data.length) {
          list.innerHTML = `<div style="color:var(--text-muted);">No hay productos registrados.</div>`;
          return;
        }

        list.innerHTML = data.map(p => {
          let mainImg = 'https://via.placeholder.com/100?text=Sin+Imagen';
          if (Array.isArray(p.images) && p.images[0]) mainImg = p.images[0];
          else if (typeof p.images === 'string' && p.images) {
            try { mainImg = JSON.parse(p.images)[0] || p.images; } catch(e) { mainImg = p.images; }
          } else if (p.image) mainImg = p.image;

          return `
            <div class="item-row">
              <img src="${mainImg}" class="item-img" onerror="this.src='https://via.placeholder.com/100?text=Error'">
              <div class="item-info">
                <div class="item-title">${escapeHTML(p.name)}</div>
                <div class="item-meta">Bs ${Number(p.price).toFixed(2)} | Stock: ${p.stock || 0} | ${escapeHTML(p.category || 'Sin cat')}</div>
              </div>
              <button class="btn-del" onclick="deleteProduct(${p.id})">Eliminar</button>
            </div>
          `;
        }).join("");

      } catch (e) {
        list.innerHTML = `<div style="color:var(--danger-color);">Error al cargar inventario: ${e.message}</div>`;
      }
    }

    // GUARDAR PRODUCTO
    async function saveProduct(e) {
      e.preventDefault();
      const btn = document.getElementById("btnSave");
      btn.disabled = true;
      btn.textContent = "Guardando...";

      const name = document.getElementById("pName").value.trim();
      const price = parseFloat(document.getElementById("pPrice").value);
      const stock = parseInt(document.getElementById("pStock").value);
      const category = document.getElementById("pCat").value.trim();
      const desc = document.getElementById("pDesc").value.trim();
      const imgRaw = document.getElementById("pImg").value.trim();

      let imagesArray = [];
      if (imgRaw) {
        imagesArray = imgRaw.split(",").map(s => s.trim()).filter(Boolean);
      }

      try {
        const { error } = await supabaseClient
          .from("products")
          .insert([{
            name: name,
            price: price,
            stock: stock,
            category: category,
            description: desc,
            images: imagesArray
          }]);

        if (error) throw error;

        document.getElementById("productForm").reset();
        loadProducts();
      } catch (err) {
        alert("Error al guardar (Verifica permisos RLS): " + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "Guardar Producto";
      }
    }

    // ELIMINAR PRODUCTO
    async function deleteProduct(id) {
      if (!confirm("¿Seguro que deseas eliminar este producto?")) return;

      try {
        const { error } = await supabaseClient
          .from("products")
          .delete()
          .eq("id", id);

        if (error) throw error;
        loadProducts();
      } catch (err) {
        alert("Error al eliminar (Verifica permisos RLS): " + err.message);
      }
    }

    function escapeHTML(str) {
      return String(str || '')
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // Detectar cambios de sesión en tiempo real
    supabaseClient.auth.onAuthStateChange((event, session) => {
      checkAuth();
    });

    // Inicio
    checkAuth();
  </script>
</body>
</html>
