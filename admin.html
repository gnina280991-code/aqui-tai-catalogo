<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aquí tái | Administración</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f6f8;
  color:#171717;
}

header{
  background:#111;
  color:#fff;
  padding:18px;
}

.header-inner{
  max-width:1000px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.logo-title{
  font-size:22px;
  font-weight:800;
}

.logo-sub{
  font-size:13px;
  color:#bbb;
  margin-top:3px;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:20px 15px 50px;
}

.login-box,
.admin-box,
.product-card{
  background:#fff;
  border-radius:18px;
  padding:20px;
  box-shadow:0 3px 15px #0000000c;
}

.login-box{
  max-width:450px;
  margin:50px auto;
}

h1,h2,h3{
  margin-top:0;
}

input,
textarea,
select{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:10px;
  margin:6px 0 14px;
  font:inherit;
}

textarea{
  min-height:100px;
  resize:vertical;
}

label{
  font-size:14px;
  font-weight:700;
}

.btn{
  border:0;
  border-radius:11px;
  padding:13px 16px;
  font-weight:700;
  cursor:pointer;
  font-size:14px;
}

.btn-primary{
  background:#111;
  color:#fff;
  width:100%;
}

.btn-orange{
  background:#ff9d00;
  color:#111;
}

.btn-danger{
  background:#d92323;
  color:#fff;
}

.btn-gray{
  background:#eee;
  color:#111;
}

.top-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.admin-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:20px;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.full{
  grid-column:1 / -1;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  gap:15px;
  margin-top:20px;
}

.product-image{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  border-radius:12px;
  background:#eee;
}

.product-name{
  font-size:18px;
  font-weight:800;
  margin:10px 0 5px;
}

.product-info{
  color:#666;
  font-size:14px;
  line-height:1.5;
}

.price{
  font-size:20px;
  font-weight:800;
  margin:8px 0;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.actions button{
  flex:1;
}

.status{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  font-size:12px;
  font-weight:700;
}

.active{
  background:#d9f7df;
  color:#176b29;
}

.inactive{
  background:#eee;
  color:#666;
}

.message{
  padding:12px;
  border-radius:10px;
  margin:10px 0;
  display:none;
}

.message.ok{
  display:block;
  background:#dff7e5;
  color:#176b29;
}

.message.error{
  display:block;
  background:#ffe1e1;
  color:#a00000;
}

.hidden{
  display:none !important;
}

/* ===============================
   IMÁGENES
================================ */

.upload-box{
  border:2px dashed #ddd;
  border-radius:14px;
  padding:18px;
  text-align:center;
  background:#fafafa;
  margin-top:6px;
}

.upload-box input[type=file]{
  margin:0;
  padding:10px;
  border:0;
  background:transparent;
}

.preview{
  width:150px;
  height:150px;
  object-fit:cover;
  border-radius:14px;
  display:none;
  margin:12px auto;
  border:1px solid #ddd;
}

.current-image{
  font-size:13px;
  color:#666;
  margin-top:8px;
  word-break:break-all;
}

.upload-status{
  font-size:13px;
  margin-top:8px;
  color:#666;
}

/* ===============================
   MOBILE
================================ */

@media(max-width:650px){

  .form-grid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .admin-header{
    align-items:flex-start;
    flex-direction:column;
  }

  .header-inner{
    align-items:flex-start;
    flex-direction:column;
  }

  .products{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  .product-card{
    padding:12px;
  }

  .product-name{
    font-size:15px;
  }

  .product-info{
    font-size:12px;
  }

  .price{
    font-size:17px;
  }

  .btn{
    padding:11px 10px;
    font-size:13px;
  }

}

</style>
</head>

<body>


<header>

  <div class="header-inner">

    <div>

      <div class="logo-title">
        🛍️ Aquí tái
      </div>

      <div class="logo-sub">
        Panel de administración
      </div>

    </div>

    <div id="userArea"></div>

  </div>

</header>


<main class="container">


<!-- =====================================================
     LOGIN
===================================================== -->

<section id="loginSection" class="login-box">

  <h1>🔐 Administración</h1>

  <p>
    Inicia sesión para administrar tus productos.
  </p>

  <div
    id="loginMessage"
    class="message"
  ></div>


  <label>
    Correo electrónico
  </label>

  <input
    id="loginEmail"
    type="email"
    placeholder="tu@email.com"
    autocomplete="email"
  >


  <label>
    Contraseña
  </label>

  <input
    id="loginPassword"
    type="password"
    placeholder="Tu contraseña"
    autocomplete="current-password"
  >


  <button
    class="btn btn-primary"
    onclick="login()"
  >
    🔑 Iniciar sesión
  </button>

</section>


<!-- =====================================================
     ADMIN
===================================================== -->

<section
  id="adminSection"
  class="hidden"
>

  <div class="admin-header">

    <div>

      <h1>📦 Productos</h1>

      <p>
        Agrega y administra los productos de tu catálogo.
      </p>

    </div>


    <div class="top-actions">

      <button
        class="btn btn-orange"
        onclick="newProduct()"
      >
        ➕ Nuevo producto
      </button>


      <button
        class="btn btn-gray"
        onclick="logout()"
      >
        Salir
      </button>

    </div>

  </div>


  <!-- ===================================================
       FORMULARIO
  ==================================================== -->

  <div
    id="formBox"
    class="admin-box hidden"
  >

    <h2 id="formTitle">
      ➕ Nuevo producto
    </h2>


    <div
      id="formMessage"
      class="message"
    ></div>


    <input
      id="productId"
      type="hidden"
    >


    <div class="form-grid">


      <!-- NOMBRE -->

      <div class="full">

        <label>
          Nombre del producto
        </label>

        <input
          id="productName"
          type="text"
          placeholder="Ej. Auto de emergencia"
        >

      </div>


      <!-- CATEGORIA -->

      <div>

        <label>
          Categoría
        </label>

        <input
          id="productCategory"
          type="text"
          placeholder="Ej. Autos"
        >

      </div>


      <!-- PRECIO -->

      <div>

        <label>
          Precio en Bs
        </label>

        <input
          id="productPrice"
          type="number"
          min="0"
          step="0.01"
          placeholder="320"
        >

      </div>


      <!-- STOCK -->

      <div>

        <label>
          Stock disponible
        </label>

        <input
          id="productStock"
          type="number"
          min="0"
          step="1"
          placeholder="10"
        >

      </div>


      <!-- ESTADO -->

      <div>

        <label>
          Estado
        </label>

        <select id="productActive">

          <option value="true">
            🟢 Activo
          </option>

          <option value="false">
            ⚪ Oculto
          </option>

        </select>

      </div>


      <!-- DESCRIPCIÓN -->

      <div class="full">

        <label>
          Descripción
        </label>

        <textarea
          id="productDescription"
          placeholder="Describe el producto..."
        ></textarea>

      </div>


      <!-- =================================================
           SUBIR IMAGEN
      ================================================== -->

      <div class="full">

        <label>
          📷 Foto del producto
        </label>


        <div class="upload-box">

          <input
            id="productFile"
            type="file"
            accept="image/*"
            onchange="handleImageSelect()"
          >


          <img
            id="imagePreview"
            class="preview"
            alt="Vista previa"
          >


          <div
            id="uploadStatus"
            class="upload-status"
          >
            Selecciona una foto desde tu teléfono.
          </div>

        </div>


        <!-- URL guardada internamente -->

        <input
          id="productImage"
          type="hidden"
        >


        <div
          id="currentImage"
          class="current-image"
        ></div>

      </div>


    </div>


    <div class="top-actions">

      <button
        id="saveButton"
        class="btn btn-orange"
        onclick="saveProduct()"
      >
        💾 Guardar producto
      </button>


      <button
        class="btn btn-gray"
        onclick="cancelForm()"
      >
        Cancelar
      </button>

    </div>

  </div>


  <!-- ===================================================
       LISTA
  ==================================================== -->

  <div id="productsContainer">

    <div class="admin-box">
      ⏳ Cargando productos...
    </div>

  </div>

</section>

</main>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://ztsthkoejosgwkhmzfbd.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_PUxkUNfWJbdoNYuYGynqAA_3Z02D4MA";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   CONFIGURACIÓN STORAGE
===================================================== */

const STORAGE_BUCKET =
  "product-images";


/* =====================================================
   VARIABLES
===================================================== */

let currentUser = null;

let selectedFile = null;


/* =====================================================
   ELEMENTOS
===================================================== */

const loginSection =
  document.getElementById("loginSection");


const adminSection =
  document.getElementById("adminSection");


const formBox =
  document.getElementById("formBox");


const productsContainer =
  document.getElementById("productsContainer");


const userArea =
  document.getElementById("userArea");


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   MENSAJES
===================================================== */

function showMessage(
  element,
  text,
  type
){

  element.textContent = text;

  element.className =
    "message " + type;

}


/* =====================================================
   LOGIN
===================================================== */

async function login(){

  const email =
    document
      .getElementById("loginEmail")
      .value
      .trim();


  const password =
    document
      .getElementById("loginPassword")
      .value;


  const message =
    document
      .getElementById("loginMessage");


  if(!email || !password){

    showMessage(
      message,
      "Completa correo y contraseña.",
      "error"
    );

    return;
  }


  showMessage(
    message,
    "Iniciando sesión...",
    "ok"
  );


  const {
    data,
    error
  } =
    await supabaseClient.auth.signInWithPassword({

      email,
      password

    });


  if(error){

    showMessage(
      message,
      "No se pudo iniciar sesión: " +
      error.message,
      "error"
    );

    return;
  }


  currentUser =
    data.user;


  showAdmin();

}


/* =====================================================
   MOSTRAR ADMIN
===================================================== */

function showAdmin(){

  loginSection.classList.add(
    "hidden"
  );


  adminSection.classList.remove(
    "hidden"
  );


  userArea.innerHTML = `

    <span style="font-size:13px">

      👤 ${escapeHTML(
        currentUser?.email || ""
      )}

    </span>

  `;


  loadProducts();

}


/* =====================================================
   CERRAR SESIÓN
===================================================== */

async function logout(){

  await supabaseClient.auth.signOut();


  currentUser = null;


  adminSection.classList.add(
    "hidden"
  );


  loginSection.classList.remove(
    "hidden"
  );


  userArea.innerHTML = "";

}


/* =====================================================
   CARGAR PRODUCTOS
===================================================== */

async function loadProducts(){

  productsContainer.innerHTML = `

    <div class="admin-box">

      ⏳ Cargando productos...

    </div>

  `;


  const {
    data,
    error
  } =
    await supabaseClient
      .from("products")
      .select(
        "id,name,category,description,price,image,stock,active,created_at"
      )
      .order("id",{
        ascending:false
      });


  if(error){

    productsContainer.innerHTML = `

      <div class="message error">

        ❌ Error al cargar productos:

        ${escapeHTML(error.message)}

      </div>

    `;

    return;
  }


  if(!data || !data.length){

    productsContainer.innerHTML = `

      <div class="admin-box">

        <h3>
          No hay productos todavía.
        </h3>

        <p>
          Pulsa "Nuevo producto" para agregar el primero.
        </p>

      </div>

    `;

    return;
  }


  productsContainer.innerHTML = `

    <div class="products">

      ${
        data.map(productCard).join("")
      }

    </div>

  `;

}


/* =====================================================
   TARJETA PRODUCTO
===================================================== */

function productCard(p){

  const image =
    p.image ||
    "https://via.placeholder.com/600x600?text=Sin+imagen";


  const status =
    p.active

    ? `

      <span class="status active">

        🟢 Activo

      </span>

    `

    : `

      <span class="status inactive">

        ⚪ Oculto

      </span>

    `;


  return `

    <article class="product-card">


      <img

        class="product-image"

        src="${escapeHTML(image)}"

        alt="${escapeHTML(
          p.name || "Producto"
        )}"

        onerror="
          this.src='https://via.placeholder.com/600x600?text=Sin+imagen'
        "

      >


      <div class="product-name">

        ${escapeHTML(
          p.name
        )}

      </div>


      <div class="product-info">

        ${escapeHTML(
          p.category ||
          "Sin categoría"
        )}

      </div>


      <div class="price">

        Bs ${Number(
          p.price || 0
        ).toFixed(2)}

      </div>


      <div class="product-info">

        📦 Stock:

        <strong>

          ${Number(
            p.stock || 0
          )}

        </strong>

      </div>


      <div style="margin-top:8px">

        ${status}

      </div>


      <div class="actions">


        <button

          class="btn btn-orange"

          onclick="editProduct(
            ${Number(p.id)}
          )"

        >

          ✏️ Editar

        </button>


        <button

          class="btn btn-danger"

          onclick="deleteProduct(
            ${Number(p.id)}
          )"

        >

          🗑️

        </button>


      </div>


    </article>

  `;

}


/* =====================================================
   NUEVO PRODUCTO
===================================================== */

function newProduct(){

  clearForm();


  document
    .getElementById("formTitle")
    .textContent =
      "➕ Nuevo producto";


  formBox.classList.remove(
    "hidden"
  );


  window.scrollTo({

    top:0,

    behavior:"smooth"

  });

}


/* =====================================================
   SELECCIONAR IMAGEN
===================================================== */

function handleImageSelect(){

  const fileInput =
    document.getElementById(
      "productFile"
    );


  const preview =
    document.getElementById(
      "imagePreview"
    );


  const status =
    document.getElementById(
      "uploadStatus"
    );


  const file =
    fileInput.files[0];


  if(!file){

    selectedFile = null;

    preview.style.display =
      "none";

    status.textContent =
      "Selecciona una foto desde tu teléfono.";

    return;
  }


  /* Verificar que sea imagen */

  if(!file.type.startsWith("image/")){

    selectedFile = null;

    fileInput.value = "";

    preview.style.display =
      "none";

    status.textContent =
      "❌ El archivo debe ser una imagen.";

    return;
  }


  /* Límite de 5 MB */

  if(file.size > 5 * 1024 * 1024){

    selectedFile = null;

    fileInput.value = "";

    preview.style.display =
      "none";

    status.textContent =
      "❌ La imagen no puede superar 5 MB.";

    return;
  }


  selectedFile = file;


  /* Vista previa */

  const reader =
    new FileReader();


  reader.onload =
    function(event){

      preview.src =
        event.target.result;

      preview.style.display =
        "block";

    };


  reader.readAsDataURL(file);


  status.textContent =
    "📷 " +
    file.name +
    " seleccionada correctamente.";

}


/* =====================================================
   SUBIR IMAGEN A SUPABASE
===================================================== */

async function uploadImage(){

  if(!selectedFile){

    return null;
  }


  const status =
    document.getElementById(
      "uploadStatus"
    );


  status.textContent =
    "⏳ Subiendo imagen...";


  /*
    Crear nombre único.

    Ejemplo:

    1723456789-auto-emergencia.jpg
  */

  const extension =
    selectedFile.name
      .split(".")
      .pop()
      .toLowerCase();


  const fileName =
    Date.now() +
    "-" +
    Math.random()
      .toString(36)
      .substring(2,10) +
    "." +
    extension;


  /*
    Guardamos directamente
    en el bucket product-images.
  */

  const {
    error
  } =
    await supabaseClient
      .storage
      .from(STORAGE_BUCKET)
      .upload(
        fileName,
        selectedFile,
        {
          cacheControl:"3600",
          upsert:false,
          contentType:selectedFile.type
        }
      );


  if(error){

    console.error(
      "Error subiendo imagen:",
      error
    );

    throw new Error(
      "No se pudo subir la imagen: " +
      error.message
    );

  }


  /*
    Obtener URL pública.
  */

  const {
    data
  } =
    supabaseClient
      .storage
      .from(STORAGE_BUCKET)
      .getPublicUrl(
        fileName
      );


  if(!data || !data.publicUrl){

    throw new Error(
      "No se pudo obtener la URL pública de la imagen."
    );

  }


  status.textContent =
    "✅ Imagen subida correctamente.";


  return data.publicUrl;

}


/* =====================================================
   EDITAR PRODUCTO
===================================================== */

async function editProduct(id){

  const {
    data,
    error
  } =
    await supabaseClient
      .from("products")
      .select("*")
      .eq("id",id)
      .single();


  if(error){

    alert(
      "No se pudo cargar el producto."
    );

    return;
  }


  document
    .getElementById("productId")
    .value =
      data.id;


  document
    .getElementById("productName")
    .value =
      data.name || "";


  document
    .getElementById("productCategory")
    .value =
      data.category || "";


  document
    .getElementById("productDescription")
    .value =
      data.description || "";


  document
    .getElementById("productPrice")
    .value =
      data.price ?? "";


  document
    .getElementById("productStock")
    .value =
      data.stock ?? 0;


  document
    .getElementById("productActive")
    .value =
      data.active
        ? "true"
        : "false";


  /*
    Guardar URL actual.
  */

  document
    .getElementById("productImage")
    .value =
      data.image || "";


  /*
    Limpiar selección
    de archivo nuevo.
  */

  selectedFile = null;


  document
    .getElementById("productFile")
    .value = "";


  /*
    Mostrar imagen actual.
  */

  const preview =
    document.getElementById(
      "imagePreview"
    );


  const currentImage =
    document.getElementById(
      "currentImage"
    );


  if(data.image){

    preview.src =
      data.image;

    preview.style.display =
      "block";


    currentImage.innerHTML = `

      📌 Imagen actual guardada.

    `;

  }else{

    preview.style.display =
      "none";

    currentImage.textContent =
      "Este producto todavía no tiene imagen.";

  }


  document
    .getElementById("uploadStatus")
    .textContent =
      "Puedes mantener la imagen actual o seleccionar una nueva.";


  document
    .getElementById("formTitle")
    .textContent =
      "✏️ Editar producto";


  formBox.classList.remove(
    "hidden"
  );


  window.scrollTo({

    top:0,

    behavior:"smooth"

  });

}


/* =====================================================
   GUARDAR PRODUCTO
===================================================== */

async function saveProduct(){

  const id =
    document
      .getElementById("productId")
      .value;


  const name =
    document
      .getElementById("productName")
      .value
      .trim();


  const category =
    document
      .getElementById("productCategory")
      .value
      .trim();


  const description =
    document
      .getElementById("productDescription")
      .value
      .trim();


  const price =
    Number(
      document
        .getElementById("productPrice")
        .value
    );


  const stock =
    Number(
      document
        .getElementById("productStock")
        .value
    );


  const active =
    document
      .getElementById("productActive")
      .value === "true";


  const message =
    document
      .getElementById("formMessage");


  const saveButton =
    document
      .getElementById("saveButton");


  if(!name){

    showMessage(

      message,

      "Escribe el nombre del producto.",

      "error"

    );

    return;
  }


  if(
    price < 0 ||
    Number.isNaN(price)
  ){

    showMessage(

      message,

      "El precio no es válido.",

      "error"

    );

    return;
  }


  if(
    stock < 0 ||
    Number.isNaN(stock)
  ){

    showMessage(

      message,

      "El stock no es válido.",

      "error"

    );

    return;
  }


  /*
    Desactivar botón
    para evitar doble guardado.
  */

  saveButton.disabled =
    true;


  saveButton.textContent =
    "⏳ Guardando...";


  try{


    /*
      URL de imagen actual.
    */

    let image =
      document
        .getElementById(
          "productImage"
        )
        .value
        .trim();


    /*
      Si seleccionó una foto nueva,
      primero la subimos.
    */

    if(selectedFile){

      showMessage(

        message,

        "📷 Subiendo imagen...",

        "ok"

      );


      image =
        await uploadImage();

    }


    /*
      Crear producto.
    */

    const product = {

      name,

      category,

      description,

      price,

      image,

      stock,

      active

    };


    showMessage(

      message,

      "💾 Guardando producto...",

      "ok"

    );


    let result;


    /*
      EDITAR
    */

    if(id){

      result =
        await supabaseClient
          .from("products")
          .update(product)
          .eq(
            "id",
            Number(id)
          );

    }

    /*
      NUEVO
    */

    else{

      result =
        await supabaseClient
          .from("products")
          .insert(
            product
          );

    }


    if(result.error){

      throw new Error(
        result.error.message
      );

    }


    showMessage(

      message,

      "✅ Producto guardado correctamente.",

      "ok"

    );


    /*
      Limpiar después
      de guardar.
    */

    setTimeout(() => {

      clearForm();

      formBox.classList.add(
        "hidden"
      );

      loadProducts();

    },800);


  }catch(error){

    console.error(error);


    showMessage(

      message,

      "❌ Error: " +
      error.message,

      "error"

    );


  }finally{

    saveButton.disabled =
      false;

    saveButton.textContent =
      "💾 Guardar producto";

  }

}


/* =====================================================
   ELIMINAR PRODUCTO
===================================================== */

async function deleteProduct(id){

  const confirmDelete =
    confirm(
      "¿Seguro que quieres eliminar este producto?"
    );


  if(!confirmDelete){

    return;
  }


  const {
    error
  } =
    await supabaseClient
      .from("products")
      .delete()
      .eq(
        "id",
        id
      );


  if(error){

    alert(
      "No se pudo eliminar: " +
      error.message
    );

    return;
  }


  alert(
    "Producto eliminado correctamente."
  );


  loadProducts();

}


/* =====================================================
   LIMPIAR FORMULARIO
===================================================== */

function clearForm(){

  document
    .getElementById("productId")
    .value = "";


  document
    .getElementById("productName")
    .value = "";


  document
    .getElementById("productCategory")
    .value = "";


  document
    .getElementById("productDescription")
    .value = "";


  document
    .getElementById("productPrice")
    .value = "";


  document
    .getElementById("productStock")
    .value = "0";


  document
    .getElementById("productActive")
    .value = "true";


  document
    .getElementById("productImage")
    .value = "";


  document
    .getElementById("productFile")
    .value = "";


  document
    .getElementById("formMessage")
    .className =
      "message";


  document
    .getElementById("imagePreview")
    .style.display =
      "none";


  document
    .getElementById("currentImage")
    .textContent =
      "";


  document
    .getElementById("uploadStatus")
    .textContent =
      "Selecciona una foto desde tu teléfono.";


  selectedFile =

}


/* =====================================================
   CANCELAR
===================================================== */

function cancelForm(){

  clearForm();


  formBox.classList.add(
    "hidden"
  );

}


/* =====================================================
   COMPROBAR SESIÓN
===================================================== */

async function checkSession(){

  const {
    data
  } =
    await supabaseClient
      .auth
      .getSession();


  if(data.session){

    currentUser =
      data.session.user;


    showAdmin();

  }

}


/* =====================================================
   INICIO
===================================================== */

checkSession();
