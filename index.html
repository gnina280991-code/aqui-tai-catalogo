<script>

/* =====================================================
   CONFIGURACIÓN SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://ztsthkoejosgwkhmz.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_PUxkUNfWJbdoNYuYGynqAA_3Z02D4MA";


/* =====================================================
   CREAR CLIENTE SUPABASE
===================================================== */

let supabaseClient = null;

try{

  if(
    window.supabase &&
    typeof window.supabase.createClient === "function"
  ){

    supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
          auth:{
            persistSession:false,
            autoRefreshToken:false,
            detectSessionInUrl:false
          },
          global:{
            headers:{
              "x-client-info":"aqui-tai-catalogo"
            }
          }
        }
      );

  }

}catch(error){

  console.error(
    "No se pudo inicializar Supabase:",
    error
  );

}


/* =====================================================
   VARIABLES
===================================================== */

let products = [];

let cart = [];

let galleryStates = {};

let currentLightboxImages = [];

let currentLightboxIndex = 0;

let loadingRequest = false;


/* =====================================================
   ELEMENTOS
===================================================== */

const grid =
  document.getElementById("grid");

const search =
  document.getElementById("search");

const count =
  document.getElementById("count");

const cartItems =
  document.getElementById("cartItems");

const total =
  document.getElementById("total");

const panel =
  document.getElementById("panel");

const customer =
  document.getElementById("customer");

const address =
  document.getElementById("address");

const productCount =
  document.getElementById("productCount");

const lightbox =
  document.getElementById("lightbox");

const lightboxImage =
  document.getElementById("lightboxImage");

const lightboxCounter =
  document.getElementById("lightboxCounter");

const lightboxPrev =
  document.getElementById("lightboxPrev");

const lightboxNext =
  document.getElementById("lightboxNext");


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   IMÁGENES
===================================================== */

function getImages(value){

  if(!value){
    return [];
  }


  if(Array.isArray(value)){

    return value
      .map(x => String(x).trim())
      .filter(Boolean);

  }


  const text =
    String(value).trim();


  if(!text){
    return [];
  }


  /* JSON */

  if(
    text.startsWith("[") &&
    text.endsWith("]")
  ){

    try{

      const parsed =
        JSON.parse(text);

      if(Array.isArray(parsed)){

        return parsed
          .map(x => String(x).trim())
          .filter(Boolean);

      }

    }catch(error){

      console.log(
        "La columna image no contiene JSON válido."
      );

    }

  }


  /* Saltos de línea */

  if(text.includes("\n")){

    return text
      .split(/\r?\n/)
      .map(x => x.trim())
      .filter(Boolean);

  }


  /* Comas */

  if(text.includes(",")){

    return text
      .split(",")
      .map(x => x.trim())
      .filter(Boolean);

  }


  return [text];

}


/* =====================================================
   NORMALIZAR PRODUCTO
===================================================== */

function normalizeProduct(product){

  return {

    id:product.id,

    name:
      product.name ||
      "Producto sin nombre",

    category:
      product.category ||
      "Sin categoría",

    description:
      product.description ||
      "",

    price:
      Number(product.price || 0),

    image:
      product.image ||
      "",

    stock:
      Number(product.stock || 0),

    active:
      product.active === true

  };

}


/* =====================================================
   MENSAJE DE ERROR
===================================================== */

function showCatalogError(error){

  console.error(
    "Error completo al cargar productos:",
    error
  );


  let detail =
    "No se pudo establecer comunicación con Supabase.";


  if(error){

    if(error.message){

      detail =
        error.message;

    }else if(error.error_description){

      detail =
        error.error_description;

    }else if(typeof error === "string"){

      detail =
        error;

    }

  }


  productCount.textContent =
    "No se pudo cargar el catálogo.";


  grid.innerHTML = `

    <div class="error">

      <div class="error-title">
        ❌ No se pudo cargar el catálogo
      </div>

      <div>
        Estamos intentando conectar con
        nuestra base de datos.
      </div>

      <div class="error-detail">
        ${escapeHTML(detail)}
      </div>

      <button
        class="retry"
        onclick="loadProducts()"
        type="button"
      >
        🔄 Reintentar
      </button>

    </div>

  `;

}


/* =====================================================
   CARGAR PRODUCTOS
===================================================== */

async function loadProducts(){

  if(loadingRequest){
    return;
  }


  loadingRequest = true;


  grid.innerHTML = `

    <div class="loading">
      ⏳ Cargando catálogo...
    </div>

  `;


  productCount.textContent =
    "Cargando productos...";


  try{

    if(!supabaseClient){

      throw new Error(
        "La biblioteca de Supabase no pudo inicializarse."
      );

    }


    /*
      IMPORTANTE:

      El cliente solamente solicita las columnas
      necesarias para mostrar el catálogo.
    */

    const result =
      await supabaseClient
        .from("products")
        .select(
          "id,name,category,description,price,image,stock,active"
        )
        .eq("active",true)
        .order("id",{
          ascending:false
        });


    const data =
      result.data;

    const error =
      result.error;


    if(error){

      throw error;

    }


    products =
      Array.isArray(data)
      ? data.map(normalizeProduct)
      : [];


    /*
      Reiniciar estados de galerías
    */

    galleryStates = {};


    products.forEach(product => {

      galleryStates[product.id] = {

        images:
          getImages(product.image),

        index:0

      };

    });


    render(products);


  }catch(error){

    showCatalogError(error);

  }finally{

    loadingRequest = false;

  }

}


/* =====================================================
   GALERÍA HTML
===================================================== */

function galleryHTML(product){

  let images =
    getImages(product.image);


  const fallback =
    "https://via.placeholder.com/800x600?text=Aqui+tai";


  if(!images.length){

    images =
      [fallback];

  }


  if(!galleryStates[product.id]){

    galleryStates[product.id] = {

      images:images,

      index:0

    };

  }


  const state =
    galleryStates[product.id];


  state.images =
    images;


  if(
    state.index < 0 ||
    state.index >= images.length
  ){

    state.index = 0;

  }


  const mainImage =
    images[state.index];


  /* ===================================================
     UNA SOLA FOTO
  =================================================== */

  if(images.length === 1){

    return `

      <div class="gallery single">

        <div
          class="main-image-wrap"
          onclick="openLightbox(${Number(product.id)},0)"
        >

          <img
            id="main-image-${Number(product.id)}"
            class="main-image"
            src="${escapeHTML(mainImage)}"
            alt="${escapeHTML(product.name)}"
            loading="lazy"
            onerror="
              this.onerror=null;
              this.src='https://via.placeholder.com/800x600?text=Sin+imagen';
            "
          >

        </div>

      </div>

    `;

  }


  /* ===================================================
     VARIAS FOTOS
  =================================================== */

  return `

    <div
      id="gallery-${Number(product.id)}"
      class="gallery"
    >

      <div
        class="main-image-wrap"
        onclick="openLightbox(${Number(product.id)},${state.index})"
      >

        <img
          id="main-image-${Number(product.id)}"
          class="main-image"
          src="${escapeHTML(mainImage)}"
          alt="${escapeHTML(product.name)}"
          loading="lazy"
          onerror="
            this.onerror=null;
            this.src='https://via.placeholder.com/800x600?text=Sin+imagen';
          "
        >


        <button
          class="gallery-arrow left"
          onclick="
            event.stopPropagation();
            changeGallery(${Number(product.id)},-1);
          "
          type="button"
          aria-label="Imagen anterior"
        >
          ‹
        </button>


        <button
          class="gallery-arrow right"
          onclick="
            event.stopPropagation();
            changeGallery(${Number(product.id)},1);
          "
          type="button"
          aria-label="Imagen siguiente"
        >
          ›
        </button>


        <div
          id="counter-${Number(product.id)}"
          class="photo-counter"
        >
          ${state.index + 1} / ${images.length}
        </div>

      </div>


      <div
        id="thumbs-${Number(product.id)}"
        class="thumbnails"
      >

        ${images.map((image,index) => `

          <button
            class="thumb ${
              index === state.index
              ? "active"
              : ""
            }"
            onclick="
              event.stopPropagation();
              selectGalleryImage(
                ${Number(product.id)},
                ${index}
              );
            "
            type="button"
            aria-label="Ver imagen ${index + 1}"
          >

            <img
              src="${escapeHTML(image)}"
              alt="Foto ${index + 1}"
              loading="lazy"
              onerror="
                this.onerror=null;
                this.src='https://via.placeholder.com/100x100?text=Foto';
              "
            >

          </button>

        `).join("")}

      </div>


      <div class="photo-info">
        📷 ${images.length}
        ${images.length === 1 ? "foto" : "fotos"}
      </div>

    </div>

  `;

}


/* =====================================================
   RENDER
===================================================== */

function render(list){

  productCount.textContent =
    list.length +
    (
      list.length === 1
      ? " producto disponible."
      : " productos disponibles."
    );


  if(!list.length){

    grid.innerHTML = `

      <div class="loading">

        🔎 No encontramos productos.

        <br><br>

        Prueba con otro nombre o categoría.

      </div>

    `;

    return;

  }


  grid.innerHTML =
    list.map(product => {

      const stock =
        Number(product.stock || 0);


      const disabled =
        stock <= 0
        ? "disabled"
        : "";


      const stockHTML =
        stock > 0

        ? `
          <div class="stock">
            📦 Disponible: ${stock}
          </div>
        `

        : `
          <div class="stock out">
            ❌ Agotado
          </div>
        `;


      return `

        <article class="card">

          ${galleryHTML(product)}


          <div class="body">

            <div class="cat">
              ${escapeHTML(product.category)}
            </div>


            <div class="name">
              ${escapeHTML(product.name)}
            </div>


            ${
              product.description
              ? `
                <div class="desc">
                  ${escapeHTML(product.description)}
                </div>
              `
              : ""
            }


            <div class="price">
              Bs ${Number(
                product.price || 0
              ).toFixed(2)}
            </div>


            ${stockHTML}


            <button
              class="btn"
              ${disabled}
              onclick="add(${Number(product.id)})"
              type="button"
            >

              ${
                stock > 0
                ? "Agregar al carrito"
                : "Agotado"
              }

            </button>

          </div>

        </article>

      `;

    }).join("");

}


/* =====================================================
   CAMBIAR GALERÍA
===================================================== */

function changeGallery(id,direction){

  const state =
    galleryStates[id];


  if(!state){
    return;
  }


  const total =
    state.images.length;


  if(total <= 1){
    return;
  }


  state.index += direction;


  if(state.index < 0){

    state.index =
      total - 1;

  }


  if(state.index >= total){

    state.index = 0;

  }


  updateGallery(id);

}


/* =====================================================
   SELECCIONAR FOTO
===================================================== */

function selectGalleryImage(id,index){

  const state =
    galleryStates[id];


  if(!state){
    return;
  }


  if(
    index < 0 ||
    index >= state.images.length
  ){

    return;

  }


  state.index =
    index;


  updateGallery(id);

}


/* =====================================================
   ACTUALIZAR GALERÍA
===================================================== */

function updateGallery(id){

  const state =
    galleryStates[id];


  if(!state){
    return;
  }


  const image =
    state.images[state.index];


  const mainImage =
    document.getElementById(
      "main-image-" + id
    );


  const counter =
    document.getElementById(
      "counter-" + id
    );


  const thumbs =
    document.querySelectorAll(
      "#thumbs-" +
      id +
      " .thumb"
    );


  if(mainImage){

    mainImage.src =
      image;

  }


  if(counter){

    counter.textContent =
      (state.index + 1) +
      " / " +
      state.images.length;

  }


  thumbs.forEach(
    (thumb,index) => {

      thumb.classList.toggle(
        "active",
        index === state.index
      );

    }
  );


  /*
    Actualizar onclick de la imagen
    para abrir el visor en la foto actual.
  */

  if(mainImage){

    const wrapper =
      mainImage.parentElement;


    if(wrapper){

      wrapper.onclick =
        function(){

          openLightbox(
            id,
            state.index
          );

        };

    }

  }

}


/* =====================================================
   VISOR
===================================================== */

function openLightbox(id,index){

  const state =
    galleryStates[id];


  if(!state){
    return;
  }


  currentLightboxImages =
    state.images;


  if(!currentLightboxImages.length){
    return;
  }


  currentLightboxIndex =
    Math.max(
      0,
      Math.min(
        Number(index) || 0,
        currentLightboxImages.length - 1
      )
    );


  updateLightbox();


  lightbox.classList.add("open");

  document.body.style.overflow =
    "hidden";

}


function updateLightbox(){

  if(!currentLightboxImages.length){
    return;
  }


  lightboxImage.src =
    currentLightboxImages[
      currentLightboxIndex
    ];


  lightboxCounter.textContent =
    (currentLightboxIndex + 1) +
    " / " +
    currentLightboxImages.length;


  if(
    currentLightboxImages.length <= 1
  ){

    lightboxPrev.style.display =
      "none";

    lightboxNext.style.display =
      "none";

  }else{

    lightboxPrev.style.display =
      "flex";

    lightboxNext.style.display =
      "flex";

  }

}


function changeLightboxImage(direction){

  if(
    currentLightboxImages.length <= 1
  ){

    return;

  }


  currentLightboxIndex +=
    direction;


  if(currentLightboxIndex < 0){

    currentLightboxIndex =
      currentLightboxImages.length - 1;

  }


  if(
    currentLightboxIndex >=
    currentLightboxImages.length
  ){

    currentLightboxIndex = 0;

  }


  updateLightbox();

}


function closeLightbox(){

  lightbox.classList.remove("open");

  document.body.style.overflow =
    "";

}


function closeLightboxIfBackground(event){

  if(event.target === lightbox){

    closeLightbox();

  }

}


/* =====================================================
   TECLADO
===================================================== */

document.addEventListener(
  "keydown",
  function(event){

    if(
      !lightbox.classList.contains("open")
    ){

      return;

    }


    if(event.key === "Escape"){

      closeLightbox();

    }


    if(event.key === "ArrowLeft"){

      changeLightboxImage(-1);

    }


    if(event.key === "ArrowRight"){

      changeLightboxImage(1);

    }

  }
);


/* =====================================================
   SWIPE
===================================================== */

let touchStartX = 0;

let touchEndX = 0;


lightbox.addEventListener(
  "touchstart",
  function(event){

    if(
      event.changedTouches &&
      event.changedTouches.length
    ){

      touchStartX =
        event.changedTouches[0].screenX;

    }

  },
  {
    passive:true
  }
);


lightbox.addEventListener(
  "touchend",
  function(event){

    if(
      !event.changedTouches ||
      !event.changedTouches.length
    ){

      return;

    }


    touchEndX =
      event.changedTouches[0].screenX;


    const difference =
      touchStartX - touchEndX;


    if(Math.abs(difference) < 50){

      return;

    }


    if(difference > 0){

      changeLightboxImage(1);

    }else{

      changeLightboxImage(-1);

    }

  },
  {
    passive:true
  }
);


/* =====================================================
   BÚSQUEDA
===================================================== */

search.addEventListener(
  "input",
  function(){

    const q =
      search.value
        .trim()
        .toLowerCase();


    if(!q){

      render(products);

      return;

    }


    const filtered =
      products.filter(product => {

        const text =
          [
            product.name,
            product.description,
            product.category
          ]
          .filter(Boolean)
          .join(" ")
          .toLowerCase();


        return text.includes(q);

      });


    render(filtered);

  }
);


/* =====================================================
   CARRITO
===================================================== */

function add(id){

  const product =
    products.find(
      p =>
        Number(p.id) ===
        Number(id)
    );


  if(!product){

    alert(
      "Producto no encontrado."
    );

    return;

  }


  const stock =
    Number(product.stock || 0);


  if(stock <= 0){

    alert(
      "Este producto está agotado."
    );

    return;

  }


  const existing =
    cart.find(
      x =>
        Number(x.id) ===
        Number(id)
    );


  if(existing){

    if(
      Number(existing.qty) >=
      stock
    ){

      alert(
        "No puedes agregar más unidades de las disponibles."
      );

      return;

    }


    existing.qty++;

  }else{

    cart.push({

      ...product,

      qty:1

    });

  }


  updateCart();

  openCart();

}


function updateCart(){

  const quantity =
    cart.reduce(
      (sum,item) =>
        sum +
        Number(item.qty || 0),
      0
    );


  count.textContent =
    quantity;


  if(!cart.length){

    cartItems.innerHTML = `

      <p>
        Tu carrito está vacío.
      </p>

    `;


    total.textContent =
      "Total: Bs 0.00";


    return;

  }


  cartItems.innerHTML =
    cart.map((item,index) => {

      const subtotal =
        Number(item.price || 0) *
        Number(item.qty || 0);


      return `

        <div class="row">

          <div>

            <b>
              ${escapeHTML(item.name)}
            </b>

            <br>

            Bs ${Number(
              item.price || 0
            ).toFixed(2)}

            ×
            ${item.qty}

            <br>

            <strong>
              Subtotal:
              Bs ${subtotal.toFixed(2)}
            </strong>

          </div>


          <button
            onclick="removeItem(${index})"
            type="button"
            aria-label="Eliminar producto"
          >
            🗑️
          </button>

        </div>

      `;

    }).join("");


  const grandTotal =
    cart.reduce(
      (sum,item) =>
        sum +
        Number(item.price || 0) *
        Number(item.qty || 0),
      0
    );


  total.textContent =
    "Total: Bs " +
    grandTotal.toFixed(2);

}


function removeItem(index){

  if(
    index < 0 ||
    index >= cart.length
  ){

    return;

  }


  cart.splice(index,1);

  updateCart();

}


function openCart(){

  panel.classList.add("open");

  updateCart();

}


function closeCart(){

  panel.classList.remove("open");

}


/* =====================================================
   WHATSAPP
===================================================== */

function sendWhatsApp(){

  if(!cart.length){

    alert(
      "Agrega al menos un producto."
    );

    return;

  }


  const name =
    customer.value.trim() ||
    "No indicado";


  const addr =
    address.value.trim() ||
    "No indicada";


  const grandTotal =
    cart.reduce(
      (sum,item) =>
        sum +
        Number(item.price || 0) *
        Number(item.qty || 0),
      0
    );


  let message =
    "🛍️ *NUEVO PEDIDO - AQUÍ TÁI*\n\n";


  cart.forEach(item => {

    const subtotal =
      Number(item.price || 0) *
      Number(item.qty || 0);


    message +=
      "• " +
      item.name +
      " × " +
      item.qty +
      " = Bs " +
      subtotal.toFixed(2) +
      "\n";

  });


  message +=
    "\n💰 *Total: Bs " +
    grandTotal.toFixed(2) +
    "*";


  message +=
    "\n👤 Cliente: " +
    name;


  message +=
    "\n📍 Entrega: " +
    addr;


  const encodedMessage =
    encodeURIComponent(
      message
    );


  /*
    Número de WhatsApp de la tienda.
  */

  const whatsappURL =
    "https://wa.me/59171440907?text=" +
    encodedMessage;


  window.location.href =
    whatsappURL;

}

   CERRAR CARRITO CON ESCAPE
===================================================== */

document.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Escape" &&
      panel.classList.contains("open")
    ){

      closeCart();

    }

  }
);


/* =====================================================
   INICIAR CATÁLOGO
===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    loadProducts();

  }
);
