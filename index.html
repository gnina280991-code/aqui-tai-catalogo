<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aquí tái | Tienda Online Oficial</title>

  <!-- SUPABASE JS CLIENT -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-main: #f8fafc;
      --bg-card: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --accent-color: #ff9d00;
      --accent-hover: #e08b00;
      --btn-bg: #0f172a;
      --btn-text: #ffffff;
      --success-color: #10b981;
      --danger-color: #ef4444;
      --radius: 16px;
      --shadow: 0 4px 20px rgba(0,0,0,0.06);
    }

    body.dark-mode {
      --bg-main: #0b0f19;
      --bg-card: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --btn-bg: #334155;
      --btn-text: #ffffff;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      transition: background 0.3s, color 0.3s;
      padding-bottom: 90px;
    }

    button, input, select, textarea { font-family: inherit; }

    /* TOAST NOTIFICACIONES */
    #toast-container {
      position: fixed;
      bottom: 90px;
      right: 20px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 90vw;
    }

    .toast {
      background: var(--btn-bg);
      color: var(--btn-text);
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      animation: slideUp 0.2s ease-out;
      border-left: 4px solid var(--accent-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    /* HEADER STICKY */
    header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .top {
      max-width: 1200px;
      margin: auto;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand-wrap { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .logo { height: 42px; width: 42px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border-color); }
    .brand { font-size: 20px; font-weight: 900; letter-spacing: -0.5px; }
    .sub { font-size: 11px; color: var(--text-muted); font-weight: 500; }

    .header-actions { display: flex; align-items: center; gap: 8px; }

    .icon-btn {
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      position: relative;
    }

    .badge-count {
      background: var(--accent-color);
      color: #000;
      font-size: 10px;
      font-weight: 900;
      padding: 2px 6px;
      border-radius: 10px;
    }

    /* CONTENEDOR PRINCIPAL */
    .wrap {
      max-width: 1200px;
      margin: auto;
      padding: 16px;
    }

    /* BUSCADOR Y FILTROS */
    .filters-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .search-bar {
      position: relative;
      width: 100%;
    }

    .search-bar input {
      width: 100%;
      padding: 14px 16px 14px 44px;
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-main);
      font-size: 15px;
      outline: none;
      box-shadow: var(--shadow);
      transition: border-color 0.2s;
    }

    .search-bar input:focus { border-color: var(--accent-color); }
    .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 16px; }

    .categories-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .categories-scroll::-webkit-scrollbar { display: none; }

    .cat-chip {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: 0.2s;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }

    .cat-chip.active {
      background: var(--accent-color);
      color: #000;
      border-color: var(--accent-color);
    }

    /* GRILLA DE PRODUCTOS */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 14px;
    }

    @media(min-width: 640px) {
      .products-grid { grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 18px; }
    }

    .product-card {
      background: var(--bg-card);
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .product-card:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.08); }

    .product-img-wrap {
      position: relative;
      width: 100%;
      padding-top: 100%;
      background: #0001;
      cursor: pointer;
    }

    .product-img {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover;
    }

    .stock-badge {
      position: absolute;
      top: 10px; left: 10px;
      background: rgba(0,0,0,0.7);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 8px;
      backdrop-filter: blur(4px);
    }

    .product-info {
      padding: 12px;
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
      gap: 10px;
    }

    .product-category { font-size: 11px; text-transform: uppercase; font-weight: 800; color: var(--text-muted); }
    .product-name { font-size: 14px; font-weight: 800; line-height: 1.3; cursor: pointer; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .product-name:hover { color: var(--accent-color); }

    .product-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
    }

    .product-price { font-size: 16px; font-weight: 900; }

    .btn-cart-add {
      background: var(--accent-color);
      color: #000;
      border: 0;
      width: 36px; height: 36px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.1s;
    }

    .btn-cart-add:active { transform: scale(0.9); }
    .btn-cart-add:disabled { opacity: 0.4; cursor: not-allowed; }

    /* MODAL GENERAL Y CARRITO */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 300;
      backdrop-filter: blur(2px);
    }

    @media(min-width: 640px) {
      .modal { align-items: center; }
    }

    .modal.open { display: flex; }

    .modal-content {
      background: var(--bg-card);
      border-radius: 24px 24px 0 0;
      width: 100%;
      max-width: 520px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      animation: slideUpModal 0.25s ease-out;
    }

    @media(min-width: 640px) {
      .modal-content { border-radius: 24px; }
    }

    @keyframes slideUpModal { from { transform: translateY(100%); } to { transform: translateY(0); } }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

    .modal-close {
      border: 0;
      background: var(--bg-main);
      color: var(--text-main);
      border-radius: 50%;
      width: 32px; height: 32px;
      cursor: pointer;
      font-size: 16px;
      display: flex; align-items: center; justify-content: center;
    }

    /* CARRITO DE COMPRAS */
    .cart-items-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }

    .cart-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-main);
      padding: 10px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .cart-item-img { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; background: #000; }
    .cart-item-info { flex: 1; }
    .cart-item-title { font-size: 13px; font-weight: 800; margin-bottom: 2px; }
    .cart-item-price { font-size: 12px; color: var(--text-muted); font-weight: 700; }

    .cart-controls { display: flex; align-items: center; gap: 6px; }
    .qty-btn { width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-main); font-weight: bold; cursor: pointer; }

    .cart-total-box {
      border-top: 1px solid var(--border-color);
      padding-top: 14px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 18px;
      font-weight: 900;
    }

    .btn-whatsapp {
      background: #25d366;
      color: #fff;
      border: 0;
      border-radius: 14px;
      padding: 14px;
      font-weight: 800;
      font-size: 16px;
      width: 100%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
    }

    /* MODAL DETALLES PRODUCTO */
    .detail-gallery {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 16px;
      padding-bottom: 4px;
    }

    .detail-img {
      width: 90px; height: 90px;
      border-radius: 12px;
      object-fit: cover;
      background: #000;
      border: 1px solid var(--border-color);
      flex-shrink: 0;
      cursor: pointer;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid var(--border-color);
      font-size: 14px;
    }

    .detail-desc { margin-top: 14px; line-height: 1.6; color: var(--text-muted); font-size: 14px; white-space: pre-line; }

    /* LIGHTBOX VISOR */
    .lightbox-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.95);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 500;
      padding: 16px;
    }

    .lightbox-modal.open { display: flex; }
    .lightbox-img { max-width: 100%; max-height: 85vh; object-fit: contain; border-radius: 8px; }
  </style>
</head>
<body>

  <div id="toast-container"></div>

  <!-- HEADER -->
  <header>
    <div class="top">
      <div class="brand-wrap" onclick="resetStoreView()">
        <img class="logo" src="logo.png" alt="Aquí tái" onerror="this.style.display='none'">
        <div>
          <div class="brand">Aquí tái</div>
          <div class="sub">Cochabamba, Bolivia</div>
        </div>
      </div>

      <div class="header-actions">
        <button id="themeBtn" class="icon-btn" onclick="toggleTheme()" title="Cambiar tema">🌙</button>
        <button class="icon-btn" onclick="openCartModal()">
          🛒 <span id="cartCountBadge" class="badge-count">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="wrap">
    <!-- FILTROS Y BUSCADOR -->
    <section class="filters-section">
      <div class="search-bar">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Buscar productos en Aquí tái..." oninput="filterProducts()">
      </div>

      <div id="categoriesContainer" class="categories-scroll">
        <button class="cat-chip active" onclick="selectCategory('all', this)">🔥 Todo</button>
      </div>
    </section>

    <!-- GRILLA DE PRODUCTOS -->
    <section id="productsGrid" class="products-grid">
      <div style="grid-column: 1 / -1; text-align:center; padding: 40px; color:var(--text-muted);">
        ⏳ Conectando con la base de datos...
      </div>
    </section>
  </main>

  <!-- MODAL CARRITO -->
  <div id="cartModal" class="modal" onclick="if(event.target===this)closeCartModal()">
    <div class="modal-content">
      <div class="modal-header">
        <h3 style="margin:0;">🛒 Tu Carrito de Compras</h3>
        <button class="modal-close" onclick="closeCartModal()">✕</button>
      </div>

      <div id="cartItemsContainer" class="cart-items-list">
        <!-- Items dinámicos -->
      </div>

      <div class="cart-total-box">
        <span>Total a pagar:</span>
        <span id="cartTotalPrice">Bs 0.00</span>
      </div>

      <button class="btn-whatsapp" onclick="checkoutWhatsApp()">
        💬 Enviar pedido por WhatsApp
      </button>
    </div>
  </div>

  <!-- MODAL DETALLE DE PRODUCTO -->
  <div id="detailModal" class="modal" onclick="if(event.target===this)closeDetailModal()">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle" style="margin:0; font-size:18px;">Detalles del Producto</h3>
        <button class="modal-close" onclick="closeDetailModal()">✕</button>
      </div>

      <div id="detailGallery" class="detail-gallery"></div>

      <div class="detail-row">
        <span>🏷️ Categoría:</span>
        <b id="modalCategory">-</b>
      </div>

      <div class="detail-row">
        <span>💵 Precio:</span>
        <b id="modalPrice">-</b>
      </div>

      <div class="detail-row">
        <span>📦 Stock disponible:</span>
        <b id="modalStock">-</b>
      </div>

      <div style="margin-top:14px; font-weight:bold; font-size:12px; color:var(--text-muted); text-transform:uppercase;">📝 Descripción:</div>
      <div id="modalDesc" class="detail-desc"></div>

      <div style="margin-top:20px;">
        <button id="modalAddBtn" class="btn-whatsapp" style="background:var(--accent-color); color:#000; box-shadow:none;">
          🛒 Agregar al Carrito
        </button>
      </div>
    </div>
  </div>

  <!-- LIGHTBOX PANTALLA COMPLETA -->
  <div id="lightboxModal" class="lightbox-modal" onclick="closeLightbox()">
    <img id="lightboxImg" class="lightbox-img" src="" alt="Vista Completa">
  </div>

  <!-- SCRIPT SUPABASE & TIENDA -->
  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL = "https://tu-proyecto.supabase.co"; // Reemplazar con tu URL de Supabase
    const SUPABASE_ANON_KEY = "tu-anon-key"; // Reemplazar con tu Anon Key

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const WHATSAPP_PHONE = "59170000000"; // Número de WhatsApp de la tienda

    let products = [];
    let cart = JSON.parse(localStorage.getItem("aquita_cart") || "[]");
    let activeCategory = "all";
    let activeProductForModal = null;

    const productsGrid = document.getElementById("productsGrid");
    const categoriesContainer = document.getElementById("categoriesContainer");
    const cartCountBadge = document.getElementById("cartCountBadge");
    const cartModal = document.getElementById("cartModal");
    const detailModal = document.getElementById("detailModal");
    const lightboxModal = document.getElementById("lightboxModal");

    window.showToast = function(message) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    };

    window.toggleTheme = function() {
      document.body.classList.toggle("dark-mode");
      const isDark = document.body.classList.contains("dark-mode");
      document.getElementById("themeBtn").textContent = isDark ? "☀️" : "🌙";
      localStorage.setItem("aquita_theme", isDark ? "dark" : "light");
    };

    if (localStorage.getItem("aquita_theme") === "dark") {
      document.body.classList.add("dark-mode");
      document.getElementById("themeBtn").textContent = "☀️";
    }

    async function loadStoreData() {
      try {
        // Obtenemos solo productos activos
        const { data, error } = await supabase
          .from('products')
          .select('*')
          .eq('active', true);

        if (error) throw error;
        products = data || [];

        renderCategories();
        filterProducts();
      } catch (err) {
        productsGrid.innerHTML = `<div style="grid-column: 1 / -1; text-align:center; padding: 40px; color:var(--danger-color);">❌ Error al cargar productos: ${escapeHTML(err.message)}</div>`;
      }
    }

    function renderCategories() {
      const categoriesSet = new Set();
      products.forEach(p => {
        if (p.category) categoriesSet.add(p.category.trim());
      });

      let html = `<button class="cat-chip ${activeCategory === 'all' ? 'active' : ''}" onclick="selectCategory('all', this)">🔥 Todo</button>`;
      categoriesSet.forEach(cat => {
        html += `<button class="cat-chip ${activeCategory === cat ? 'active' : ''}" onclick="selectCategory('${escapeHTML(cat)}', this)">📦 ${escapeHTML(cat)}</button>`;
      });
      categoriesContainer.innerHTML = html;
    }

    window.selectCategory = function(cat, el) {
      activeCategory = cat;
      document.querySelectorAll('.cat-chip').forEach(btn => btn.classList.remove('active'));
      el.classList.add('active');
      filterProducts();
    };

    window.filterProducts = function() {
      const q = document.getElementById("searchInput").value.toLowerCase().trim();

      const filtered = products.filter(p => {
        const matchCat = (activeCategory === 'all' || (p.category && p.category.toLowerCase() === activeCategory.toLowerCase()));
        const matchText = !q || [p.name, p.category, p.description].filter(Boolean).join(" ").toLowerCase().includes(q);
        return matchCat && matchText;
      });

      renderProducts(filtered);
    };

    function renderProducts(list) {
      if (!list.length) {
        productsGrid.innerHTML = `<div style="grid-column: 1 / -1; text-align:center; padding: 40px; color:var(--text-muted);">No se encontraron productos disponibles.</div>`;
        return;
      }

      productsGrid.innerHTML = list.map(p => {
        const images = getImagesArray(p);
        const mainImg = images[0] || 'https://via.placeholder.com/200?text=Aquí+tái';
        const stock = Number(p.stock || 0);

        return `
          <div class="product-card">
            <div class="product-img-wrap" onclick="openDetailModal('${p.id}')">
              <img class="product-img" src="${escapeHTML(mainImg)}" alt="Producto" loading="lazy">
              <span class="stock-badge">${stock > 0 ? stock + ' disp.' : 'Agotado'}</span>
            </div>
            <div class="product-info">
              <div>
                <div class="product-category">${escapeHTML(p.category || 'General')}</div>
                <div class="product-name" onclick="openDetailModal('${p.id}')">${escapeHTML(p.name)}</div>
              </div>
              <div class="product-footer">
                <div class="product-price">Bs ${Number(p.price || 0).toFixed(2)}</div>
                <button class="btn-cart-add" onclick="addToCart('${p.id}')" ${stock <= 0 ? 'disabled' : ''}>+</button>
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    window.resetStoreView = function() {
      activeCategory = 'all';
      document.getElementById("searchInput").value = "";
      renderCategories();
      filterProducts();
    };

    /* CARRITO PERSISTENTE */
    window.addToCart = function(id) {
      const product = products.find(p => p.id === id);
      if (!product) return;

      const existing = cart.find(item => item.id === id);
      const currentStock = Number(product.stock || 0);

      if (existing) {
        if (existing.qty >= currentStock) {
          showToast("⚠️ Stock máximo alcanzado");
          return;
        }
        existing.qty++;
      } else {
        if (currentStock <= 0) {
          showToast("❌ Producto agotado");
          return;
        }
        cart.push({
          id: product.id,
          name: product.name,
          price: Number(product.price || 0),
          image: getImagesArray(product)[0] || '',
          qty: 1
        });
      }

      saveCart();
      showToast("✅ Producto añadido al carrito");
    };

    window.updateCartQty = function(id, delta) {
      const item = cart.find(i => i.id === id);
      if (!item) return;

      const product = products.find(p => p.id === id);
      const maxStock = product ? Number(product.stock || 0) : 99;

      item.qty += delta;
      if (item.qty > maxStock) {
        item.qty = maxStock;
        showToast("⚠️ Stock máximo alcanzado");
      }

      if (item.qty <= 0) {
        cart = cart.filter(i => i.id !== id);
      }

      saveCart();
      renderCartItems();
    };

    function saveCart() {
      localStorage.setItem("aquita_cart", JSON.stringify(cart));
      const totalUnits = cart.reduce((sum, i) => sum + i.qty, 0);
      cartCountBadge.textContent = totalUnits;
    }

    window.openCartModal = function() {
      renderCartItems();
      cartModal.classList.add("open");
    };

    window.closeCartModal = function() {
      cartModal.classList.remove("open");
    };

    function renderCartItems() {
      const container = document.getElementById("cartItemsContainer");
      const totalPriceEl = document.getElementById("cartTotalPrice");

      if (!cart.length) {
        container.innerHTML = `<div style="text-align:center; padding:20px; color:var(--text-muted);">Tu carrito está vacío.</div>`;
        totalPriceEl.textContent = "Bs 0.00";
        return;
      }

      let total = 0;
      container.innerHTML = cart.map(item => {
        const subtotal = item.price * item.qty;
        total += subtotal;

        return `
          <div class="cart-item">
            <img class="cart-item-img" src="${escapeHTML(item.image)}" alt="Item">
            <div class="cart-item-info">
              <div class="cart-item-title">${escapeHTML(item.name)}</div>
              <div class="cart-item-price">Bs ${item.price.toFixed(2)} c/u</div>
            </div>
            <div class="cart-controls">
              <button class="qty-btn" onclick="updateCartQty('${item.id}', -1)">-</button>
              <b style="font-size:13px; min-width:18px; text-align:center;">${item.qty}</b>
              <button class="qty-btn" onclick="updateCartQty('${item.id}', 1)">+</button>
            </div>
          </div>
        `;
      }).join("");

      totalPriceEl.textContent = "Bs " + total.toFixed(2);
    }

    window.checkoutWhatsApp = function() {
      if (!cart.length) return;

      let msg = "¡Hola! 👋 Quiero realizar el siguiente pedido desde *Aquí tái*:\n\n";
      let total = 0;

      cart.forEach(item => {
        const sub = item.price * item.qty;
        total += sub;
        msg += `• *${item.name}* x ${item.qty} = Bs ${sub.toFixed(2)}\n`;
      });

      msg += `\n💰 *Total a pagar: Bs ${total.toFixed(2)}*\n\n¡Quedo atento para coordinar el pago y entrega!`;

      const url = `https://wa.me/${WHATSAPP_PHONE}?text=${encodeURIComponent(msg)}`;
      window.open(url, '_blank');
    };

    /* MODAL DETALLES PRODUCTO */
    window.openDetailModal = function(id) {
      const p = products.find(x => x.id === id);
      if (!p) return;

      activeProductForModal = p;
      const images = getImagesArray(p);

      document.getElementById("modalTitle").textContent = p.name;
      document.getElementById("modalCategory").textContent = p.category || 'General';
      document.getElementById("modalPrice").textContent = "Bs " + Number(p.price || 0).toFixed(2);
      document.getElementById("modalStock").textContent = (p.stock || 0) + " unidades";
      document.getElementById("modalDesc").textContent = p.description || "Sin descripción registrada.";

      const galleryEl = document.getElementById("detailGallery");
      if (images.length) {
        galleryEl.innerHTML = images.map(img => `
          <img src="${escapeHTML(img)}" class="detail-img" onclick="openLightbox('${escapeHTML(img)}')">
        `).join("");
        galleryEl.style.display = "flex";
      } else {
        galleryEl.style.display = "none";
      }

      const addBtn = document.getElementById("modalAddBtn");
      if (Number(p.stock || 0) <= 0) {
        addBtn.disabled = true;
        addBtn.textContent = "❌ Producto Agotado";
      } else {
        addBtn.disabled = false;
        addBtn.textContent = "🛒 Agregar al Carrito";
        addBtn.onclick = () => {
          addToCart(p.id);
          closeDetailModal();
        };
      }

      detailModal.classList.add("open");
    };

    window.closeDetailModal = function() {
      detailModal.classList.remove("open");
    };

    window.openLightbox = function(url) {
      document.getElementById("lightboxImg").src = url;
      lightboxModal.classList.add("open");
    };

    window.closeLightbox = function() {
      lightboxModal.classList.remove("open");
    };

    function getImagesArray(product) {
      let list = [];
      if (Array.isArray(product.images)) list = product.images;
      else if (typeof product.images === 'string') {
        try { list = JSON.parse(product.images); } catch(e){}
      } else if (product.image) list = [product.image];
      return list;
    }

    function escapeHTML(str) {
      return String(str || '')
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // Inicializar carro al cargar
    saveCart();
    loadStoreData();
  </script>
</body>
</html>
