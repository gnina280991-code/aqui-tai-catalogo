<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aquí tái | Catálogo</title>
<meta name="description" content="Catálogo de productos Aquí tái · Bolivia">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f6f7f9;
  color:#171717;
}

header{
  background:#fff;
  border-bottom:1px solid #eee;
  position:sticky;
  top:0;
  z-index:10;
}

.top{
  max-width:1100px;
  margin:auto;
  padding:12px 16px;
  display:flex;
  align-items:center;
  gap:14px;
}

.logo{
  height:62px;
  width:62px;
  border-radius:50%;
  object-fit:cover;
  border:1px solid #eee;
}

.brand{
  font-size:25px;
  font-weight:800;
}

.sub{
  font-size:13px;
  color:#666;
}

.wrap{
  max-width:1100px;
  margin:auto;
  padding:22px 16px;
}

.hero{
  background:#fff;
  border-radius:20px;
  padding:22px;
  margin-bottom:20px;
}

.hero h1{
  margin:0 0 6px;
  font-size:30px;
}

.hero p{
  margin:0;
  color:#666;
  line-height:1.5;
}

.search{
  width:100%;
  padding:15px 16px;
  border:1px solid #ddd;
  border-radius:14px;
  font-size:16px;
  margin-top:18px;
  outline:none;
}

.search:focus{
  border-color:#111;
}

.status{
  margin-top:12px;
  font-size:13px;
  color:#777;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
  gap:16px;
}

.card{
  background:#fff;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 3px 15px #0000000c;
}

.pic{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  background:#fafafa;
  display:block;
}

.body{
  padding:14px;
}

.cat{
  font-size:12px;
  color:#777;
}

.name{
  font-size:18px;
  font-weight:700;
  margin:5px 0;
}

.desc{
  font-size:13px;
  color:#666;
  line-height:1.4;
  min-height:54px;
}

.price{
  font-size:22px;
  font-weight:800;
  margin:12px 0;
}

.btn{
  width:100%;
  border:0;
  border-radius:12px;
  padding:13px;
  background:#111;
  color:#fff;
  font-weight:700;
  font-size:15px;
  cursor:pointer;
}

.btn:active{
  transform:scale(.98);
}

.cart{
  position:fixed;
  right:18px;
  bottom:18px;
  border:0;
  border-radius:999px;
  padding:15px 20px;
  background:#ff9d00;
  color:#111;
  font-weight:800;
  box-shadow:0 5px 20px #0003;
  cursor:pointer;
  z-index:15;
}

.panel{
  position:fixed;
  inset:0;
  background:#0008;
  display:none;
  z-index:20;
}

.panel.open{
  display:flex;
  align-items:flex-end;
  justify-content:center;
}

.sheet{
  background:#fff;
  width:min(100%,560px);
  max-height:90vh;
  overflow:auto;
  border-radius:22px 22px 0 0;
  padding:20px;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.close{
  float:right;
  border:0;
  background:#eee;
  border-radius:50%;
  width:36px;
  height:36px;
  cursor:pointer;
  font-size:18px;
}

textarea,
input[type=text]{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
  margin:6px 0 12px;
  font:inherit;
}

textarea{
  min-height:90px;
  resize:vertical;
}

.empty{
  background:#fff;
  border-radius:18px;
  padding:30px;
  text-align:center;
  color:#777;
}

.loading{
  background:#fff;
  border-radius:18px;
  padding:30px;
  text-align:center;
  color:#777;
}

@media(max-width:480px){

  .grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
  }

  .card{
    border-radius:14px;
  }

  .body{
    padding:10px;
  }

  .name{
    font-size:15px;
  }

  .desc{
    font-size:12px;
    min-height:70px;
  }

  .price{
    font-size:18px;
  }

  .hero h1{
    font-size:24px;
  }

  .logo{
    height:55px;
    width:55px;
  }

  .brand{
    font-size:22px;
  }
}
</style>
</head>

<body>

<header>
  <div class="top">

    <img
      class="logo"
      src="logo.png"
      alt="Aquí tái"
      onerror="this.style.display='none'"
    >

    <div>
      <div class="brand">Aquí tái</div>
      <div class="sub">Catálogo de productos · Bolivia</div>
    </div>

  </div>
</header>


<main class="wrap">

  <section class="hero">

    <h1>🛍️ Nuestro catálogo</h1>

    <p>
      Elige tus productos y envíanos tu pedido directamente por WhatsApp.
    </p>

    <input
      id="search"
      class="search"
      type="text"
      placeholder="🔎 Buscar productos..."
      autocomplete="off"
    >

    <div id="status" class="status">
      Cargando productos...
    </div>

  </section>


  <section id="grid" class="grid">

    <div class="loading">
      Cargando catálogo...
    </div>

  </section>

</main>


<button class="cart" onclick="openCart()">
  🛒 Carrito (<span id="count">0</span>)
</button>


<div
  id="panel"
  class="panel"
  onclick="if(event.target===this)closeCart()"
>

  <div class="sheet">

    <button
      class="close"
      onclick="closeCart()"
    >
      ✕
    </button>

    <h2>Tu pedido</h2>

    <div id="cartItems"></div>

    <div
      id="total"
      style="font-size:20px;font-weight:800;margin:16px 0"
    ></div>

    <label>Tu nombre</label>

    <input
      id="customer"
      type="text"
      placeholder="Ej. Juan Pérez"
    >

    <label>Dirección o zona de entrega</label>

    <textarea
      id="address"
      placeholder="Ej. Zona Central"
    ></textarea>

    <button
      class="btn"
      onclick="sendWhatsApp()"
    >
      📲 Enviar pedido por WhatsApp
    </button>

  </div>

</div>


<script>

/* ==========================================
   CONFIGURACIÓN SUPABASE
   ========================================== */

const SUPABASE_URL =
  "https://ztsthkoejosgwkhmzfbd.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_PUxkUNfWJbdoNYuYGynqAA_3Z02D4MA";


/* ==========================================
   VARIABLES
   ========================================== */

let products = [];
let cart = [];


/* ==========================================
   ELEMENTOS
   ========================================== */

const grid =
  document.getElementById("grid");

const search =
  document.getElementById("search");

const count =
  document.getElementById("count");

const cartItems =
  document.getElementById("cartItems");

const total =
  document.getElementById("total");

const panel =
  document.getElementById("panel");

const customer =
  document.getElementById("customer");

const address =
  document.getElementById("address");

const status =
  document.getElementById("status");


/* ==========================================
   CARGAR PRODUCTOS DESDE SUPABASE
   ========================================== */

async function loadProducts(){

  status.textContent =
    "Conectando con el catálogo...";

  try{

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/products?select=*&active=eq.true&order=id.asc",
      {
        method:"GET",

        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":
            "Bearer " + SUPABASE_KEY,
          "Content-Type":
            "application/json"
        }
      }
    );


    if(!response.ok){

      throw new Error(
        "Supabase respondió con error " +
        response.status
      );

    }


    const data =
      await response.json();


    products =
      Array.isArray(data)
        ? data
        : [];


    if(products.length > 0){

      render(products);

      status.textContent =
        products.length +
        " producto(s) disponible(s).";

    }else{

      grid.innerHTML = `
        <div class="empty">
          <h3>🛍️ Catálogo vacío</h3>
          <p>
            Todavía no hay productos disponibles.
          </p>
        </div>
      `;

      status.textContent =
        "No hay productos activos.";

    }


  }catch(error){

    console.error(
      "Error cargando Supabase:",
      error
    );


    status.textContent =
      "No se pudo conectar con Supabase. Intentando cargar respaldo...";


    loadBackup();

  }

}


/* ==========================================
   RESPALDO: products.json
   ========================================== */

async function loadBackup(){

  try{

    const response =
      await fetch("products.json");


    if(!response.ok){

      throw new Error(
        "No existe products.json"
      );

    }


    const data =
      await response.json();


    products =
      Array.isArray(data)
        ? data
        : [];


    render(products);


    status.textContent =
      "Catálogo cargado desde respaldo.";

  }catch(error){

    console.error(error);

    grid.innerHTML = `
      <div class="empty">

        <h3>⚠️ No se pudo cargar el catálogo</h3>

        <p>
          Revisa la conexión con Supabase.
        </p>

      </div>
    `;

    status.textContent =
      "Error cargando productos.";

  }

}


/* ==========================================
   MOSTRAR PRODUCTOS
   ========================================== */

function render(list){

  if(!list.length){

    grid.innerHTML = `
      <div class="empty">
        No se encontraron productos.
      </div>
    `;

    return;
  }


  grid.innerHTML =
    list.map(p => {

      const image =
        p.image ||
        "logo.png";

      const category =
        p.category ||
        "Productos";

      const name =
        p.name ||
        "Producto";

      const description =
        p.description ||
        "";

      const price =
        Number(p.price || 0);


      return `

        <article class="card">

          <img
            class="pic"
            src="${escapeHTML(image)}"
            alt="${escapeHTML(name)}"
            onerror="this.src='logo.png'"
          >

          <div class="body">

            <div class="cat">
              ${escapeHTML(category)}
            </div>

            <div class="name">
              ${escapeHTML(name)}
            </div>

            <div class="desc">
              ${escapeHTML(description)}
            </div>

            <div class="price">
              Bs ${price.toFixed(2)}
            </div>

            <button
              class="btn"
              onclick="add(${Number(p.id)})"
            >
              Agregar al carrito
            </button>

          </div>

        </article>

      `;

    }).join("");

}


/* ==========================================
   BUSCADOR
   ========================================== */

search.addEventListener(
  "input",
  function(){

    const q =
      search.value
        .toLowerCase()
        .trim();


    const filtered =
      products.filter(p => {

        const text =
          (
            (p.name || "") +
            " " +
            (p.description || "") +
            " " +
            (p.category || "")
          ).toLowerCase();


        return text.includes(q);

      });


    render(filtered);

  }
);


/* ==========================================
   AGREGAR AL CARRITO
   ========================================== */

function add(id){

  const product =
    products.find(
      p => Number(p.id) === Number(id)
    );


  if(!product){

    alert(
      "No se encontró el producto."
    );

    return;
  }


  const existing =
    cart.find(
      p => Number(p.id) === Number(id)
    );


  if(existing){

    existing.qty++;

  }else{

    cart.push({
      ...product,
      qty:1
    });

  }


  updateCart();

  openCart();

}


/* ==========================================
   ACTUALIZAR CARRITO
   ========================================== */

function updateCart(){

  const quantity =
    cart.reduce(
      (sum,item) =>
        sum + item.qty,
      0
    );


  count.textContent =
    quantity;


  if(!cart.length){

    cartItems.innerHTML =
      "<p>Tu carrito está vacío.</p>";

    total.textContent =
      "Total: Bs 0.00";

    return;

  }


  cartItems.innerHTML =
    cart.map(
      (item,index) => `

        <div class="row">

          <div>

            <b>
              ${escapeHTML(item.name)}
            </b>

            <br>

            Bs ${Number(item.price).toFixed(2)}
            × ${item.qty}

          </div>

          <button
            onclick="removeItem(${index})"
            style="
              border:0;
              background:#eee;
              border-radius:8px;
              padding:8px;
              cursor:pointer;
            "
          >
            🗑️
          </button>

        </div>

      `
    ).join("");


  const totalValue =
    cart.reduce(
      (sum,item) =>
        sum +
        Number(item.price || 0) *
        item.qty,
      0
    );


  total.textContent =
    "Total: Bs " +
    totalValue.toFixed(2);

}


/* ==========================================
   ELIMINAR PRODUCTO
   ========================================== */

function removeItem(index){

  cart.splice(index,1);

  updateCart();

}


/* ==========================================
   ABRIR CARRITO
   ========================================== */

function openCart(){

  panel.classList.add("open");

  updateCart();

}


/* ==========================================
   CERRAR CARRITO
   ========================================== */

function closeCart(){

  panel.classList.remove("open");

}


/* ==========================================
   ENVIAR PEDIDO POR WHATSAPP
   ========================================== */

function sendWhatsApp(){

  if(!cart.length){

    alert(
      "Agrega al menos un producto."
    );

    return;

  }


  const name =
    customer.value.trim() ||
    "No indicado";


  const addr =
    address.value.trim() ||
    "No indicada";


  const lines =
    cart.map(item => {

      const subtotal =
        Number(item.price || 0) *
        item.qty;


      return (
        "• " +
        item.name +
        " × " +
        item.qty +
        " = Bs " +
        subtotal.toFixed(2)
      );

    });


  const totalValue =
    cart.reduce(
      (sum,item) =>
        sum +
        Number(item.price || 0) *
        item.qty,
      0
    );


  const message =
`🛍️ *NUEVO PEDIDO - AQUÍ TÁI*

${lines.join("\n")}

💰 *Total: Bs ${totalValue.toFixed(2)}*

👤 Cliente: ${name}
📍 Entrega: ${addr}`;


  const whatsappURL =
    "https://wa.me/59171440907?text=" +
    encodeURIComponent(message);


  window.location.href =
    whatsappURL;

}


/* ==========================================
   SEGURIDAD PARA TEXTO HTML
   ========================================== */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* ==========================================
   INICIAR
   ========================================== */

loadProducts();

</script>

</body>
</html>
