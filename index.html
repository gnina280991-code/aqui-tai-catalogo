<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aquí tái | Tienda en Línea</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  
  <style>
    /* VARIABLES DE TEMA (MODO NOCTURNO POR DEFECTO) */
    :root {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --accent-color: #ff9d00;
      --whatsapp-color: #25d366;
    }

    /* VISTA TEMA CLARO */
    body.light-mode {
      --bg-main: #f1f5f9;
      --bg-card: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      padding-bottom: 90px;
      transition: background-color 0.3s, color 0.3s;
    }

    /* HEADER */
    header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 16px;
      position: sticky;
      top: 0;
      z-index: 100;
      transition: background-color 0.3s, border-color 0.3s;
    }

    .top-bar {
      max-width: 1000px;
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      height: 45px;
      width: 45px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--border-color);
      background: var(--bg-main);
    }

    .brand-wrap {
      flex: 1;
    }

    .brand {
      font-size: 20px;
      font-weight: 800;
      line-height: 1.1;
    }

    .sub {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* BOTÓN MODO NOCTURNO */
    .theme-toggle-btn {
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-radius: 50%;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .theme-toggle-btn:active { transform: scale(0.9); }

    .search-box {
      max-width: 1000px;
      margin: 0 auto;
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 10px 14px 10px 38px;
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      transition: background-color 0.3s, border-color 0.3s;
    }

    .search-input:focus {
      border-color: var(--accent-color);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      opacity: 0.6;
    }

    /* FILTRO DE CATEGORÍAS */
    .categories-bar {
      max-width: 1000px;
      margin: 12px auto 0;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .categories-bar::-webkit-scrollbar { display: none; }

    .cat-btn {
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: all .2s;
    }

    .cat-btn.active {
      background: var(--accent-color);
      color: #0f172a;
      border-color: var(--accent-color);
    }

    /* GRID DE PRODUCTOS */
    .grid {
      max-width: 1000px;
      margin: 16px auto;
      padding: 0 16px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 14px;
    }

    .prod-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      transition: transform .2s, background-color 0.3s;
    }

    .prod-img {
      width: 100%;
      height: 135px;
      object-fit: cover;
      border-radius: 10px;
      background: var(--bg-main);
      cursor: pointer;
    }

    .prod-title {
      font-size: 14px;
      font-weight: 700;
      margin: 8px 0 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      cursor: pointer;
    }

    .prod-price {
      font-size: 15px;
      font-weight: 800;
      color: var(--accent-color);
      margin-bottom: 8px;
    }

    .btn-add-card {
      width: 100%;
      background: #334155;
      color: #fff;
      border: 0;
      border-radius: 8px;
      padding: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      margin-top: auto;
      transition: background 0.2s;
    }

    body.light-mode .btn-add-card {
      background: #e2e8f0;
      color: #0f172a;
    }

    .btn-add-card:active {
      background: var(--accent-color) !important;
      color: #0f172a !important;
    }

    .btn-load-more {
      grid-column: 1 / -1;
      margin: 16px auto;
      padding: 12px 24px;
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
    }

    /* BOTONES FLOTANTES */
    .cart-float-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--accent-color);
      color: #0f172a;
      border: none;
      border-radius: 30px;
      padding: 12px 20px;
      font-weight: 800;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 10px 25px rgba(255, 157, 0, 0.4);
      cursor: pointer;
      z-index: 200;
      transition: transform 0.2s;
    }

    .cart-float-btn:active { transform: scale(0.95); }

    .cart-badge {
      background: #0f172a;
      color: #fff;
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 12px;
    }

    /* BOTÓN FLOTANTE WHATSAPP (IZQUIERDA) */
    .ws-float-btn {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: var(--whatsapp-color);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(37, 211, 102, 0.4);
      cursor: pointer;
      z-index: 200;
      text-decoration: none;
      transition: transform 0.2s;
    }

    .ws-float-btn:active { transform: scale(0.95); }

    .ws-float-btn svg {
      width: 28px;
      height: 28px;
      fill: currentColor;
    }

    /* MODALES General */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 300;
      padding: 16px;
    }

    .modal.open { display: flex; }

    .modal-content {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      width: min(100%, 460px);
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 800;
      margin: 0;
    }

    .modal-close {
      background: var(--bg-main);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 50%;
      width: 32px;
      height: 32px;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* CARRITO DETALLES */
    .cart-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border-color);
    }

    .cart-item-img {
      width: 50px;
      height: 50px;
      border-radius: 8px;
      object-fit: cover;
      background: var(--bg-main);
    }

    .cart-item-info { flex: 1; }
    .cart-item-title { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
    .cart-item-price { font-size: 13px; color: var(--accent-color); font-weight: 700; }

    .cart-item-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-qty {
      background: var(--bg-main);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      width: 28px;
      height: 28px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .cart-total-box {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 2px dashed var(--border-color);
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      font-weight: 800;
    }

    .modal-gallery {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      margin-bottom: 16px;
      padding-bottom: 4px;
    }

    .modal-img {
      width: 130px;
      height: 130px;
      border-radius: 12px;
      object-fit: cover;
      border: 1px solid var(--border-color);
      flex-shrink: 0;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .modal-img:hover {
      transform: scale(1.03);
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border-color);
      font-size: 14px;
    }

    .detail-desc-title { margin-top: 14px; font-weight: 700; font-size: 14px; }
    .detail-desc { margin-top: 6px; line-height: 1.5; color: var(--text-muted); font-size: 14px; white-space: pre-line; }

    .btn-ws {
      width: 100%;
      background: var(--whatsapp-color);
      color: #fff;
      border: 0;
      border-radius: 12px;
      padding: 14px;
      font-weight: 800;
      font-size: 15px;
      margin-top: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-add-modal {
      width: 100%;
      background: var(--accent-color);
      color: #0f172a;
      border: 0;
      border-radius: 12px;
      padding: 12px;
      font-weight: 800;
      font-size: 15px;
      margin-top: 10px;
      cursor: pointer;
    }

    /* VISOR LIGHTBOX (PANTALLA COMPLETA) */
    .lightbox-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 500;
      padding: 16px;
    }

    .lightbox-modal.open {
      display: flex;
    }

    .lightbox-img {
      max-width: 90vw;
      max-height: 80vh;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      border: 0;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 20px;
      cursor: pointer;
    }

    .lightbox-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      border: 0;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lightbox-btn.prev { left: 16px; }
    .lightbox-btn.next { right: 16px; }

    .lightbox-counter {
      position: absolute;
      bottom: 20px;
      color: #fff;
      font-size: 14px;
      background: rgba(0,0,0,0.5);
      padding: 6px 14px;
      border-radius: 20px;
    }
  </style>
</head>
<body>

  <header>
    <div class="top-bar">
      <img class="logo" src="logo.png" alt="Logo" loading="lazy" decoding="async" onerror="this.style.display='none'">
      <div class="brand-wrap">
        <div class="brand">Aquí tái</div>
        <div class="sub">Catálogo Oficial · Bolivia</div>
      </div>
      
      <button class="theme-toggle-btn" id="themeBtn" onclick="toggleTheme()" title="Cambiar tema">🌙</button>
    </div>

    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" class="search-input" placeholder="Buscar producto..." oninput="filterProducts()">
    </div>

    <div class="categories-bar" id="categoriesBar">
      <button class="cat-btn active" onclick="selectCategory('all', this)">Todos</button>
    </div>
  </header>

  <main class="grid" id="catalogGrid">
    <div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-muted);">⏳ Cargando catálogo...</div>
  </main>

  <a href="#" id="wsDirectLink" class="ws-float-btn" target="_blank" title="Consultar por WhatsApp">
    <svg viewBox="0 0 32 32">
      <path d="M16 2a13 13 0 0 0-11 20L3 29l7.2-1.9A13 13 0 1 0 16 2zm0 23.8a10.8 10.8 0 0 1-5.5-1.5l-.4-.2-4.1 1.1 1.1-4-.3-.4a10.8 10.8 0 1 1 9.2 5zm6-8.1c-.3-.2-1.9-.9-2.2-1s-.5-.2-.7.2-.8 1-1 1.2-.4.2-.7 0a9 9 0 0 1-2.6-1.6 9.8 9.8 0 0 1-1.8-2.2c-.2-.3 0-.5.1-.7l.5-.6c.2-.2.2-.4.3-.6a.6.6 0 0 0 0-.6c-.1-.2-.7-1.7-.9-2.3s-.5-.5-.7-.5h-.6a1.2 1.2 0 0 0-.9.4 3.7 3.7 0 0 0-1.1 2.7 6.4 6.4 0 0 0 1.3 3.4 14.7 14.7 0 0 0 5.6 5c2.3 1 2.8.8 3.3.8a2.8 2.8 0 0 0 1.9-1.3 2.3 2.3 0 0 0 .2-1.3c-.1-.2-.4-.3-.7-.5z"/>
    </svg>
  </a>

  <button class="cart-float-btn" onclick="openCartModal()">
    🛒 Ver Carrito
    <span class="cart-badge" id="cartCount">0</span>
  </button>

  <div id="viewModal" class="modal" onclick="if(event.target===this)closeModal('viewModal')">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle" class="modal-title">-</h3>
        <button class="modal-close" onclick="closeModal('viewModal')">✕</button>
      </div>

      <div id="modalGallery" class="modal-gallery"></div>

      <div class="detail-row">
        <span>🏷️ Categoría:</span>
        <span id="modalCat" style="font-weight:700;">-</span>
      </div>

      <div class="detail-row">
        <span>💵 Precio:</span>
        <span id="modalPrice" style="color: var(--accent-color); font-weight:800;">-</span>
      </div>

      <div class="detail-row">
        <span>📦 Stock disponible:</span>
        <span id="modalStock" style="font-weight:700;">-</span>
      </div>

      <div class="detail-desc-title">📝 Descripción / Características:</div>
      <div id="modalDesc" class="detail-desc"></div>

      <button class="btn-add-modal" onclick="addCurrentProductToCart()">🛒 Agregar al Carrito</button>
      <button class="btn-ws" onclick="orderSingleWhatsapp()">💬 Pedir directamente</button>
    </div>
  </div>

  <div id="cartModal" class="modal" onclick="if(event.target===this)closeModal('cartModal')">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">🛒 Mi Carrito de Compras</h3>
        <button class="modal-close" onclick="closeModal('cartModal')">✕</button>
      </div>

      <div id="cartList"></div>

      <div class="cart-total-box">
        <span>Total a pagar:</span>
        <span id="cartTotal" style="color: var(--accent-color);">Bs 0.00</span>
      </div>

      <button class="btn-ws" onclick="checkoutCartWhatsapp()">
        💬 Finalizar pedido por WhatsApp
      </button>
    </div>
  </div>

  <div id="lightboxModal" class="lightbox-modal" onclick="if(event.target===this)closeLightbox()">
    <button class="lightbox-close" onclick="closeLightbox()">✕</button>
    <button class="lightbox-btn prev" onclick="changeLightboxImg(-1)">◀</button>
    <img id="lightboxImg" class="lightbox-img" src="" alt="Vista Completa" loading="eager" decoding="async">
    <button class="lightbox-btn next" onclick="changeLightboxImg(1)">▶</button>
    <div id="lightboxCounter" class="lightbox-counter">1 / 1</div>
  </div>

  <script>
    const SUPABASE_URL = "https://ztsthkoejosgwkhmzfbd.supabase.co";
    const SUPABASE_KEY = "sb_publishable_PUxkUNfWJbdoNYuYGynqAA_3Z02D4MA";
    const PHONE_NUMBER = "59171440907";
    const PAGE_SIZE = 20;

    let supabaseClient = null;
    let products = [];
    let cart = [];
    let currentCategory = 'all';
    let currentSelectedProduct = null;
    let activeGalleryImages = [];
    let activeImageIndex = 0;
    let currentPage = 0;
    let hasMoreProducts = true;

    const lightboxModal = document.getElementById("lightboxModal");
    const lightboxImg = document.getElementById("lightboxImg");
    const lightboxCounter = document.getElementById("lightboxCounter");

    document.getElementById("wsDirectLink").href = `https://wa.me/${PHONE_NUMBER}?text=${encodeURIComponent('¡Hola! Vengo desde el catálogo online y quisiera hacer una consulta.')}`;

    function initTheme() {
      const savedTheme = localStorage.getItem("theme");
      const btn = document.getElementById("themeBtn");
      if (savedTheme === "light") {
        document.body.classList.add("light-mode");
        btn.textContent = "☀️";
      } else {
        btn.textContent = "🌙";
      }
    }

    function toggleTheme() {
      const btn = document.getElementById("themeBtn");
      const isLight = document.body.classList.toggle("light-mode");
      localStorage.setItem("theme", isLight ? "light" : "dark");
      btn.textContent = isLight ? "☀️" : "🌙";
    }

    async function loadCatalog(loadMore = false) {
      if (!supabaseClient) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }

      const grid = document.getElementById("catalogGrid");
      if (!loadMore) {
        currentPage = 0;
        products = [];
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-muted);">⏳ Cargando catálogo...</div>`;
      }

      const from = currentPage * PAGE_SIZE;
      const to = from + PAGE_SIZE - 1;

      try {
        const { data, error } = await supabaseClient
          .from("products")
          .select("id, name, price, stock, category, description, images, image")
          .order("id", { ascending: false })
          .range(from, to);

        if (error) throw error;

        if (data.length < PAGE_SIZE) {
          hasMoreProducts = false;
        } else {
          hasMoreProducts = true;
        }

        products = loadMore ? [...products, ...data] : data;
        buildCategoriesMenu();
        filterProducts();
      } catch (e) {
        grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding: 30px;">❌ Error al cargar los productos.</div>`;
      }
    }

    function buildCategoriesMenu() {
      const bar = document.getElementById("categoriesBar");
      const categories = [...new Set(products.map(p => p.category).filter(Boolean))];

      let html = `<button class="cat-btn ${currentCategory === 'all' ? 'active' : ''}" onclick="selectCategory('all', this)">Todos</button>`;
      categories.forEach(cat => {
        const active = currentCategory === cat ? 'active' : '';
        html += `<button class="cat-btn ${active}" onclick="selectCategory('${escapeHTML(cat)}', this)">${escapeHTML(cat)}</button>`;
      });

      bar.innerHTML = html;
    }

    function selectCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      filterProducts();
    }

    function filterProducts() {
      const query = document.getElementById("searchInput").value.toLowerCase();

      const filtered = products.filter(p => {
        const matchesCat = currentCategory === 'all' || p.category === currentCategory;
        const text = [p.name, p.category, p.description].filter(Boolean).join(" ").toLowerCase();
        return matchesCat && (!query || text.includes(query));
      });

      renderCatalog(filtered);
    }

    function renderCatalog(list) {
      const grid = document.getElementById("catalogGrid");
      if (!list.length) {
        grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; color:var(--text-muted); padding:30px;">No se encontraron productos.</div>`;
        return;
      }

      let html = list.map(p => {
        const images = getImagesArray(p);
        const mainImg = images[0] || 'https://via.placeholder.com/300?text=Sin+Imagen';

        return `
          <div class="prod-card">
            <img class="prod-img" src="${escapeHTML(mainImg)}" alt="Foto" loading="lazy" decoding="async" onclick="openModal(${p.id})">
            <div class="prod-title" onclick="openModal(${p.id})">${escapeHTML(p.name)}</div>
            <div class="prod-price">Bs ${Number(p.price || 0).toFixed(2)}</div>
            <button class="btn-add-card" onclick="addToCart(${p.id})">+ Agregar al carrito</button>
          </div>
        `;
      }).join("");

      if (hasMoreProducts && currentCategory === 'all' && !document.getElementById("searchInput").value) {
        html += `<button class="btn-load-more" onclick="loadNextPage()">Cargar más productos</button>`;
      }

      grid.innerHTML = html;
    }

    function loadNextPage() {
      currentPage++;
      loadCatalog(true);
    }

    function addToCart(id) {
      const p = products.find(x => x.id === id);
      if (!p) return;

      const item = cart.find(x => x.id === id);
      if (item) {
        item.qty += 1;
      } else {
        cart.push({ ...p, qty: 1 });
      }

      updateCartBadge();
    }

    function addCurrentProductToCart() {
      if (currentSelectedProduct) {
        addToCart(currentSelectedProduct.id);
        closeModal('viewModal');
      }
    }

    function changeQty(id, delta) {
      const item = cart.find(x => x.id === id);
      if (!item) return;

      item.qty += delta;
      if (item.qty <= 0) {
        cart = cart.filter(x => x.id !== id);
      }

      updateCartBadge();
      renderCart();
    }

    function updateCartBadge() {
      const count = cart.reduce((acc, item) => acc + item.qty, 0);
      document.getElementById("cartCount").textContent = count;
    }

    function openCartModal() {
      renderCart();
      document.getElementById("cartModal").classList.add("open");
    }

    function renderCart() {
      const cartList = document.getElementById("cartList");
      const cartTotal = document.getElementById("cartTotal");

      if (!cart.length) {
        cartList.innerHTML = `<div style="text-align:center; color:var(--text-muted); padding:20px;">El carrito está vacío.</div>`;
        cartTotal.textContent = "Bs 0.00";
        return;
      }

      let total = 0;
      cartList.innerHTML = cart.map(item => {
        const itemTotal = (item.price || 0) * item.qty;
        total += itemTotal;
        const images = getImagesArray(item);
        const img = images[0] || 'https://via.placeholder.com/100?text=Sin+Imagen';

        return `
          <div class="cart-item">
            <img src="${escapeHTML(img)}" class="cart-item-img" loading="lazy" decoding="async">
            <div class="cart-item-info">
              <div class="cart-item-title">${escapeHTML(item.name)}</div>
              <div class="cart-item-price">Bs ${Number(item.price || 0).toFixed(2)}</div>
            </div>
            <div class="cart-item-controls">
              <button class="btn-qty" onclick="changeQty(${item.id}, -1)">-</button>
              <span style="font-weight:bold; font-size:14px;">${item.qty}</span>
              <button class="btn-qty" onclick="changeQty(${item.id}, 1)">+</button>
            </div>
          </div>
        `;
      }).join("");

      cartTotal.textContent = "Bs " + total.toFixed(2);
    }

    function checkoutCartWhatsapp() {
      if (!cart.length) return alert("Tu carrito está vacío.");

      let msg = "¡Hola! Quisiera realizar el pedido de los siguientes productos:\n\n";
      let total = 0;

      cart.forEach((item, index) => {
        const sub = (item.price || 0) * item.qty;
        total += sub;
        msg += `${index + 1}. *${item.name}* x${item.qty} - Bs ${sub.toFixed(2)}\n`;
      });

      msg += `\n*Total a pagar: Bs ${total.toFixed(2)}*`;
      msg += "\n\n¿Me confirman la disponibilidad para coordinar el envío?";

      window.open(`https://wa.me/${PHONE_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    function openModal(id) {
      const p = products.find(x => x.id === id);
      if (!p) return;

      currentSelectedProduct = p;
      activeGalleryImages = getImagesArray(p);

      document.getElementById("modalTitle").textContent = p.name || "Producto";
      document.getElementById("modalCat").textContent = p.category || "General";
      document.getElementById("modalPrice").textContent = "Bs " + Number(p.price || 0).toFixed(2);
      document.getElementById("modalStock").textContent = (p.stock || 0) + " unidades";
      document.getElementById("modalDesc").textContent = p.description || "Sin descripción registrada.";

      const gallery = document.getElementById("modalGallery");

      if (activeGalleryImages.length) {
        gallery.innerHTML = activeGalleryImages.map((img, idx) => `
          <img src="${escapeHTML(img)}" class="modal-img" loading="lazy" decoding="async" onclick="openLightbox(${idx})">
        `).join("");
        gallery.style.display = "flex";
      } else {
        gallery.style.display = "none";
      }

      document.getElementById("viewModal").classList.add("open");
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove("open");
    }

    function openLightbox(index) {
      if (!activeGalleryImages || !activeGalleryImages.length) return;
      activeImageIndex = index;
      updateLightbox();
      lightboxModal.classList.add("open");
    }

    function closeLightbox() {
      lightboxModal.classList.remove("open");
    }

    function changeLightboxImg(step) {
      activeImageIndex += step;
      if (activeImageIndex < 0) {
        activeImageIndex = activeGalleryImages.length - 1;
      } else if (activeImageIndex >= activeGalleryImages.length) {
        activeImageIndex = 0;
      }
      updateLightbox();
    }

    function updateLightbox() {
      lightboxImg.src = activeGalleryImages[activeImageIndex];
      lightboxCounter.textContent = `${activeImageIndex + 1} / ${activeGalleryImages.length}`;
    }

    function orderSingleWhatsapp() {
      if (!currentSelectedProduct) return;
      const msg = `¡Hola! Quisiera comprar el producto: *${currentSelectedProduct.name}* (Bs ${Number(currentSelectedProduct.price).toFixed(2)}). ¿Tienen disponibilidad?`;
      window.open(`https://wa.me/${PHONE_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    function getImagesArray(product) {
      if (Array.isArray(product.images)) return product.images;
      if (typeof product.images === 'string') {
        try { return JSON.parse(product.images); } catch (e) {}
      }
      if (product.image) return [product.image];
      return [];
    }

    function escapeHTML(str) {
      return String(str || '')
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    document.addEventListener("DOMContentLoaded", () => {
      initTheme();
      loadCatalog();
    });
  </script>
</body>
</html>
