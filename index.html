<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://ztsthkoejosgwkhmz.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_PUxkUNfWJbdoNYuYGynqAA_3Z02D4MA";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   VARIABLES
========================================================= */

let products = [];

let cart = [];

let galleryStates = {};

let currentLightboxImages = [];

let currentLightboxIndex = 0;


/* =========================================================
   ELEMENTOS
========================================================= */

const grid =
  document.getElementById("grid");

const search =
  document.getElementById("search");

const count =
  document.getElementById("count");

const cartItems =
  document.getElementById("cartItems");

const total =
  document.getElementById("total");

const panel =
  document.getElementById("panel");

const customer =
  document.getElementById("customer");

const address =
  document.getElementById("address");

const productCount =
  document.getElementById("productCount");

const lightbox =
  document.getElementById("lightbox");

const lightboxImage =
  document.getElementById("lightboxImage");

const lightboxCounter =
  document.getElementById("lightboxCounter");

const lightboxPrev =
  document.getElementById("lightboxPrev");

const lightboxNext =
  document.getElementById("lightboxNext");


/* =========================================================
   CONVERTIR CAMPO IMAGE A ARRAY
========================================================= */

function getImages(value){

  if(!value){
    return [];
  }

  if(Array.isArray(value)){

    return value
      .map(x => String(x).trim())
      .filter(Boolean);

  }

  const text =
    String(value).trim();

  if(!text){
    return [];
  }

  /* JSON */

  if(
    text.startsWith("[") &&
    text.endsWith("]")
  ){

    try{

      const parsed =
        JSON.parse(text);

      if(Array.isArray(parsed)){

        return parsed
          .map(x => String(x).trim())
          .filter(Boolean);

      }

    }catch(error){

      console.log(
        "El campo image no contiene JSON válido."
      );

    }

  }

  /* Saltos de línea */

  if(text.includes("\n")){

    return text
      .split(/\r?\n/)
      .map(x => x.trim())
      .filter(Boolean);

  }

  /* Comas */

  if(text.includes(",")){

    return text
      .split(",")
      .map(x => x.trim())
      .filter(Boolean);

  }

  return [text];

}


/* =========================================================
   ESCAPAR HTML
========================================================= */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   CARGAR PRODUCTOS
========================================================= */

async function loadProducts(){

  grid.innerHTML = `
    <div class="loading">
      ⏳ Cargando productos...
    </div>
  `;

  productCount.textContent =
    "Cargando catálogo...";


  try{

    /*
      IMPORTANTE:

      No utilizamos .select("campos específicos")
      para evitar errores si tu tabla tiene
      columnas adicionales.

      El cliente público solo verá productos
      que tengan active = true.
    */

    const result =
      await supabaseClient
        .from("products")
        .select("*")
        .eq("active", true)
        .order("id", {
          ascending:false
        });


    const data =
      result.data;

    const error =
      result.error;


    if(error){

      console.error(
        "SUPABASE ERROR:",
        error
      );


      grid.innerHTML = `

        <div class="error">

          <strong>
            ❌ No se pudieron cargar los productos.
          </strong>

          La tabla <b>products</b> no permite
          actualmente la lectura pública.

          <br><br>

          Debes habilitar una política
          <b>SELECT</b> para usuarios públicos
          en Supabase.

        </div>

      `;


      productCount.textContent =
        "No se pudo cargar el catálogo.";

      return;

    }


    products =
      data || [];


    galleryStates = {};


    products.forEach(product => {

      const images =
        getImages(product.image);


      galleryStates[product.id] = {

        images:images,

        index:0

      };

    });


    render(products);


  }catch(error){

    console.error(
      "ERROR:",
      error
    );


    grid.innerHTML = `

      <div class="error">

        <strong>
          ❌ Error al cargar el catálogo.
        </strong>

        Comprueba la conexión con Supabase.

      </div>

    `;


    productCount.textContent =
      "Error al cargar catálogo.";

  }

}


/* =========================================================
   GALERÍA HTML
========================================================= */

function galleryHTML(product){

  let images =
    getImages(product.image);


  const fallback =
    "https://via.placeholder.com/800x800?text=Aqui+tai";


  if(!images.length){

    images = [fallback];

  }


  if(!galleryStates[product.id]){

    galleryStates[product.id] = {

      images:images,

      index:0

    };

  }


  const state =
    galleryStates[product.id];


  state.images =
    images;


  if(
    state.index < 0 ||
    state.index >= images.length
  ){

    state.index = 0;

  }


  const current =
    images[state.index];


  /* UNA FOTO */

  if(images.length === 1){

    return `

      <div class="gallery single">

        <div
          class="main-image-wrap"
          onclick="openLightbox(${Number(product.id)},0)"
        >

          <img
            id="main-image-${Number(product.id)}"
            class="main-image"
            src="${escapeHTML(current)}"
            alt="${escapeHTML(product.name)}"
            loading="lazy"
            onerror="
              this.src='https://via.placeholder.com/800x800?text=Sin+imagen'
            "
          >

        </div>

      </div>

    `;

  }


  /* VARIAS FOTOS */

  return `

    <div
      id="gallery-${Number(product.id)}"
      class="gallery"
    >

      <div
        class="main-image-wrap"
        onclick="openLightbox(${Number(product.id)},${state.index})"
      >

        <img
          id="main-image-${Number(product.id)}"
          class="main-image"
          src="${escapeHTML(current)}"
          alt="${escapeHTML(product.name)}"
          loading="lazy"
          onerror="
            this.src='https://via.placeholder.com/800x800?text=Sin+imagen'
          "
        >


        <button
          class="gallery-arrow left"
          onclick="
            event.stopPropagation();
            changeGallery(${Number(product.id)},-1)
          "
        >
          ‹
        </button>


        <button
          class="gallery-arrow right"
          onclick="
            event.stopPropagation();
            changeGallery(${Number(product.id)},1)
          "
        >
          ›
        </button>


        <div
          id="counter-${Number(product.id)}"
          class="photo-counter"
        >
          📷 ${state.index + 1} / ${images.length}
        </div>

      </div>


      <div
        id="thumbs-${Number(product.id)}"
        class="thumbnails"
      >

        ${images.map((image,index) => `

          <button
            class="thumb ${index === state.index ? "active" : ""}"
            onclick="
              event.stopPropagation();
              selectGalleryImage(${Number(product.id)},${index})
            "
          >

            <img
              src="${escapeHTML(image)}"
              alt="Foto ${index + 1}"
              loading="lazy"
              onerror="
                this.src='https://via.placeholder.com/100x100?text=Foto'
              "
            >

          </button>

        `).join("")}

      </div>


      <div class="photo-info">
        📷 ${images.length}
        ${images.length === 1 ? "foto" : "fotos"}
      </div>

    </div>

  `;

}


/* =========================================================
   RENDER
========================================================= */

function render(list){

  productCount.textContent =
    list.length === 1
      ? "1 producto disponible."
      : `${list.length} productos disponibles.`;


  if(!list.length){

    grid.innerHTML = `

      <div class="loading">

        🔎 No encontramos productos.

        <br><br>

        Prueba con otro nombre o categoría.

      </div>

    `;

    return;

  }


  grid.innerHTML =
    list.map(product => {

      const stock =
        Number(product.stock || 0);


      return `

        <article class="card">

          ${galleryHTML(product)}

          <div class="body">

            <div class="cat">
              ${escapeHTML(
                product.category ||
                "Sin categoría"
              )}
            </div>


            <div class="name">
              ${escapeHTML(
                product.name ||
                "Producto"
              )}
            </div>


            <div class="desc">

              ${escapeHTML(
                product.description ||
                ""
              )}

            </div>


            <div class="price">

              Bs ${Number(
                product.price || 0
              ).toFixed(2)}

            </div>


            ${
              stock > 0

              ? `
                <div class="stock">
                  📦 Stock: ${stock}
                </div>
              `

              : `
                <div class="stock out">
                  ❌ Agotado
                </div>
              `
            }


            <button
              class="btn"
              ${stock <= 0 ? "disabled" : ""}
              onclick="add(${Number(product.id)})"
            >

              ${
                stock > 0
                  ? "🛒 Agregar al carrito"
                  : "Agotado"
              }

            </button>

          </div>

        </article>

      `;

    }).join("");

}


/* =========================================================
   CAMBIAR FOTO
========================================================= */

function changeGallery(id,direction){

  const state =
    galleryStates[id];


  if(!state){
    return;
  }


  const total =
    state.images.length;


  if(total <= 1){
    return;
  }


  state.index += direction;


  if(state.index < 0){

    state.index =
      total - 1;

  }


  if(state.index >= total){

    state.index = 0;

  }


  updateGallery(id);

}


/* =========================================================
   SELECCIONAR FOTO
========================================================= */

function selectGalleryImage(id,index){

  const state =
    galleryStates[id];


  if(!state){
    return;
  }


  if(
    index < 0 ||
    index >= state.images.length
  ){

    return;

  }


  state.index =
    index;


  updateGallery(id);

}


/* =========================================================
   ACTUALIZAR GALERÍA
========================================================= */

function updateGallery(id){

  const state =
    galleryStates[id];


  if(!state){
    return;
  }


  const image =
    state.images[state.index];


  const mainImage =
    document.getElementById(
      "main-image-" + id
    );


  const counter =
    document.getElementById(
      "counter-" + id
    );


  const thumbs =
    document.querySelectorAll(
      "#thumbs-" + id + " .thumb"
    );


  if(mainImage){

    mainImage.src =
      image;

  }


  if(counter){

    counter.textContent =
      "📷 " +
      (state.index + 1) +
      " / " +
      state.images.length;

  }


  thumbs.forEach(
    (thumb,index) => {

      thumb.classList.toggle(
        "active",
        index === state.index
      );

    }
  );

}


/* =========================================================
   LIGHTBOX
========================================================= */

function openLightbox(id,index){

  const state =
    galleryStates[id];


  if(!state){
    return;
  }


  currentLightboxImages =
    state.images;


  currentLightboxIndex =
    index;


  updateLightbox();


  lightbox.classList.add("open");

  document.body.style.overflow =
    "hidden";

}


function updateLightbox(){

  if(!currentLightboxImages.length){
    return;
  }


  lightboxImage.src =
    currentLightboxImages[
      currentLightboxIndex
    ];


  lightboxCounter.textContent =
    `${currentLightboxIndex + 1} / ${currentLightboxImages.length}`;


  if(currentLightboxImages.length <= 1){

    lightboxPrev.style.display =
      "none";

    lightboxNext.style.display =
      "none";

  }else{

    lightboxPrev.style.display =
      "flex";

    lightboxNext.style.display =
      "flex";

  }

}


function changeLightboxImage(direction){

  if(currentLightboxImages.length <= 1){
    return;
  }


  currentLightboxIndex +=
    direction;


  if(currentLightboxIndex < 0){

    currentLightboxIndex =
      currentLightboxImages.length - 1;

  }


  if(
    currentLightboxIndex >=
    currentLightboxImages.length
  ){

    currentLightboxIndex = 0;

  }


  updateLightbox();

}


function closeLightbox(){

  lightbox.classList.remove("open");

  document.body.style.overflow =
    "";

}


function closeLightboxIfBackground(event){

  if(event.target === lightbox){

    closeLightbox();

  }

}


/* =========================================================
   TECLADO
========================================================= */

document.addEventListener(
  "keydown",
  function(event){

    if(
      !lightbox.classList.contains("open")
    ){
      return;
    }


    if(event.key === "Escape"){

      closeLightbox();

    }


    if(event.key === "ArrowLeft"){

      changeLightboxImage(-1);

    }


    if(event.key === "ArrowRight"){

      changeLightboxImage(1);

    }

  }
);


/* =========================================================
   SWIPE
========================================================= */

let touchStartX = 0;

let touchEndX = 0;


lightbox.addEventListener(
  "touchstart",
  function(event){

    touchStartX =
      event.changedTouches[0].screenX;

  },
  {
    passive:true
  }
);


lightbox.addEventListener(
  "touchend",
  function(event){

    touchEndX =
      event.changedTouches[0].screenX;


    const difference =
      touchStartX - touchEndX;


    if(Math.abs(difference) < 50){
      return;
    }


    if(difference > 0){

      changeLightboxImage(1);

    }else{

      changeLightboxImage(-1);

    }

  },
  {
    passive:true
  }
);


/* =========================================================
   BÚSQUEDA
========================================================= */

search.addEventListener(
  "input",
  function(){

    const q =
      search.value
        .trim()
        .toLowerCase();


    if(!q){

      render(products);

      return;

    }


    const filtered =
      products.filter(product => {

        const text =
          [
            product.name,
            product.description,
            product.category
          ]
          .filter(Boolean)
          .join(" ")
          .toLowerCase();


        return text.includes(q);

      });


    render(filtered);

  }
);


/* =========================================================
   CARRITO - AGREGAR
========================================================= */

function add(id){

  const product =
    products.find(
      p =>
        Number(p.id) ===
        Number(id)
    );


  if(!product){

    alert(
      "Producto no encontrado."
    );

    return;

  }


  const stock =
    Number(product.stock || 0);


  if(stock <= 0){

    alert(
      "Este producto está agotado."
    );

    return;

  }


  const existing =
    cart.find(
      item =>
        Number(item.id) ===
        Number(id)
    );


  if(existing){

    if(existing.qty >= stock){

      alert(
        "No hay más unidades disponibles."
      );

      return;

    }


    existing.qty++;

  }else{

    cart.push({

      ...product,

      qty:1

    });

  }


  updateCart();

  openCart();

}


/* =========================================================
   ACTUALIZAR CARRITO
========================================================= */

function updateCart(){

  const quantity =
    cart.reduce(
      (sum,item) =>
        sum + Number(item.qty),
      0
    );


  count.textContent =
    quantity;


  if(!cart.length){

    cartItems.innerHTML =
      "<p>Tu carrito está vacío.</p>";


    total.textContent =
      "Total: Bs 0.00";


    return;

  }


  cartItems.innerHTML =
    cart.map((item,index) => {

      const subtotal =
        Number(item.price || 0) *
        Number(item.qty || 0);


      return `

        <div class="row">

          <div>

            <strong>
              ${escapeHTML(item.name)}
            </strong>

            <br>

            Bs ${Number(
              item.price || 0
            ).toFixed(2)}

            × ${item.qty}

            <br><br>

            <b>
              Subtotal:
              Bs ${subtotal.toFixed(2)}
            </b>

          </div>


          <button
            onclick="removeItem(${index})"
          >
            🗑️
          </button>

        </div>

      `;

    }).join("");


  const grandTotal =
    cart.reduce(
      (sum,item) =>
        sum +
        Number(item.price || 0) *
        Number(item.qty || 0),
      0
    );


  total.textContent =
    "Total: Bs " +
    grandTotal.toFixed(2);

}


/* =========================================================
   ELIMINAR
========================================================= */

function removeItem(index){

  cart.splice(index,1);

  updateCart();

}


/* =========================================================
   ABRIR / CERRAR CARRITO
========================================================= */

function openCart(){

  panel.classList.add("open");

  updateCart();

}


function closeCart(){

  panel.classList.remove("open");

}


/* =========================================================
   WHATSAPP
========================================================= */

function sendWhatsApp(){

  if(!cart.length){

    alert(
      "Agrega al menos un producto."
    );

    return;

  }


  const name =
    customer.value.trim() ||
    "No indicado";


  const addr =
    address.value.trim() ||
    "No indicada";


  const grandTotal =
    cart.reduce(
      (sum,item) =>
        sum +
        Number(item.price || 0) *
        Number(item.qty || 0),
      0
    );


  let message =
    "🛍️ *NUEVO PEDIDO - AQUÍ TÁI*\n\n";


  cart.forEach(item => {

    const subtotal =
      Number(item.price || 0) *
      Number(item.qty || 0);


    message +=
      "• " +
      item.name +
      " × " +
      item.qty +
      " = Bs " +
      subtotal.toFixed(2) +
      "\n";

  });


  message +=
    "\n💰 *Total: Bs " +
    grandTotal.toFixed(2) +
    "*";


  message +=
    "\n👤 Cliente: " +
    name;


  message +=
    "\n📍 Entrega: " +
    addr;


  const whatsappURL =
    "https://wa.me/59171440907?text=" +
    encodeURIComponent(message);


  window.location.href =
    whatsappURL;

}

updateCart();

loadProducts();
