<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Aquí tái | Catálogo</title>

<meta
  name="description"
  content="Catálogo de productos Aquí tái - Bolivia"
>

<meta name="theme-color" content="#ff9d00">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root{
  --bg:#f6f7f9;
  --card:#ffffff;
  --text:#171717;
  --muted:#707070;
  --border:#e7e7e7;
  --primary:#ff9d00;
  --primary-dark:#e88900;
  --danger:#d92323;
  --success:#159447;
  --shadow:0 8px 25px rgba(0,0,0,.08);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  transition:.25s;
}

body.light-mode{
  --bg:#f6f7f9;
  --card:#ffffff;
  --text:#171717;
  --muted:#707070;
  --border:#e7e7e7;
}

body:not(.light-mode){
  --bg:#101010;
  --card:#1a1a1a;
  --text:#f5f5f5;
  --muted:#aaa;
  --border:#303030;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

img{
  max-width:100%;
}

.container{
  width:min(1150px,94%);
  margin:auto;
}

/* =========================
   HEADER
========================= */

header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
}

body:not(.light-mode) header{
  background:rgba(16,16,16,.94);
}

.header-inner{
  min-height:74px;
  display:flex;
  align-items:center;
  gap:14px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  flex-shrink:0;
}

.logo{
  width:54px;
  height:54px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid var(--primary);
  background:#fff;
}

.brand-name{
  font-size:23px;
  font-weight:800;
  line-height:1;
}

.brand-sub{
  font-size:11px;
  color:var(--muted);
  margin-top:4px;
}

.header-actions{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:8px;
}

.icon-btn{
  width:42px;
  height:42px;
  border:1px solid var(--border);
  border-radius:50%;
  background:var(--card);
  color:var(--text);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:19px;
}

.icon-btn:hover{
  border-color:var(--primary);
}

/* =========================
   SEARCH
========================= */

.search-area{
  padding:18px 0 12px;
}

.search-row{
  display:flex;
  gap:10px;
}

.search-box{
  position:relative;
  flex:1;
}

.search-box span{
  position:absolute;
  left:15px;
  top:50%;
  transform:translateY(-50%);
  color:var(--muted);
  font-size:18px;
}

#searchInput{
  width:100%;
  height:50px;
  border:1px solid var(--border);
  border-radius:14px;
  padding:0 42px;
  background:var(--card);
  color:var(--text);
  outline:none;
}

#searchInput:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(255,157,0,.12);
}

.clear-search{
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  border:0;
  background:transparent;
  color:var(--muted);
  display:none;
}

.category-box{
  width:220px;
}

#categorySelect{
  width:100%;
  height:50px;
  border:1px solid var(--border);
  border-radius:14px;
  padding:0 13px;
  background:var(--card);
  color:var(--text);
  outline:none;
}

/* =========================
   INFO
========================= */

.catalog-info{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin:8px 0 16px;
}

.results-text{
  color:var(--muted);
  font-size:14px;
}

.loading-text{
  color:var(--primary);
  font-weight:700;
}

/* =========================
   CATEGORY CHIPS
========================= */

.category-chips{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:2px 0 14px;
  scrollbar-width:none;
}

.category-chips::-webkit-scrollbar{
  display:none;
}

.category-chip{
  flex-shrink:0;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  border-radius:999px;
  padding:9px 15px;
  font-size:13px;
}

.category-chip.active{
  background:var(--primary);
  color:#111;
  border-color:var(--primary);
  font-weight:700;
}

/* =========================
   PRODUCT GRID
========================= */

#catalog{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
  gap:17px;
  padding-bottom:35px;
}

.product-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
  box-shadow:var(--shadow);
  position:relative;
  transition:.2s;
  display:flex;
  flex-direction:column;
}

.product-card:hover{
  transform:translateY(-3px);
}

.product-image-wrap{
  position:relative;
  background:#f1f1f1;
  aspect-ratio:1/1;
  overflow:hidden;
}

.product-image{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transition:.3s;
}

.product-card:hover .product-image{
  transform:scale(1.035);
}

.badges{
  position:absolute;
  top:10px;
  left:10px;
  display:flex;
  flex-direction:column;
  gap:6px;
  z-index:2;
}

.badge{
  width:max-content;
  padding:5px 8px;
  border-radius:8px;
  font-size:11px;
  font-weight:800;
  background:var(--primary);
  color:#111;
}

.badge-danger{
  background:#e53935;
  color:#fff;
}

.badge-dark{
  background:#222;
  color:#fff;
}

.product-content{
  padding:13px;
  display:flex;
  flex-direction:column;
  flex:1;
}

.product-category{
  color:var(--primary);
  font-size:11px;
  font-weight:800;
  text-transform:uppercase;
  margin-bottom:6px;
}

.product-name{
  font-size:16px;
  font-weight:800;
  line-height:1.25;
  margin-bottom:7px;
}

.product-description{
  color:var(--muted);
  font-size:12px;
  line-height:1.45;
  margin-bottom:10px;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.price{
  font-size:21px;
  font-weight:900;
  margin-top:auto;
  margin-bottom:10px;
}

.stock-text{
  color:var(--muted);
  font-size:12px;
  margin-bottom:10px;
}

.stock-low{
  color:#e58a00;
  font-weight:700;
}

.stock-out{
  color:var(--danger);
  font-weight:800;
}

.card-actions{
  display:flex;
  gap:8px;
}

.btn{
  border:0;
  border-radius:11px;
  min-height:42px;
  padding:9px 12px;
  font-weight:800;
  transition:.2s;
}

.btn-primary{
  background:var(--primary);
  color:#111;
  flex:1;
}

.btn-primary:hover{
  background:var(--primary-dark);
}

.btn-secondary{
  background:transparent;
  border:1px solid var(--border);
  color:var(--text);
  width:44px;
}

.btn:disabled{
  opacity:.5;
  cursor:not-allowed;
}

/* =========================
   LOAD MORE
========================= */

.load-more-wrap{
  text-align:center;
  padding:5px 0 40px;
}

.load-more{
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  border-radius:13px;
  padding:12px 25px;
  font-weight:800;
}

.load-more:hover{
  border-color:var(--primary);
}

/* =========================
   EMPTY
========================= */

.empty{
  grid-column:1/-1;
  text-align:center;
  padding:60px 20px;
  color:var(--muted);
}

.empty-icon{
  font-size:55px;
  margin-bottom:12px;
}

.empty h3{
  margin:0 0 8px;
  color:var(--text);
}

/* =========================
   FLOATING BUTTONS
========================= */

.floating{
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:900;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.float-btn{
  width:56px;
  height:56px;
  border:0;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  box-shadow:0 8px 25px rgba(0,0,0,.25);
  position:relative;
}

.whatsapp{
  background:#25d366;
  color:#fff;
}

.cart-float{
  background:var(--primary);
  color:#111;
}

.cart-count{
  position:absolute;
  top:-4px;
  right:-3px;
  min-width:22px;
  height:22px;
  padding:0 5px;
  border-radius:20px;
  background:#e53935;
  color:#fff;
  font-size:11px;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* =========================
   MODAL
========================= */

.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.72);
  z-index:2000;
  display:none;
  align-items:flex-end;
  justify-content:center;
  padding:0;
}

.modal-overlay.show{
  display:flex;
}

.modal{
  width:min(720px,100%);
  max-height:94vh;
  overflow-y:auto;
  background:var(--card);
  color:var(--text);
  border-radius:22px 22px 0 0;
  position:relative;
  animation:modalUp .2s ease;
}

@keyframes modalUp{
  from{
    transform:translateY(30px);
    opacity:.5;
  }
  to{
    transform:translateY(0);
    opacity:1;
  }
}

.close-modal{
  position:absolute;
  top:12px;
  right:12px;
  width:40px;
  height:40px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.55);
  color:#fff;
  z-index:20;
  font-size:22px;
}

.modal-body{
  padding:18px;
}

.product-detail-image{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  border-radius:16px;
  background:#eee;
}

.gallery-thumbs{
  display:flex;
  gap:8px;
  overflow-x:auto;
  margin-top:10px;
  padding-bottom:3px;
}

.gallery-thumb{
  width:66px;
  height:66px;
  flex-shrink:0;
  border-radius:9px;
  overflow:hidden;
  border:2px solid transparent;
  padding:0;
  background:#eee;
}

.gallery-thumb.active{
  border-color:var(--primary);
}

.gallery-thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.detail-category{
  color:var(--primary);
  font-size:12px;
  font-weight:800;
  text-transform:uppercase;
  margin-top:18px;
}

.detail-title{
  font-size:27px;
  line-height:1.15;
  margin:5px 0 10px;
}

.detail-price{
  font-size:29px;
  font-weight:900;
  margin-bottom:9px;
}

.detail-stock{
  font-size:13px;
  color:var(--muted);
  margin-bottom:16px;
}

.detail-description{
  color:var(--muted);
  white-space:pre-line;
  line-height:1.55;
  font-size:14px;
  margin-bottom:20px;
}

.detail-actions{
  display:flex;
  gap:10px;
}

.detail-actions .btn{
  flex:1;
}

.share-btn{
  background:transparent;
  color:var(--text);
  border:1px solid var(--border);
}

/* =========================
   CART
========================= */

.cart-list{
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-bottom:20px;
}

.cart-item{
  display:flex;
  gap:10px;
  padding:10px;
  border:1px solid var(--border);
  border-radius:13px;
}

.cart-item-image{
  width:70px;
  height:70px;
  border-radius:10px;
  object-fit:cover;
  background:#eee;
  flex-shrink:0;
}

.cart-item-info{
  flex:1;
  min-width:0;
}

.cart-item-name{
  font-size:14px;
  font-weight:800;
  margin-bottom:4px;
}

.cart-item-price{
  font-size:13px;
  color:var(--muted);
}

.qty-controls{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:7px;
}

.qty-btn{
  width:30px;
  height:30px;
  border-radius:8px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  font-weight:900;
}

.qty-number{
  min-width:22px;
  text-align:center;
  font-weight:800;
}

.remove-item{
  border:0;
  background:transparent;
  color:var(--danger);
  font-size:16px;
}

.cart-summary{
  border-top:1px solid var(--border);
  padding-top:16px;
}

.cart-total{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:20px;
  font-weight:900;
  margin-bottom:14px;
}

.cart-buttons{
  display:flex;
  gap:9px;
}

.cart-buttons .btn{
  flex:1;
}

.clear-cart{
  background:transparent;
  border:1px solid var(--border);
  color:var(--text);
}

/* =========================
   LIGHTBOX
========================= */

.lightbox{
  position:fixed;
  inset:0;
  z-index:3000;
  background:rgba(0,0,0,.96);
  display:none;
  align-items:center;
  justify-content:center;
}

.lightbox.show{
  display:flex;
}

.lightbox-image{
  max-width:94vw;
  max-height:88vh;
  object-fit:contain;
  user-select:none;
}

.lightbox-close{
  position:absolute;
  top:15px;
  right:15px;
  width:45px;
  height:45px;
  border:0;
  border-radius:50%;
  background:rgba(255,255,255,.15);
  color:#fff;
  font-size:24px;
}

.lightbox-nav{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:45px;
  height:45px;
  border:0;
  border-radius:50%;
  background:rgba(255,255,255,.15);
  color:#fff;
  font-size:25px;
}

.lightbox-prev{
  left:15px;
}

.lightbox-next{
  right:15px;
}

.lightbox-counter{
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  color:#fff;
  background:rgba(0,0,0,.5);
  padding:7px 12px;
  border-radius:20px;
  font-size:13px;
}

/* =========================
   TOAST
========================= */

.toast-container{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%);
  z-index:5000;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
  pointer-events:none;
}

.toast{
  background:#222;
  color:#fff;
  padding:12px 16px;
  border-radius:12px;
  box-shadow:0 8px 25px rgba(0,0,0,.3);
  font-size:13px;
  font-weight:700;
  animation:toastIn .2s ease;
  max-width:90vw;
  text-align:center;
}

.toast.success{
  background:#159447;
}

.toast.warning{
  background:#e88900;
  color:#111;
}

.toast.error{
  background:#d92323;
}

@keyframes toastIn{
  from{
    transform:translateY(10px);
    opacity:0;
  }
  to{
    transform:translateY(0);
    opacity:1;
  }
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:700px){

  .header-inner{
    min-height:65px;
  }

  .logo{
    width:46px;
    height:46px;
  }

  .brand-name{
    font-size:19px;
  }

  .brand-sub{
    display:none;
  }

  .search-row{
    flex-direction:column;
  }

  .category-box{
    width:100%;
  }

  #catalog{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
  }

  .product-card{
    border-radius:14px;
  }

  .product-content{
    padding:10px;
  }

  .product-name{
    font-size:14px;
  }

  .product-description{
    font-size:11px;
  }

  .price{
    font-size:18px;
  }

  .btn{
    min-height:40px;
    font-size:12px;
  }

  .detail-title{
    font-size:23px;
  }

  .detail-price{
    font-size:25px;
  }

  .modal{
    max-height:96vh;
  }

}

@media(max-width:380px){

  #catalog{
    grid-template-columns:1fr 1fr;
  }

  .product-description{
    display:none;
  }

  .brand-name{
    font-size:17px;
  }

  .header-actions .icon-btn{
    width:38px;
    height:38px;
  }

}

/* =========================
   DESKTOP MODAL
========================= */

@media(min-width:701px){

  .modal-overlay{
    align-items:center;
    padding:20px;
  }

  .modal{
    border-radius:22px;
    max-height:90vh;
  }

}

</style>
</head>

<body>

<header>

  <div class="container header-inner">

    <div class="brand">

      <img
        class="logo"
        src="https://via.placeholder.com/100x100?text=Aqui+Tai"
        alt="Aquí tái"
        onerror="this.style.display='none'"
      >

      <div>
        <div class="brand-name">🛍️ Aquí tái</div>
        <div class="brand-sub">Catálogo de productos</div>
      </div>

    </div>

    <div class="header-actions">

      <button
        class="icon-btn"
        id="themeBtn"
        aria-label="Cambiar tema"
        title="Cambiar tema"
      >
        ☀️
      </button>

    </div>

  </div>

</header>


<main class="container">

  <section class="search-area">

    <div class="search-row">

      <div class="search-box">

        <span>🔎</span>

        <input
          id="searchInput"
          type="search"
          placeholder="Buscar productos..."
          autocomplete="off"
        >

        <button
          class="clear-search"
          id="clearSearch"
          type="button"
        >
          ✕
        </button>

      </div>

      <div class="category-box">

        <select id="categorySelect">
          <option value="">Todas las categorías</option>
        </select>

      </div>

    </div>

  </section>


  <div
    id="categoryChips"
    class="category-chips"
  ></div>


  <div class="catalog-info">

    <div
      id="resultsText"
      class="results-text"
    >
      Cargando productos...
    </div>

    <div
      id="loadingText"
      class="loading-text"
    ></div>

  </div>


  <section id="catalog"></section>


  <div
    id="loadMoreWrap"
    class="load-more-wrap"
    style="display:none;"
  >

    <button
      id="loadMoreBtn"
      class="load-more"
      type="button"
    >
      Cargar más productos
    </button>

  </div>

</main>


<!-- =========================
     PRODUCT MODAL
========================= -->

<div
  id="productModal"
  class="modal-overlay"
  aria-hidden="true"
>

  <div class="modal">

    <button
      class="close-modal"
      onclick="closeProductModal()"
      aria-label="Cerrar"
    >
      ×
    </button>

    <div class="modal-body">

      <img
        id="detailMainImage"
        class="product-detail-image"
        src=""
        alt=""
        onclick="openLightboxFromDetail()"
      >

      <div
        id="galleryThumbs"
        class="gallery-thumbs"
      ></div>

      <div
        id="detailCategory"
        class="detail-category"
      ></div>

      <h2
        id="detailTitle"
        class="detail-title"
      ></h2>

      <div
        id="detailPrice"
        class="detail-price"
      ></div>

      <div
        id="detailStock"
        class="detail-stock"
      ></div>

      <div
        id="detailDescription"
        class="detail-description"
      ></div>

      <div class="detail-actions">

        <button
          id="detailAddBtn"
          class="btn btn-primary"
          onclick="addCurrentProductToCart()"
        >
          🛒 Agregar al carrito
        </button>

        <button
          class="btn share-btn"
          onclick="shareCurrentProduct()"
        >
          📤 Compartir
        </button>

      </div>

      <div style="height:10px"></div>

      <button
        id="detailWhatsappBtn"
        class="btn"
        style="
          width:100%;
          background:#25d366;
          color:white;
        "
        onclick="orderCurrentProductWhatsApp()"
      >
        💬 Pedir por WhatsApp
      </button>

    </div>

  </div>

</div>


<!-- =========================
     CART MODAL
========================= -->

<div
  id="cartModal"
  class="modal-overlay"
  aria-hidden="true"
>

  <div class="modal">

    <button
      class="close-modal"
      onclick="closeCartModal()"
      aria-label="Cerrar"
    >

/* =========================================================
   CATEGORÍAS

async function fetchCategories(){

  try{

    const { data, error } =
      await supabaseClient
        .from("products")
        .select("category")
        .eq("active", true)
        .not("category", "is", null);

    if(error) throw error;

    const categories =
      [...new Set(
        (data || [])
          .map(p => String(p.category || "").trim())
          .filter(Boolean)
      )]
      .sort((a,b) =>
        a.localeCompare(
          b,
          "es",
          { sensitivity:"base" }
        )
      );

    categorySelect.innerHTML =
      `<option value="">Todas las categorías</option>`;

    categories.forEach(category => {

      const option =
        document.createElement("option");

      option.value = category;

      option.textContent = category;

      categorySelect.appendChild(
        option
      );

    });

    renderCategoryChips();

  }catch(error){

    console.error(
      "Error cargando categorías:",
      error
    );

  }

}


function renderCategoryChips(){

  const selected =
    currentCategory;

  categoryChips.innerHTML = "";

  const all =
    document.createElement("button");

  all.className =
    "category-chip" +
    (!selected ? " active" : "");

  all.textContent =

  all.onclick = () => {

    currentCategory = "";

    categorySelect.value = "";

    renderCategoryChips();

    resetAndLoad();

  };

  categoryChips.appendChild(all);


  [...categorySelect.options]
    .slice(1)
    .forEach(option => {

      const button =
        document.createElement("button");

      button.className =
        "category-chip" +
        (
          selected === option.value
            ? " active"
            : ""
        );

      button.textContent =
        option.textContent;

      button.onclick = () => {

        currentCategory =
          option.value;

        categorySelect.value =
          option.value;

        renderCategoryChips();

        resetAndLoad();

      };

      categoryChips.appendChild(
        button
      );

    });

}


/* =========================================================
   BÚSQUEDA
========================================================= */

function handleSearch(){

  const value =
    searchInput.value.trim();

  clearSearch.style.display =
    value ? "block" : "none";

  clearTimeout(searchTimer);

  searchTimer =
    setTimeout(() => {

}


function clearSearchInput(){

  currentSearch = "";

  clearSearch.style.display =

/* =========================================================
   CARGAR PRODUCTOS
========================================================= */

async function resetAndLoad(){

  currentPage = 0;

  hasMore = true;

  products = [];

  catalog.innerHTML = "";

  loadMoreWrap.style.display =
    "none";

  await loadProducts(true);

}


async function loadProducts(reset = false){

  if(isLoading) return;

  if(!hasMore && !reset) return;

  isLoading = true;

  loadingText.textContent =
    "Cargando...";

  try{

    if(reset){

      currentPage = 0;

      hasMore = true;

      products = [];

    }

    const from =
      currentPage * PAGE_SIZE;

    const to =
      from + PAGE_SIZE - 1;


    let query =
      supabaseClient
        .from("products")
        .select(
          `
          id,
          name,
          price,
          stock,
          category,
          description,
          images,
          image,
          active,
          created_at
          `,
          {
            count:"exact"
          }
        )
        .eq(
          "active",
          true
        )
        .order(
          "created_at",
          {
            ascending:false,
            nullsFirst:false
          }
        );


    if(currentCategory){

      query =
        query.eq(
          "category",
          currentCategory
        );

    }


    if(currentSearch){

      const safe =
        escapeSupabaseSearch(
          currentSearch
        );

      if(safe){

        query =
          query.or(
            `name.ilike.%${safe}%,category.ilike.%${safe}%,description.ilike.%${safe}%`
          );

      }

    }


    const {
      data,
      error,
      count
    } =
      await query.range(
        from,
        to
      );


    if(error) throw error;


    const newProducts =
      data || [];


    if(reset){

      products =
        newProducts;

    }else{

      products =
        products.concat(
          newProducts
        );

    }


    if(
      newProducts.length <
      PAGE_SIZE
    ){

      hasMore = false;

    }else{

      currentPage++;

    }


    renderCatalog();

    if(count !== null){

      resultsText.textContent =
        `${count} producto${count === 1 ? "" : "s"}`;

    }else{

      resultsText.textContent =
        `${products.length} productos`;

    }


  }catch(error){

    console.error(
      "Error cargando productos:",
      error
    );

    if(reset){

      catalog.innerHTML = `
        <div class="empty">
          <div class="empty-icon">⚠️</div>
          <h3>No se pudieron cargar los productos</h3>
          <p>Verifica tu conexión e intenta nuevamente.</p>
          <button
            class="btn btn-primary"
            onclick="resetAndLoad()"
          >
            🔄 Intentar nuevamente
          </button>
        </div>
      `;

    }else{

      showToast(
        "No se pudieron cargar más productos.",
        "error"
      );

    }

  }finally{

    isLoading = false;

    loadingText.textContent = "";

  }

}


/* =========================================================
   SEGURIDAD BÁSICA PARA BÚSQUEDA SUPABASE
========================================================= */

function escapeSupabaseSearch(value){

  return value
    .replace(/[%]/g, "\\%")
    .replace(/[,]/g, "\\,")
    .replace(/[()]/g, "")
    .replace(/\\/g, "\\\\")
    .trim();

}


/* =========================================================
   RENDER CATÁLOGO
========================================================= */

function renderCatalog(){

  catalog.innerHTML = "";

  if(products.length === 0){

    catalog.innerHTML = `

        <div class="empty-icon">
          🔍
        </div>

        <h3>
          No encontramos productos
        </h3>

        <p>
          Prueba con otro nombre o categoría.
        </p>

      </div>
    `;

    loadMoreWrap.style.display =

    return;

  }


  products.forEach(product => {

    catalog.appendChild(

    );

  loadMoreWrap.style.display =
    hasMore ? "block" : "none";

}

/* =========================================================
   PRODUCTO NUEVO
========================================================= */

function isNewProduct(product){

  if(!product.created_at)
    return false;

  const created =
    new Date(
      product.created_at
    ).getTime();

  if(!Number.isFinite(created))
    return false;

  const days =
    (
      Date.now() -
      created
    ) /
    (
      1000 *
      60 *
      60 *
      24
    );

  return days <= 7;

}


/* =========================================================
   MODAL PRODUCTO
========================================================= */

function openProductModalById(id){

  const product =
    products.find(
      p => Number(p.id) === Number(id)
    );

  if(!product){

    showToast(
      "Producto no encontrado.",
      "error"
    );

    return;

  }

  openProductModal(product);

}


function openProductModal(product){

  currentSelectedProduct =
    product;

  currentProductImages =
    getImagesArray(
      product,
      "modal"
    );


  if(currentProductImages.length === 0){

    currentProductImages =
      [placeholderImage()];

  }


  document.getElementById(
    "detailCategory"
  ).textContent =
    product.category || "Producto";


  document.getElementById(
    "detailTitle"
  ).textContent =
    product.name || "Sin nombre";


  document.getElementById(
    "detailPrice"
  ).textContent =
    `Bs ${formatPrice(product.price)}`;


  const stock =
    Number(product.stock || 0);


  const stockElement =
    document.getElementById(
      "detailStock"
    );


  if(stock <= 0){

    stockElement.textContent =
      "❌ Producto agotado";

    stockElement.style.color =
      "#d92323";

  }else if(stock <= 3){

    stockElement.textContent =
      `⚠️ Solo quedan ${stock} unidad${stock === 1 ? "" : "es"}`;

    stockElement.style.color =
      "#e58a00";

  }else{

    stockElement.textContent =
      `📦 ${stock} unidades disponibles`;

    stockElement.style.color =
      "";

  }


  document.getElementById(
    "detailDescription"
  ).textContent =
    cleanDescription(
      product.description || "Sin descripción."
    );


  const main =
    document.getElementById(
      "detailMainImage"
    );

  main.src =
    currentProductImages[0];

  main.alt =
    product.name || "Producto";


  renderGalleryThumbs();


  const addBtn =
    document.getElementById(
      "detailAddBtn"
    );

  addBtn.disabled =
    stock <= 0;


  addBtn.textContent =
    stock <= 0
      ? "Agotado"
      : "🛒 Agregar al carrito";


  productModal.classList.add(
    "show"
  );

  productModal.setAttribute(
    "aria-hidden",
    "false"
  );


  document.body.style.overflow =
    "hidden";


  history.pushState(
    {
      modal:"product",
      id:product.id
    },
    "",
    productURL(product.id)
  );

}


function closeProductModal(
  useHistory = true
){

  productModal.classList.remove(
    "show"
  );

  productModal.setAttribute(
    "aria-hidden",
    "true"
  );

  currentSelectedProduct =
    null;


  if(!lightbox.classList.contains("show") &&
     !cartModal.classList.contains("show")){

    document.body.style.overflow =
      "";

  }


  if(
    useHistory &&
    history.state &&
    history.state.modal === "product"
  ){

    history.back();

  }

}


/* =========================================================
   GALERÍA
========================================================= */

function renderGalleryThumbs(){

  const container =
    document.getElementById(
      "galleryThumbs"
    );

  container.innerHTML = "";


  currentProductImages.forEach(
    (image, index) => {

      const button =
        document.createElement("button");

      button.className =
        "gallery-thumb" +
        (
          index === 0
            ? " active"
            : ""
        );

      button.type =
        "button";

      button.innerHTML = `
        <img
          src="${escapeHTML(image)}"
          alt=""
          onerror="this.src='${placeholderImage()}'"
        >
      `;

      button.onclick = () => {

        setDetailImage(index);

      };

      container.appendChild(
        button
      );

    }
  );

}


function setDetailImage(index){

  if(
    index < 0 ||
    index >= currentProductImages.length
  ){

    return;

  }


  currentLightboxIndex =
    index;


  document.getElementById(
    "detailMainImage"
  ).src =
    currentProductImages[index];


  document
    .querySelectorAll(
      ".gallery-thumb"
    )
    .forEach(
      (button, i) => {

        button.classList.toggle(
          "active",
          i === index
        );

      }
    );

}


/* =========================================================
   LIGHTBOX
========================================================= */

function openLightboxFromDetail(){

  if(!currentProductImages.length)
    return;

  currentLightboxIndex =
    Math.max(
      0,
      Math.min(
        currentLightboxIndex,
        currentProductImages.length - 1
      )
    );


  updateLightbox();


  lightbox.classList.add(
    "show"
  );


  history.pushState(
    {
      modal:"lightbox"
    },
    "",
    location.href
  );

}


function updateLightbox(){

  const image =
    document.getElementById(
      "lightboxImage"
    );

  image.src =
    currentProductImages[
      currentLightboxIndex
    ];


  document.getElementById(
    "lightboxCounter"
  ).textContent =
    `${currentLightboxIndex + 1} / ${currentProductImages.length}`;

}


function closeLightbox(
  useHistory = true
){

  lightbox.classList.remove(
    "show"
  );


  if(
    useHistory &&
    history.state &&
    history.state.modal === "lightbox"
  ){

    history.back();

  }

}


function nextLightboxImage(){

  if(
    currentProductImages.length <= 1
  ) return;

  currentLightboxIndex =
    (
      currentLightboxIndex + 1
    ) %
    currentProductImages.length;

  updateLightbox();

}


function previousLightboxImage(){

  if(
    currentProductImages.length <= 1
  ) return;

  currentLightboxIndex =
    (
      currentLightboxIndex -
      1 +
      currentProductImages.length
    ) %
    currentProductImages.length;

  updateLightbox();

}


/* =========================================================
   COMPARTIR
========================================================= */

async function shareCurrentProduct(){

  if(!currentSelectedProduct)
    return;


  const product =
    currentSelectedProduct;


  const url =
    productURL(product.id);


  const shareData = {

    title:
      product.name || "Aquí tái",

    text:
      `${product.name} - Bs ${formatPrice(product.price)}`,

    url

  };


  try{

    if(
      navigator.share
    ){

      await navigator.share(
        shareData
      );

    }else{

      await navigator.clipboard.writeText(
        url
      );

      showToast(
        "Enlace copiado.",
        "success"
      );

    }

  }catch(error){

    if(
      error &&
      error.name === "AbortError"
    ){

      return;

    }

    try{

      await navigator.clipboard.writeText(
        url
      );

      showToast(
        "Enlace copiado.",
        "success"
      );

    }catch(e){

      showToast(
        "No se pudo compartir.",
        "error"
      );

    }

  }

}


function productURL(id){

  const url =
    new URL(
      window.location.href
    );

  url.searchParams.set(
    "producto",
    id
  );

  return url.toString();

}


function checkProductFromURL(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  const id =
    params.get("producto");

  if(!id)
    return;


  const product =
    products.find(
      p => String(p.id) === String(id)
    );

  if(product){

    openProductModal(
      product
    );

  }

}

   WHATSAPP PRODUCTO

function orderCurrentProductWhatsApp(){

  if(!currentSelectedProduct)
    return;


  const product =
    currentSelectedProduct;


  if(
    Number(product.stock || 0) <= 0
  ){

    showToast(
      "Este producto está agotado.",
      "warning"
    );

    return;

  }


  const message =
`Hola 👋, quiero pedir este producto de Aquí tái:

🛍️ Producto: ${product.name}
💰 Precio: Bs ${formatPrice(product.price)}
📦 Stock disponible: ${product.stock}

¿Me pueden confirmar disponibilidad?`;


  openWhatsApp(
    message
  );

}


/* =========================================================
   CARRITO
========================================================= */

function loadCart(){

  try{

    const saved =
      localStorage.getItem(
        CART_KEY
      );

    if(!saved)
      return [];

    const parsed =
      JSON.parse(saved);

    return Array.isArray(parsed)
      ? parsed
      : [];

  }catch(error){

    return [];

  }

}


function saveCart(){

  localStorage.setItem(
    CART_KEY,
    JSON.stringify(cart)
  );

}


function findProduct(id){

  return products.find(
    p => Number(p.id) === Number(id)
  );

}


function getCartItem(id){

  return cart.find(
    item =>
      Number(item.id) === Number(id)
  );

}


function addToCart(id){

  const product =
    findProduct(id);


  if(!product){

    showToast(
      "Producto no disponible.",
      "error"
    );

    return;

  }


  const stock =
    Number(product.stock || 0);


  if(stock <= 0){

    showToast(
      "Este producto está agotado.",
      "warning"
    );

    return;

  }


  const existing =
    getCartItem(id);


  if(existing){

    if(
      existing.qty >= stock
    ){

      showToast(
        `Solo hay ${stock} unidad${stock === 1 ? "" : "es"} disponible${stock === 1 ? "" : "s"}.`,
        "warning"
      );

      return;

    }

    existing.qty++;

  }else{

    cart.push({

      id:product.id,

      name:product.name,

      price:Number(product.price || 0),

      stock:stock,

      image:
        getImagesArray(
          product,
          "thumb"
        )[0] ||
        placeholderImage(),

      qty:1

    });

  }


  saveCart();

  updateCartUI();

  showToast(
    "Producto agregado al carrito 🛒",
    "success"
  );

}


function addCurrentProductToCart(){

  if(!currentSelectedProduct)
    return;


  addToCart(
    currentSelectedProduct.id
  );

}


function changeQty(id, delta){

  const item =
    getCartItem(id);

  if(!item)
    return;


  const product =
    findProduct(id);


  let maxStock =
    product
      ? Number(product.stock || 0)
      : Number(item.stock || 0);


  if(maxStock <= 0){

    cart =
      cart.filter(
        x =>
          Number(x.id) !== Number(id)
      );

    saveCart();

    updateCartUI();

    showToast(
      `${item.name} quedó agotado.`,
      "warning"
    );

    return;

  }


  const newQty =
    Number(item.qty) + delta;


  if(newQty > maxStock){

    showToast(
      `Solo hay ${maxStock} disponible${maxStock === 1 ? "" : "s"}.`,
      "warning"
    );

    item.qty =
      maxStock;

  }else if(newQty <= 0){

    cart =
      cart.filter(
        x =>
          Number(x.id) !== Number(id)
      );

  }else{

    item.qty =
      newQty;

  }


  saveCart();

  updateCartUI();

}


function removeFromCart(id){

  cart =
    cart.filter(
      item =>
        Number(item.id) !== Number(id)
    );

  saveCart();

  updateCartUI();

}


function clearCart(){

  if(cart.length === 0)
    return;


  if(
    !confirm(
      "¿Quieres vaciar el carrito?"
    )
  ){

    return;

  }


  cart = [];

  saveCart();

  updateCartUI();

  showToast(
    "Carrito vacío.",
    "success"
  );

}


function updateCartUI(){

  const totalItems =
    cart.reduce(
      (sum,item) =>
        sum + Number(item.qty || 0),
      0
    );


  if(totalItems > 0){

    cartCount.style.display =
      "flex";

    cartCount.textContent =
      totalItems;

  }else{

    cartCount.style.display =
      "none";

  }


  renderCart();

}


function renderCart(){

  if(cart.length === 0){

    cartList.innerHTML = "";

    cartEmpty.style.display =
      "block";

    cartSummary.style.display =
      "none";

    return;

  }


  cartEmpty.style.display =
    "none";

  cartSummary.style.display =
    "block";


  cartList.innerHTML = "";


  let total = 0;


  cart.forEach(item => {

    const subtotal =
      Number(item.price || 0) *
      Number(item.qty || 0);

    total += subtotal;


    const row =
      document.createElement("div");

    row.className =
      "cart-item";


    row.innerHTML = `

      <img
        class="cart-item-image"
        src="${escapeHTML(item.image || placeholderImage())}"
        alt="${escapeHTML(item.name || "")}"
        onerror="this.src='${placeholderImage()}'"
      >

      <div class="cart-item-info">

        <div class="cart-item-name">
          ${escapeHTML(item.name || "Producto")}
        </div>

        <div class="cart-item-price">
          Bs ${formatPrice(item.price)}
          × ${item.qty}
          =
          <strong>
            Bs ${formatPrice(subtotal)}
          </strong>
        </div>

        <div class="qty-controls">

          <button
            class="qty-btn"
            onclick="changeQty(${Number(item.id)}, -1)"
          >
            −
          </button>

          <span class="qty-number">
            ${item.qty}
          </span>

          <button
            class="qty-btn"
            onclick="changeQty(${Number(item.id)}, 1)"
          >
            +
          </button>

          <button
            class="remove-item"
            onclick="removeFromCart(${Number(item.id)})"
            title="Eliminar"
          >
            🗑️
          </button>

        </div>

      </div>

    `;


    cartList.appendChild(row);

  });


  cartTotal.textContent =
    `Bs ${formatPrice(total)}`;

}


/* =========================================================
   VALIDAR STOCK ANTES DE CHECKOUT
========================================================= */

async function validateCartStock(){

  if(cart.length === 0){

    return {
      valid:false,
      changed:false
    };

  }


  const ids =
    cart.map(
      item => item.id
    );


  try{

    const {
      data,
      error
    } =
      await supabaseClient
        .from("products")
        .select(
          "id,name,price,stock,active,image,images"
        )
        .in(
          "id",
          ids
        );


    if(error) throw error;


    let changed = false;


    const freshMap =
      new Map(
        (data || []).map(
          p => [
            String(p.id),
            p
          ]
        )
      );


    cart =
      cart.filter(item => {

        const product =
          freshMap.get(
            String(item.id)
          );


        if(
          !product ||
          !product.active ||
          Number(product.stock || 0) <= 0
        ){

          changed = true;

          return false;

        }


        const stock =
          Number(
            product.stock || 0
          );


        if(item.qty > stock){

          item.qty =
            stock;

          changed = true;

        }


        item.stock =
          stock;

        item.price =
          Number(product.price || 0);

        item.image =
          getImagesArray(
            product,
            "thumb"
          )[0] ||
          item.image ||
          placeholderImage();


        return true;

      });


    if(changed){

      saveCart();

      updateCartUI();

    }


    return {
      valid:cart.length > 0,
      changed
    };


  }catch(error){

    console.error(
      "Error verificando stock:",
      error
    );


    showToast(
      "No se pudo verificar el stock. Intenta nuevamente.",
      "error"
    );


    return {
      valid:false,
      changed:false,
      error:true
    };

  }

}


/* =========================================================
   CHECKOUT WHATSAPP
========================================================= */

async function checkoutWhatsApp(){

  if(cart.length === 0){

    showToast(
      "Tu carrito está vacío.",
      "warning"
    );

    return;

  }


  const result =
    await validateCartStock();


  if(result.error)
    return;


  if(!result.valid){

    showToast(
      "Algunos productos ya no están disponibles.",
      "warning"
    );

    return;

  }


  if(result.changed){

    showToast(
      "Actualizamos las cantidades según el stock actual.",
      "warning"
    );

  }


  let total = 0;


  const lines =
    cart.map(
      item => {

        const subtotal =
          Number(item.price || 0) *
          Number(item.qty || 0);

        total += subtotal;


        return `• ${item.name} x${item.qty} — Bs ${formatPrice(subtotal)}`;

      }
    );


  const message =
`Hola 👋, quiero realizar este pedido de Aquí tái:

${lines.join("\n")}

💰 TOTAL: Bs ${formatPrice(total)}

¿Me confirman disponibilidad y los datos para el pago/entrega?`;


  openWhatsApp(
    message
  );

}


/* =========================================================
   MODAL CARRITO
========================================================= */

function openCartModal(){

  renderCart();

  cartModal.classList.add(
    "show"
  );

  cartModal.setAttribute(
    "aria-hidden",
    "false"
  );

  document.body.style.overflow =
    "hidden";


  history.pushState(
    {
      modal:"cart"
    },
    "",
    location.href
  );

}


function closeCartModal(
  useHistory = true
){

  cartModal.classList.remove(
    "show"
  );

  cartModal.setAttribute(
    "aria-hidden",
    "true"
  );


  if(
    !productModal.classList.contains("show") &&
    !lightbox.classList.contains("show")
  ){

    document.body.style.overflow =
      "";

  }


  if(
    useHistory &&
    history.state &&
    history.state.modal === "cart"
  ){

    history.back();

  }

}


/* =========================================================
   HISTORIAL
========================================================= */

function handlePopState(){

  if(lightbox.classList.contains("show")){

    closeLightbox(false);

    return;

  }


  if(productModal.classList.contains("show")){

    closeProductModal(false);

    return;

  }


  if(cartModal.classList.contains("show")){

    closeCartModal(false);

    return;

  }


  document.body.style.overflow =
    "";

}


/* =========================================================
   TECLADO
========================================================= */

function handleKeyboard(event){

  if(event.key === "Escape"){

    if(lightbox.classList.contains("show")){

      closeLightbox();

    }else if(productModal.classList.contains("show")){

      closeProductModal();

    }else if(cartModal.classList.contains("show")){

      closeCartModal();

    }

  }


  if(
    lightbox.classList.contains("show")
  ){

    if(event.key === "ArrowRight")
      nextLightboxImage();

    if(event.key === "ArrowLeft")
      previousLightboxImage();

  }

}

/* =========================================================
   SWIPE LIGHTBOX
========================================================= */

let touchStartX = 0;

let touchStartY = 0;


lightbox.addEventListener(
  "touchstart",
  event => {

    if(
      !event.touches ||
      !event.touches[0]
    ){

      return;

    }

    touchStartX =
      event.touches[0].clientX;

    touchStartY =
      event.touches[0].clientY;

  },
  {
    passive:true
  }
);


lightbox.addEventListener(
  "touchend",
  event => {

    if(
      !event.changedTouches ||
      !event.changedTouches[0]
    ){

      return;

    }


    const endX =
      event.changedTouches[0].clientX;

    const endY =
      event.changedTouches[0].clientY;


    const dx =
      endX - touchStartX;

    const dy =
      endY - touchStartY;


    if(
      Math.abs(dx) > 50 &&
      Math.abs(dx) > Math.abs(dy)
    ){

      if(dx < 0){

        nextLightboxImage();

      }else{

        previousLightboxImage();

      }

    }

  },
  {
    passive:true
  }
);

/* =========================================================
   UTILIDADES
========================================================= */

function formatPrice(value){

  const number =
    Number(value || 0);

  return number.toLocaleString(
    "es-BO",
    {
      minimumFractionDigits:2,
      maximumFractionDigits:2
    }
  );

}


function cleanDescription(text){

  return String(text || "")
    .replace(
      /https?:\/\/\S+/gi,
      ""
    )
    .replace(
      /\[\d+\]/g,
      ""
    )
    .replace(
      /\(\s*\)/g,
      ""
    )
    .replace(
      /\s+/g,
      " "
    )
    .trim();

}


function escapeHTML(value){

  return String(value ?? "")
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================================
   IMÁGENES
========================================================= */

function getImagesArray(
  product,
  mode = "card"
){

  let images = [];


  if(
    Array.isArray(product.images)
  ){

    images =
      product.images;

  }else if(
    typeof product.images === "string"
  ){

    try{

      const parsed =
        JSON.parse(
          product.images
        );

      if(Array.isArray(parsed)){

        images = parsed;

      }else if(
        typeof parsed === "string"
      ){

        images = [parsed];

      }

    }catch(error){

      if(
        product.images.startsWith("http")
      ){

        images =
          [product.images];

      }

    }

  }


  if(
    images.length === 0 &&
    product.image
  ){

    images =
      [product.image];

  }


  images =
    images
      .filter(Boolean)
      .map(
        url =>
          convertSupabaseImageURL(
            url,
            mode
          )
      );


  return [
    ...new Set(images)
  ];

}


function convertSupabaseImageURL(
  url,
  mode = "card"
){

  if(!url)
    return "";


  const value =
    String(url);


  if(
    !value.includes(
      ".supabase.co/storage/v1/object/public/"
    )
  ){

    return value;

  }


  const marker =
    "/storage/v1/object/public/";


  const index =
    value.indexOf(marker);


  if(index === -1)
    return value;


  const path =
    value.substring(
      index + marker.length
    );


  const parts =
    path.split("/");


  const bucket =
    parts.shift();


  const filePath =
    parts.join("/");


  let width = 600;

  if(mode === "thumb")
    width = 100;

  if(mode === "card")
    width = 300;

  if(mode === "modal")
    width = 800;


  return (
    SUPABASE_URL +
    "/storage/v1/render/image/public/" +
    bucket +
    "/" +
    filePath +
    "?width=" +
    width +
    "&quality=82"
  );

}


function placeholderImage(){

  return "data:image/svg+xml;charset=UTF-8," +

      >
        <rect
          width="600"

          fill="#eeeeee"
        />
        <text
          x="300"
          y="285"
          text-anchor="middle"
          font-size="38"
          font-family="Arial"
          fill="#777"
        >
          Aquí tái
        </text>
        <text
          x="300"
          y="330"
          text-anchor="middle"
          font-size="24"
          font-family="Arial"
          fill="#999"
        >
          Sin imagen
        </text>
      </svg>
    `);

}


/* =========================================================
   TOAST
========================================================= */

function showToast(
  message,
  type = ""
){

  const toast =
    document.createElement("div");

  toast.className =
    "toast " + type;

  toast.textContent =
    message;


  document
    .getElementById(
      "toastContainer"
    )
    .appendChild(toast);


  setTimeout(() => {

    toast.remove();

  }, 3000);

}
