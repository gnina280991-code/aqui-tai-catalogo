<style>

/* =====================================================
   GENERAL
===================================================== */

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;

/* =====================================================
   HEADER
===================================================== */

header{

  top:0;
  z-index:100;
}

.top{

  display:flex;
  align-items:center;

}

.logo{

  border-radius:50%;

}

.brand{
  font-size:25px;
  font-weight:800;
}

.sub{
  font-size:13px;
  color:#666;
}


/* =====================================================
   CONTENEDOR
===================================================== */

.wrap{
  max-width:1100px;
  margin:auto;
  padding:22px 16px 100px;
}


/* =====================================================
   HERO & FILTROS
===================================================== */

.hero{
  background:#fff;
  border-radius:20px;
  padding:22px;
  margin-bottom:20px;
}

.hero h1{
  margin:0 0 6px;
  font-size:30px;
}

.hero p{
  margin:0;
  color:#666;
  line-height:1.5;
}

.search{
  width:100%;
  padding:14px 16px;
  border:1px solid #ddd;
  border-radius:14px;
  font-size:16px;
  margin-top:18px;
  outline:none;
}

.search:focus{
  border-color:#ff9d00;
}

/* CATEGORÍAS */

.categories{
  display:flex;
  gap:8px;
  margin-top:14px;
  overflow-x:auto;
  padding-bottom:4px;
  scrollbar-width:none;
}

.categories::-webkit-scrollbar{
  display:none;
}

.cat-chip{
  background:#f0f0f0;
  border:0;
  padding:8px 16px;
  border-radius:999px;
  font-size:13px;
  font-weight:700;
  color:#444;
  cursor:pointer;
  white-space:nowrap;
  transition:all .2s ease;
}

.cat-chip:hover{
  background:#e5e5e5;
}

.cat-chip.active{
  background:#ff9d00;
  color:#111;
}

.product-count{
  margin-top:16px;
  color:#666;
  font-size:15px;
}


/* =====================================================
   GRID
===================================================== */

.grid{
  display:grid;
  grid-template-columns:
    repeat(auto-fill,minmax(210px,1fr));
  gap:16px;
}


/* =====================================================
   CARD
===================================================== */

.card{
  background:#fff;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 3px 15px #0000000c;
  min-width:0;
  display:flex;
  flex-direction:column;
}

.body{
  padding:14px;
  display:flex;
  flex-direction:column;
  flex:1;
}

.cat{
  font-size:12px;
  color:#777;
}

.name{
  font-size:18px;
  font-weight:700;
  margin:5px 0;
}

.desc{
  font-size:13px;
  color:#666;
  line-height:1.4;
  margin-bottom:10px;
}

.btn-toggle-desc{
  background:none;
  border:0;
  color:#ff9d00;
  font-weight:700;
  padding:0;
  margin-left:4px;
  cursor:pointer;
  font-size:12px;
  text-decoration:underline;
}

.price{
  font-size:22px;
  font-weight:800;
  margin:auto 0 5px;
  padding-top:10px;
}

.stock{
  font-size:13px;
  color:#555;
  margin-bottom:12px;
}

.stock.out{
  color:#c00;
  font-weight:700;
}


/* =====================================================
   GALERÍA DEL PRODUCTO
===================================================== */

.gallery{
  width:100%;
  background:#fafafa;
}

.main-image-wrap{
  position:relative;
  width:100%;
  aspect-ratio:1/1;
  background:#fafafa;
  overflow:hidden;
  cursor:zoom-in;
}

.main-image{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transition:transform .25s ease;
}

.main-image-wrap:hover .main-image{
  transform:scale(1.02);
}

.gallery-arrow{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:38px;
  height:38px;
  border:0;
  border-radius:50%;
  background:#ffffffdd;
  box-shadow:0 2px 10px #0003;
  font-size:22px;
  font-weight:bold;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:3;
}

.gallery-arrow.left{
  left:10px;
}

.gallery-arrow.right{
  right:10px;
}

.gallery-arrow:hover{
  background:#fff;
}

.photo-counter{
  position:absolute;
  right:10px;
  bottom:10px;
  background:#000b;
  color:#fff;
  border-radius:999px;
  padding:6px 10px;
  font-size:12px;
  font-weight:700;
  z-index:3;
}

.thumbnails{
  display:flex;
  gap:8px;
  padding:8px 8px 4px;
  overflow-x:auto;
  scrollbar-width:thin;
  background:#fff;
}

.thumbnails::-webkit-scrollbar{
  height:5px;
}

.thumbnails::-webkit-scrollbar-thumb{
  background:#ccc;
  border-radius:20px;
}

.thumb{
  flex:0 0 72px;
  width:72px;
  height:72px;
  padding:0;
  border:3px solid transparent;
  border-radius:12px;
  overflow:hidden;
  background:#f5f5f5;
  cursor:pointer;
}

.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.thumb.active{
  border-color:#ff9d00;
}

.photo-info{
  text-align:center;
  padding:4px 8px 9px;
  font-size:12px;
  color:#777;
  background:#fff;
}


/* =====================================================
   BOTÓN AGREGAR
===================================================== */

.btn{
  width:100%;
  border:0;
  border-radius:12px;
  padding:13px;
  background:#111;
  color:#fff;
  font-weight:700;
  font-size:15px;
  cursor:pointer;
}

.btn:disabled{
  background:#aaa;
  cursor:not-allowed;
}


/* =====================================================
   CARRITO
===================================================== */

.cart{
  position:fixed;
  right:18px;
  bottom:18px;
  border:0;
  border-radius:999px;
  padding:15px 20px;
  background:#ff9d00;
  color:#111;
  font-weight:800;
  box-shadow:0 5px 20px #0003;
  cursor:pointer;
  z-index:150;
  font-size:16px;
}


/* =====================================================
   PANEL CARRITO
===================================================== */

.panel{
  position:fixed;
  inset:0;
  background:#0008;
  display:none;
  z-index:200;
}

.panel.open{
  display:flex;
  align-items:flex-end;
  justify-content:center;
}

.sheet{
  background:#fff;
  width:min(100%,560px);
  max-height:90vh;
  overflow:auto;
  border-radius:22px 22px 0 0;
  padding:20px;
}

.close{
  float:right;
  border:0;
  background:#eee;
  border-radius:50%;
  width:36px;
  height:36px;
  cursor:pointer;
  font-size:18px;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.row button{
  border:0;
  background:#eee;
  border-radius:10px;
  padding:8px 10px;
  cursor:pointer;
}

textarea,
input[type=text]{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
  margin:6px 0 12px;
  font:inherit;
}

textarea{
  min-height:90px;
  resize:vertical;
}


/* =====================================================
   VISOR DE IMAGEN GRANDE
===================================================== */

.lightbox{
  position:fixed;
  inset:0;
  background:#000e;
  display:none;
  align-items:center;
  justify-content:center;
  z-index:500;
  padding:20px;
}

.lightbox.open{
  display:flex;
}

.lightbox-content{
  position:relative;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
}

.lightbox-image{
  max-width:92vw;
  max-height:86vh;
  object-fit:contain;

.lightbox-close{
  position:absolute;

  right:10px;
  width:44px;
  height:44px;
  border:0;
  border-radius:50%;
  background:#ffffffdd;
  color:#111;
  font-size:25px;
  cursor:pointer;
  z-index:5;
}

.lightbox-arrow{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:50px;
  height:50px;
  border:0;
  border-radius:50%;
  background:#ffffffdd;
  color:#111;
  font-size:28px;
  cursor:pointer;
  z-index:5;
}

.lightbox-arrow.left{
  left:5px;
}

.lightbox-arrow.right{
  right:5px;
}

.lightbox-counter{
  position:absolute;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  background:#000b;
  color:#fff;
  padding:7px 13px;
  border-radius:999px;

}


/* =====================================================
   ESTADOS
===================================================== */

.loading{
  background:#fff;
  border-radius:18px;
  padding:30px;
  text-align:center;

}

.error{
  background:#fff;

/* =====================================================

===================================================== */

@media(max-width:480px){

</style>

<script>


/* =====================================================
   CONFIGURACIÓN SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://ztsthkoejosgwkhmzfbd.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_PUxkUNfWJbdoNYuYGynqAA_3Z02D4MA";


/* =====================================================
   CONEXIÓN
===================================================== */

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   VARIABLES
===================================================== */

let products = [];
let cart = [];
let galleryStates = {};
let expandedDescs = {};
let selectedCategory = "Todas";
let currentLightboxImages = [];
let currentLightboxIndex = 0;


/* =====================================================
   ELEMENTOS
===================================================== */

const grid = document.getElementById("grid");
const search = document.getElementById("search");
const count = document.getElementById("count");
const cartItems = document.getElementById("cartItems");
const total = document.getElementById("total");
const panel = document.getElementById("panel");
const customer = document.getElementById("customer");
const address = document.getElementById("address");
const productCount = document.getElementById("productCount");
const categoriesContainer = document.getElementById("categoriesContainer");
const lightbox = document.getElementById("lightbox");
const lightboxImage = document.getElementById("lightboxImage");
const lightboxCounter = document.getElementById("lightboxCounter");
const lightboxPrev = document.getElementById("lightboxPrev");
const lightboxNext = document.getElementById("lightboxNext");


/* =====================================================
   CONVERTIR IMÁGENES A ARRAY
===================================================== */

function getImages(product){
  let list = [];

  if (product.images) {
    if (Array.isArray(product.images)) {
      list = product.images.map(x => String(x).trim()).filter(Boolean);
    } else if (typeof product.images === 'string') {
      try {
        const parsed = JSON.parse(product.images);
        if (Array.isArray(parsed)) {
          list = parsed.map(x => String(x).trim()).filter(Boolean);
        }
      } catch(e) {
        if (product.images.includes("\n")) {
          list = product.images.split(/\r?\n/).map(x => x.trim()).filter(Boolean);
        } else if (product.images.includes(",")) {
          list = product.images.split(",").map(x => x.trim()).filter(Boolean);
        } else if (product.images.trim()) {
          list = [product.images.trim()];
        }
      }
    }
  }

  if (!list.length && product.image) {
    list = [String(product.image).trim()];
  }

  return list;
}


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escapeHTML(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =====================================================
   CARGAR PRODUCTOS
===================================================== */

async function loadProducts(){

  grid.innerHTML = `
    <div class="loading">
      ⏳ Cargando productos...
    </div>
  `;

  productCount.textContent = "Cargando productos...";

  try{
    const { data, error } = await supabaseClient
      .from("products")
      .select("id, name, category, description, price, image, images, stock, active")
      .eq("active", true)
      .order("id", { ascending: false });

    if(error){
      console.error("Error Supabase:", error);
      grid.innerHTML = `
        <div class="error">
          ❌ No se pudieron cargar los productos.
          <br><br>
          Revisa la conexión con Supabase.
        </div>
      `;
      productCount.textContent = "Error al cargar productos.";
      return;
    }

    products = data || [];

    products.forEach(product => {
      const images = getImages(product);
      galleryStates[product.id] = {
        images: images,
        index: 0
      };
    });

    renderCategories();
    filterProducts();

  } catch(error){
    console.error(error);
    grid.innerHTML = `
      <div class="error">
        ❌ Ocurrió un error al cargar el catálogo.
      </div>
    `;
    productCount.textContent = "Error al cargar productos.";
  }
}


/* =====================================================
   RENDER CATEGORÍAS
===================================================== */

function renderCategories(){
  const cats = ["Todas", ...new Set(products.map(p => p.category?.trim()).filter(Boolean))];

  categoriesContainer.innerHTML = cats.map(cat => `
    <button
      class="cat-chip ${cat === selectedCategory ? 'active' : ''}"
      onclick="selectCategory('${escapeHTML(cat)}')"
    >
      ${escapeHTML(cat)}
    </button>
  `).join("");
}

function selectCategory(cat){
  selectedCategory = cat;
  renderCategories();
  filterProducts();
}


/* =====================================================
   FILTRAR PRODUCTOS
===================================================== */

function filterProducts(){
  const q = search.value.trim().toLowerCase();

  const filtered = products.filter(p => {
    const matchesCat = (selectedCategory === "Todas" || p.category?.trim() === selectedCategory);
    
    const text = [p.name, p.description, p.category]
      .filter(Boolean)
      .join(" ")
      .toLowerCase();

    const matchesSearch = !q || text.includes(q);

    return matchesCat && matchesSearch;
  });

  render(filtered);
}


/* =====================================================
   CREAR HTML DE GALERÍA
===================================================== */

function galleryHTML(product){
  const images = getImages(product);
  const fallback = "https://via.placeholder.com/600x600?text=Aqui+tai";

  if(!images.length){
    images.push(fallback);
  }

  if(!galleryStates[product.id]){
    galleryStates[product.id] = {
      images: images,
      index: 0
    };
  }

  const state = galleryStates[product.id];

  if(state.index < 0 || state.index >= images.length){
    state.index = 0;
  }

  const mainImage = images[state.index];

  if(images.length === 1){
    return `
      <div class="gallery single">
        <div class="main-image-wrap" onclick="openLightbox(${Number(product.id)},0)">
          <img
            id="main-image-${Number(product.id)}"
            class="main-image"
            src="${escapeHTML(mainImage)}"
            alt="${escapeHTML(product.name)}"
            loading="lazy"
            onerror="this.src='https://via.placeholder.com/600x600?text=Sin+imagen'"
          >
        </div>
      </div>
    `;
  }

  return `
    <div id="gallery-${Number(product.id)}" class="gallery">
      <div class="main-image-wrap" onclick="openLightbox(${Number(product.id)},${state.index})">
        <img
          id="main-image-${Number(product.id)}"
          class="main-image"
          src="${escapeHTML(mainImage)}"
          alt="${escapeHTML(product.name)}"
          loading="lazy"
          onerror="this.src='https://via.placeholder.com/600x600?text=Sin+imagen'"
        >

        <button
          class="gallery-arrow left"
          onclick="event.stopPropagation(); changeGallery(${Number(product.id)}, -1)"
          aria-label="Imagen anterior"
        >‹</button>

        <button
          class="gallery-arrow right"
          onclick="event.stopPropagation(); changeGallery(${Number(product.id)}, 1)"
          aria-label="Imagen siguiente"
        >›</button>

        <div id="counter-${Number(product.id)}" class="photo-counter">
          ${state.index + 1} / ${images.length}
        </div>
      </div>

      <div id="thumbs-${Number(product.id)}" class="thumbnails">
        ${images.map((image, index) => `
          <button
            class="thumb ${index === state.index ? "active" : ""}"
            onclick="event.stopPropagation(); selectGalleryImage(${Number(product.id)}, ${index})"
            aria-label="Ver imagen ${index + 1}"
          >
            <img
              src="${escapeHTML(image)}"
              alt="Miniatura ${index + 1}"
              loading="lazy"
              onerror="this.src='https://via.placeholder.com/100x100?text=Foto'"
            >
          </button>
        `).join("")}
      </div>

      <div class="photo-info">
        📷 ${images.length} ${images.length === 1 ? "foto" : "fotos"}
      </div>
    </div>
  `;
}


/* =====================================================
   TOGGLE DESCRIPCIÓN ("VER MÁS")
===================================================== */

function toggleDesc(id){
  expandedDescs[id] = !expandedDescs[id];
  filterProducts();
}


/* =====================================================
   RENDER PRODUCTOS
===================================================== */

function render(list){
  productCount.textContent = list.length + (list.length === 1 ? " producto disponible." : " productos disponibles.");

  if(!list.length){
    grid.innerHTML = `
      <div class="loading">
        🔎 No encontramos productos.
      </div>
    `;
    return;
  }

  grid.innerHTML = list.map(p => {
    const stock = Number(p.stock || 0);
    const disabled = stock <= 0 ? "disabled" : "";
    const stockHTML = stock > 0
      ? `<div class="stock">📦 Disponible: ${stock}</div>`
      : `<div class="stock out">❌ Agotado</div>`;

    const fullDesc = p.description || "";
    const isLong = fullDesc.length > 90;
    const isExpanded = expandedDescs[p.id];
    
    let descHTML = escapeHTML(fullDesc);
    if(isLong && !isExpanded){
      descHTML = escapeHTML(fullDesc.substring(0, 90)) + "...";
    }

    return `
      <article class="card">
        ${galleryHTML(p)}
        <div class="body">
          <div class="cat">${escapeHTML(p.category || "Sin categoría")}</div>
          <div class="name">${escapeHTML(p.name)}</div>
          
          <div class="desc">
            ${descHTML}
            ${isLong ? `
              <button class="btn-toggle-desc" onclick="toggleDesc(${Number(p.id)})">
                ${isExpanded ? "Ver menos" : "Ver más"}
              </button>
            ` : ""}
          </div>

          <div class="price">Bs ${Number(p.price || 0).toFixed(2)}</div>
          ${stockHTML}
          <button class="btn" ${disabled} onclick="add(${Number(p.id)})">
            ${stock > 0 ? "Agregar al carrito" : "Agotado"}
          </button>
        </div>
      </article>
    `;
  }).join("");
}


/* =====================================================
   CAMBIAR IMAGEN DE GALERÍA
===================================================== */

function changeGallery(id, direction){
  const state = galleryStates[id];
  if(!state) return;

  const total = state.images.length;
  if(total <= 1) return;

  state.index += direction;
  if(state.index < 0) state.index = total - 1;
  if(state.index >= total) state.index = 0;

  updateGallery(id);
}


/* =====================================================
   SELECCIONAR MINIATURA
===================================================== */

function selectGalleryImage(id, index){
  const state = galleryStates[id];
  if(!state) return;
  if(index < 0 || index >= state.images.length) return;

  state.index = index;
  updateGallery(id);
}


/* =====================================================
   ACTUALIZAR GALERÍA
===================================================== */

function updateGallery(id){
  const state = galleryStates[id];
  if(!state) return;

  const image = state.images[state.index];
  const mainImage = document.getElementById("main-image-" + id);
  const counter = document.getElementById("counter-" + id);
  const thumbs = document.querySelectorAll("#thumbs-" + id + " .thumb");

  if(mainImage) mainImage.src = image;
  if(counter) counter.textContent = (state.index + 1) + " / " + state.images.length;

  thumbs.forEach((thumb, index) => {
    thumb.classList.toggle("active", index === state.index);
  });
}


/* =====================================================
   ABRIR VISOR GRANDE
===================================================== */

function openLightbox(id, index){
  const state = galleryStates[id];
  if(!state) return;

  currentLightboxImages = state.images;
  currentLightboxIndex = index;

  updateLightbox();
  lightbox.classList.add("open");
  document.body.style.overflow = "hidden";
}


/* =====================================================
   ACTUALIZAR VISOR
===================================================== */

function updateLightbox(){
  if(!currentLightboxImages.length) return;

  lightboxImage.src = currentLightboxImages[currentLightboxIndex];
  lightboxCounter.textContent = (currentLightboxIndex + 1) + " / " + currentLightboxImages.length;

  if(currentLightboxImages.length <= 1){
    lightboxPrev.style.display = "none";
    lightboxNext.style.display = "none";
  } else {
    lightboxPrev.style.display = "flex";
    lightboxNext.style.display = "flex";
  }
}


/* =====================================================
   CAMBIAR IMAGEN DEL VISOR
===================================================== */

function changeLightboxImage(direction){
  if(currentLightboxImages.length <= 1) return;

  currentLightboxIndex += direction;
  if(currentLightboxIndex < 0) currentLightboxIndex = currentLightboxImages.length - 1;
  if(currentLightboxIndex >= currentLightboxImages.length) currentLightboxIndex = 0;

  updateLightbox();
}


/* =====================================================
   CERRAR VISOR
===================================================== */

function closeLightbox(){
  lightbox.classList.remove("open");
  document.body.style.overflow = "";
}

function closeLightboxIfBackground(event){
  if(event.target === lightbox) closeLightbox();
}


/* =====================================================
   TECLADO
===================================================== */

document.addEventListener("keydown", function(event){
  if(!lightbox.classList.contains("open")) return;
  if(event.key === "Escape") closeLightbox();
  if(event.key === "ArrowLeft") changeLightboxImage(-1);
  if(event.key === "ArrowRight") changeLightboxImage(1);
});


/* =====================================================
   SWIPE EN CELULAR
===================================================== */

let touchStartX = 0;
let touchEndX = 0;

lightbox.addEventListener("touchstart", function(event){
  touchStartX = event.changedTouches[0].screenX;
}, { passive: true });

lightbox.addEventListener("touchend", function(event){
  touchEndX = event.changedTouches[0].screenX;
  const difference = touchStartX - touchEndX;
  if(Math.abs(difference) < 50) return;
  if(difference > 0) changeLightboxImage(1);
  else changeLightboxImage(-1);
}, { passive: true });


/* =====================================================
   BÚSQUEDA
===================================================== */

search.addEventListener("input", filterProducts);


/* =====================================================
   AGREGAR AL CARRITO
===================================================== */

function add(id){
  const product = products.find(p => Number(p.id) === Number(id));
  if(!product){
    alert("Producto no encontrado.");
    return;
  }

  const stock = Number(product.stock || 0);
  if(stock <= 0){
    alert("Este producto está agotado.");
    return;
  }

  const existing = cart.find(x => Number(x.id) === Number(id));

  if(existing){
    if(existing.qty >= stock){
      alert("No puedes agregar más unidades de las disponibles.");
      return;
    }
    existing.qty++;
  } else {
    cart.push({ ...product, qty: 1 });
  }

  updateCart();
  openCart();
}


/* =====================================================
   ACTUALIZAR CARRITO
===================================================== */

function updateCart(){
  const quantity = cart.reduce((sum, item) => sum + Number(item.qty), 0);
  count.textContent = quantity;

  if(!cart.length){
    cartItems.innerHTML = "<p>Tu carrito está vacío.</p>";
    total.textContent = "Total: Bs 0.00";
    return;
  }

  cartItems.innerHTML = cart.map((item, index) => {
    const subtotal = Number(item.price || 0) * Number(item.qty || 0);
    return `
      <div class="row">
        <div>
          <b>${escapeHTML(item.name)}</b><br>
          Bs ${Number(item.price || 0).toFixed(2)} × ${item.qty}<br>
          <strong>Subtotal: Bs ${subtotal.toFixed(2)}</strong>
        </div>
        <button onclick="removeItem(${index})">🗑️</button>
      </div>
    `;
  }).join("");

  const grandTotal = cart.reduce((sum, item) => sum + Number(item.price || 0) * Number(item.qty || 0), 0);
  total.textContent = "Total: Bs " + grandTotal.toFixed(2);
}


/* =====================================================
   ELIMINAR DEL CARRITO
===================================================== */

function removeItem(index){
  cart.splice(index, 1);
  updateCart();
}


/* =====================================================
   ABRIR / CERRAR CARRITO
===================================================== */

function openCart(){
  panel.classList.add("open");
  updateCart();
}

function closeCart(){
  panel.classList.remove("open");
}


/* =====================================================
   WHATSAPP
===================================================== */

function sendWhatsApp(){
  if(!cart.length){
    alert("Agrega al menos un producto.");
    return;
  }

  const name = customer.value.trim() || "No indicado";
  const addr = address.value.trim() || "No indicada";
  const grandTotal = cart.reduce((sum, item) => sum + Number(item.price || 0) * Number(item.qty || 0), 0);

  let message = "🛍️ *NUEVO PEDIDO - AQUÍ TÁI*\n\n";

  cart.forEach(item => {
    const subtotal = Number(item.price || 0) * Number(item.qty || 0);
    message += "• " + item.name + " × " + item.qty + " = Bs " + subtotal.toFixed(2) + "\n";
  });

  message += "\n💰 *Total: Bs " + grandTotal.toFixed(2) + "*";
  message += "\n👤 Cliente: " + name;
  message += "\n📍 Entrega: " + addr;

  const encodedMessage = encodeURIComponent(message);
  const whatsappURL = "https://wa.me/59171440907?text=" + encodedMessage;

  window.location.href = whatsappURL;
}

   INICIAR
===================================================== */

loadProducts();
