<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aquí tái | Catálogo</title>
<meta name="description" content="Catálogo de productos Aquí tái · Bolivia">

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f6f7f9;
  color:#171717;
}

header{
  background:#fff;
  border-bottom:1px solid #eee;
  position:sticky;
  top:0;
  z-index:10;
}

.top{
  max-width:1100px;
  margin:auto;
  padding:12px 16px;
  display:flex;
  align-items:center;
  gap:14px;
}

.logo{
  height:62px;
  width:62px;
  border-radius:50%;
  object-fit:cover;
  border:1px solid #eee;
}

.brand{
  font-size:25px;
  font-weight:800;
}

.sub{
  font-size:13px;
  color:#666;
}

.wrap{
  max-width:1100px;
  margin:auto;
  padding:22px 16px;
}

.hero{
  background:#fff;
  border-radius:20px;
  padding:22px;
  margin-bottom:20px;
}

.hero h1{
  margin:0 0 6px;
  font-size:30px;
}

.hero p{
  margin:0;
  color:#666;
  line-height:1.5;
}

.search{
  width:100%;
  padding:14px 16px;
  border:1px solid #ddd;
  border-radius:14px;
  font-size:16px;
  margin-top:18px;
  outline:none;
}

.search:focus{
  border-color:#111;
}

.status{
  margin-top:14px;
  color:#666;
  font-size:14px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
  gap:16px;
}

.card{
  background:#fff;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 3px 15px #0000000c;
}

.pic{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  background:#fafafa;
}

.body{
  padding:14px;
}

.cat{
  font-size:12px;
  color:#777;
}

.name{
  font-size:18px;
  font-weight:700;
  margin:5px 0;
}

.desc{
  font-size:13px;
  color:#666;
  line-height:1.4;
  min-height:54px;
}

.price{
  font-size:22px;
  font-weight:800;
  margin:12px 0 4px;
}

.stock{
  font-size:12px;
  color:#666;
  margin-bottom:10px;
}

.btn{
  width:100%;
  border:0;
  border-radius:12px;
  padding:13px;
  background:#111;
  color:#fff;
  font-weight:700;
  font-size:15px;
  cursor:pointer;
}

.btn:disabled{
  background:#aaa;
  cursor:not-allowed;
}

.cart{
  position:fixed;
  right:18px;
  bottom:18px;
  border:0;
  border-radius:999px;
  padding:15px 20px;
  background:#ff9d00;
  color:#111;
  font-weight:800;
  box-shadow:0 5px 20px #0003;
  cursor:pointer;
  z-index:15;
}

.panel{
  position:fixed;
  inset:0;
  background:#0008;
  display:none;
  z-index:20;
}

.panel.open{
  display:flex;
  align-items:flex-end;
  justify-content:center;
}

.sheet{
  background:#fff;
  width:min(100%,560px);
  max-height:90vh;
  overflow:auto;
  border-radius:22px 22px 0 0;
  padding:20px;
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.row-controls{
  display:flex;
  align-items:center;
  gap:8px;
}

.qty{
  min-width:25px;
  text-align:center;
  font-weight:700;
}

.small-btn{
  border:0;
  background:#eee;
  border-radius:8px;
  width:32px;
  height:32px;
  cursor:pointer;
  font-weight:700;
}

.delete{
  border:0;
  background:#f3f3f3;
  border-radius:8px;
  padding:8px;
  cursor:pointer;
}

.close{
  float:right;
  border:0;
  background:#eee;
  border-radius:50%;
  width:36px;
  height:36px;
  cursor:pointer;
}

textarea,
input[type=text]{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
  margin:6px 0 12px;
  font:inherit;
}

label{
  display:block;
  font-weight:600;
  margin-top:10px;
}

.empty{
  background:#fff;
  border-radius:16px;
  padding:30px;
  text-align:center;
  color:#666;
}

.loading{
  background:#fff;
  border-radius:16px;
  padding:30px;
  text-align:center;
}

@media(max-width:480px){

  .grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
  }

  .card{
    border-radius:14px;
  }

  .body{
    padding:10px;
  }

  .name{
    font-size:15px;
  }

  .desc{
    font-size:12px;
    min-height:70px;
  }

  .price{
    font-size:18px;
  }

  .hero h1{
    font-size:24px;
  }

  .brand{
    font-size:22px;
  }

  .logo{
    width:55px;
    height:55px;
  }
}
</style>
</head>

<body>

<header>
  <div class="top">

    <img
      class="logo"
      src="logo.png"
      alt="Aquí tái"
      onerror="this.style.display='none'"
    >

    <div>
      <div class="brand">Aquí tái</div>
      <div class="sub">Catálogo de productos · Bolivia</div>
    </div>

  </div>
</header>

<main class="wrap">

  <section class="hero">

    <h1>🛍️ Nuestro catálogo</h1>

    <p>
      Elige tus productos y envíanos tu pedido directamente por WhatsApp.
    </p>

    <input
      id="search"
      class="search"
      type="text"
      placeholder="🔎 Buscar productos..."
    >

    <div id="status" class="status">
      Cargando productos...
    </div>

  </section>

  <section id="grid" class="grid"></section>

</main>

<button class="cart" onclick="openCart()">
  🛒 Carrito (<span id="count">0</span>)
</button>


<!-- CARRITO -->

<div
  id="panel"
  class="panel"
  onclick="if(event.target===this)closeCart()"
>

  <div class="sheet">

    <button
      class="close"
      onclick="closeCart()"
    >
      ✕
    </button>

    <h2>Tu pedido</h2>

    <div id="cartItems"></div>

    <div
      id="total"
      style="font-size:20px;font-weight:800;margin:16px 0"
    >
    </div>

    <label for="customer">
      Tu nombre
    </label>

    <input
      id="customer"
      type="text"
      placeholder="Ej. Juan Pérez"
    >

    <label for="address">
      Dirección o zona de entrega
    </label>

    <textarea
      id="address"
      placeholder="Ej. Zona Central"
    ></textarea>

    <button
      class="btn"
      onclick="sendWhatsApp()"
    >
      📲 Enviar pedido por WhatsApp
    </button>

  </div>

</div>


<script>

/* =====================================================
   CONFIGURACIÓN SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://ztsthkoejosgwkhmzfbd.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_PUxkUNfWJbdoNYuYGynqAA_3Z02D4MA";


/*
   IMPORTANTE:
   Si la clave de arriba da error, usa exactamente
   la Publishable Key que aparece en Supabase.
*/

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   VARIABLES
===================================================== */

let products = [];
let cart = [];


/* =====================================================
   ELEMENTOS
===================================================== */

const grid =
  document.getElementById("grid");

const search =
  document.getElementById("search");

const count =
  document.getElementById("count");

const cartItems =
  document.getElementById("cartItems");

const total =
  document.getElementById("total");

const panel =
  document.getElementById("panel");

const status =
  document.getElementById("status");

const customer =
  document.getElementById("customer");

const address =
  document.getElementById("address");


/* =====================================================
   CARGAR PRODUCTOS DESDE SUPABASE
===================================================== */

async function loadProducts(){

  status.textContent =
    "Cargando productos...";

  const {
    data,
    error
  } = await supabaseClient
    .from("products")
    .select("*")
    .eq("active", true)
    .order("id", { ascending:true });


  if(error){

    console.error(error);

    status.textContent =
      "No se pudieron cargar los productos.";

    grid.innerHTML = `
      <div class="empty">
        ❌ Error al cargar los productos.
        <br><br>
        Revisa la conexión con Supabase.
      </div>
    `;

    return;
  }


  products = data || [];

  status.textContent =
    products.length +
    " producto(s) disponible(s).";

  render(products);
}


/* =====================================================
   MOSTRAR PRODUCTOS
===================================================== */

function render(list){

  if(!list.length){

    grid.innerHTML = `
      <div class="empty">
        No encontramos productos.
      </div>
    `;

    return;
  }


  grid.innerHTML = list.map(p => {

    const stock =
      Number(p.stock || 0);

    const image =
      p.image ||
      "https://via.placeholder.com/600?text=Aqui+Tai";


    return `

      <article class="card">

        <img
          class="pic"
          src="${escapeHTML(image)}"
          alt="${escapeHTML(p.name || "Producto")}"
          onerror="this.src='https://via.placeholder.com/600?text=Sin+imagen'"
        >

        <div class="body">

          <div class="cat">
            ${escapeHTML(p.category || "")}
          </div>

          <div class="name">
            ${escapeHTML(p.name || "")}
          </div>

          <div class="desc">
            ${escapeHTML(p.description || "")}
          </div>

          <div class="price">
            Bs ${Number(p.price || 0).toFixed(2)}
          </div>

          <div class="stock">
            ${
              stock > 0
              ? "📦 Disponible: " + stock
              : "❌ Agotado"
            }
          </div>

          <button
            class="btn"
            onclick="add(${Number(p.id)})"
            ${stock <= 0 ? "disabled" : ""}
          >
            ${
              stock > 0
              ? "Agregar al carrito"
              : "Agotado"
            }
          </button>

        </div>

      </article>

    `;

  }).join("");
}


/* =====================================================
   BUSCADOR
===================================================== */

search.addEventListener(
  "input",
  function(){

    const q =
      search.value
        .toLowerCase()
        .trim();


    const filtered =
      products.filter(p => {

        const text =
          (
            (p.name || "") +
            " " +
            (p.description || "") +
            " " +
            (p.category || "")
          ).toLowerCase();

        return text.includes(q);
      });


    render(filtered);
  }
);


/* =====================================================
   AGREGAR AL CARRITO
===================================================== */

function add(id){

  const product =
    products.find(
      p => Number(p.id) === Number(id)
    );


  if(!product) return;


  const stock =
    Number(product.stock || 0);


  const existing =
    cart.find(
      p => Number(p.id) === Number(id)
    );


  if(existing){

    if(existing.qty >= stock){

      alert(
        "No hay más unidades disponibles."
      );

      return;
    }

    existing.qty++;

  }else{

    cart.push({
      ...product,
      qty:1
    });

  }


  update();

  openCart();
}


/* =====================================================
   ACTUALIZAR CARRITO
===================================================== */

function update(){

  const totalItems =
    cart.reduce(
      (sum,p) => sum + p.qty,
      0
    );


  count.textContent =
    totalItems;


  if(!cart.length){

    cartItems.innerHTML =
      "<p>Tu carrito está vacío.</p>";

    total.textContent =
      "Total: Bs 0.00";

    return;
  }


  cartItems.innerHTML =
    cart.map((p,index) => {

      const subtotal =
        Number(p.price || 0) * p.qty;


      return `

        <div class="row">

          <div>

            <b>
              ${escapeHTML(p.name)}
            </b>

            <br>

            Bs ${Number(p.price).toFixed(2)}
            × ${p.qty}

            <br>

            <strong>
              Subtotal: Bs ${subtotal.toFixed(2)}
            </strong>

          </div>


          <div class="row-controls">

            <button
              class="small-btn"
              onclick="changeQty(${index},-1)"
            >
              −
            </button>

            <span class="qty">
              ${p.qty}
            </span>

            <button
              class="small-btn"
              onclick="changeQty(${index},1)"
            >
              +
            </button>

            <button
              class="delete"
              onclick="removeItem(${index})"
            >
              🗑️
            </button>

          </div>

        </div>

      `;

    }).join("");


  const grandTotal =
    cart.reduce(
      (sum,p) =>
        sum +
        Number(p.price || 0) * p.qty,
      0
    );


  total.textContent =
    "Total: Bs " +
    grandTotal.toFixed(2);
}


/* =====================================================
   CAMBIAR CANTIDAD
===================================================== */

function changeQty(index,change){

  const item =
    cart[index];

  if(!item) return;


  const stock =
    Number(item.stock || 0);


  const newQty =
    item.qty + change;


  if(newQty <= 0){

    cart.splice(index,1);

  }else if(newQty > stock){

    alert(
      "No hay más unidades disponibles."
    );

    return;

  }else{

    item.qty =
      newQty;
  }


  update();
}


/* =====================================================
   ELIMINAR PRODUCTO
===================================================== */

function removeItem(index){

  cart.splice(index,1);

  update();
}


/* =====================================================
   ABRIR / CERRAR CARRITO
===================================================== */

function openCart(){

  panel.classList.add("open");

  update();
}


function closeCart(){

  panel.classList.remove("open");
}


/* =====================================================
   ENVIAR PEDIDO A WHATSAPP
===================================================== */

function sendWhatsApp(){

  if(!cart.length){

    alert(
      "Agrega al menos un producto."
    );

    return;
  }


  const name =
    customer.value.trim() ||
    "No indicado";


  const addr =
    address.value.trim() ||
    "No indicada";


  const grandTotal =
    cart.reduce(
      (sum,p) =>
        sum +
        Number(p.price || 0) * p.qty,
      0
    );


  let message =
    "🛍️ *NUEVO PEDIDO - AQUÍ TÁI*\n\n";


  cart.forEach(p => {

    const subtotal =
      Number(p.price || 0) * p.qty;


    message +=
      "• " +
      p.name +
      " × " +
      p.qty +
      " = Bs " +
      subtotal.toFixed(2) +
      "\n";

  });


  message +=
    "\n💰 *Total: Bs " +
    grandTotal.toFixed(2) +
    "*";


  message +=
    "\n👤 Cliente: " +
    name;


  message +=
    "\n📍 Entrega: " +
    addr;


  const phone =
    "59171440907";


  const url =
    "https://wa.me/" +
    phone +
    "?text=" +
    encodeURIComponent(message);


  window.location.href =
    url;
}


/* =====================================================
   SEGURIDAD BÁSICA PARA TEXTO
===================================================== */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =====================================================
   INICIAR
===================================================== */

loadProducts();

</script>

</body>
</html>
