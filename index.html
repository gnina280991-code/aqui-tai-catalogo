/* =====================================================

===================================================== */

===================================================== */

<script>

/* =====================================================
   CONFIGURACIÓN SUPABASE
===================================================== */

const SUPABASE_URL = "https://ztsthkoejosgwkhmzfbd.supabase.co";
const SUPABASE_KEY = "sb_publishable_PUxkUNfWJbdoNYuYGynqAA_3Z02D4MA";

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);


/* =====================================================
   VARIABLES
===================================================== */

let products = [];
let cart = [];
let galleryStates = {};
let expandedDescs = {};
let cardQuantities = {};
let selectedCategory = "Todas";
let currentLightboxImages = [];
let currentLightboxIndex = 0;


/* =====================================================
   ELEMENTOS
===================================================== */

const grid = document.getElementById("grid");
const search = document.getElementById("search");
const sortSelect = document.getElementById("sortSelect");
const count = document.getElementById("count");
const cartItems = document.getElementById("cartItems");
const total = document.getElementById("total");
const panel = document.getElementById("panel");
const customer = document.getElementById("customer");
const address = document.getElementById("address");
const productCount = document.getElementById("productCount");
const categoriesContainer = document.getElementById("categoriesContainer");
const themeBtn = document.getElementById("themeBtn");
const lightbox = document.getElementById("lightbox");
const lightboxImage = document.getElementById("lightboxImage");
const lightboxCounter = document.getElementById("lightboxCounter");
const lightboxPrev = document.getElementById("lightboxPrev");
const lightboxNext = document.getElementById("lightboxNext");


/* =====================================================
   MODO OSCURO / CLARO
===================================================== */

function toggleTheme(){
  document.body.classList.toggle("dark-mode");
  const isDark = document.body.classList.contains("dark-mode");
  themeBtn.textContent = isDark ? "☀️" : "🌙";
  localStorage.setItem("theme", isDark ? "dark" : "light");
}

if(localStorage.getItem("theme") === "dark"){
  document.body.classList.add("dark-mode");
  themeBtn.textContent = "☀️";
}


/* =====================================================
   CONVERTIR IMÁGENES A ARRAY
===================================================== */

function getImages(product){
  let list = [];
  if (product.images) {
    if (Array.isArray(product.images)) {
      list = product.images.map(x => String(x).trim()).filter(Boolean);
    } else if (typeof product.images === 'string') {
      try {
        const parsed = JSON.parse(product.images);
        if (Array.isArray(parsed)) {
          list = parsed.map(x => String(x).trim()).filter(Boolean);
        }
      } catch(e) {
        if (product.images.includes("\n")) {
          list = product.images.split(/\r?\n/).map(x => x.trim()).filter(Boolean);
        } else if (product.images.includes(",")) {
          list = product.images.split(",").map(x => x.trim()).filter(Boolean);
        } else if (product.images.trim()) {
          list = [product.images.trim()];
        }
      }
    }
  }
  if (!list.length && product.image) {
    list = [String(product.image).trim()];
  }
  return list;
}


function escapeHTML(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =====================================================
   CARGAR PRODUCTOS
===================================================== */

async function loadProducts(){

  grid.innerHTML = `<div class="loading">⏳ Cargando productos...</div>`;
  productCount.textContent = "Cargando productos...";

  try{
    const { data, error } = await supabaseClient
      .from("products")
      .select("id, name, category, description, price, image, images, stock, active")
      .eq("active", true)
      .order("id", { ascending: false });

    if(error){
      grid.innerHTML = `<div class="error">❌ Error al cargar productos.</div>`;
      return;
    }

    products = data || [];

    products.forEach(p => {
      galleryStates[p.id] = { images: getImages(p), index: 0 };
      cardQuantities[p.id] = 1;
    });

    renderCategories();
    filterProducts();

  } catch(error){
    grid.innerHTML = `<div class="error">❌ Ocurrió un error inesperado.</div>`;
  }
}


/* =====================================================
   CATEGORÍAS Y FILTRADO / ORDENAMIENTO
===================================================== */

function renderCategories(){
  const cats = ["Todas", ...new Set(products.map(p => p.category?.trim()).filter(Boolean))];
  categoriesContainer.innerHTML = cats.map(cat => `
    <button
      class="cat-chip ${cat === selectedCategory ? 'active' : ''}"
      onclick="selectCategory('${escapeHTML(cat)}')"
    >
      ${escapeHTML(cat)}
    </button>
  `).join("");
}

function selectCategory(cat){
  selectedCategory = cat;
  renderCategories();
  filterProducts();
}

function filterProducts(){
  const q = search.value.trim().toLowerCase();
  const sort = sortSelect.value;

  let filtered = products.filter(p => {
    const matchesCat = (selectedCategory === "Todas" || p.category?.trim() === selectedCategory);
    const text = [p.name, p.description, p.category].filter(Boolean).join(" ").toLowerCase();
    return matchesCat && (!q || text.includes(q));
  });

  if(sort === "price-asc") filtered.sort((a,b) => Number(a.price) - Number(b.price));
  if(sort === "price-desc") filtered.sort((a,b) => Number(b.price) - Number(a.price));
  if(sort === "stock") filtered.sort((a,b) => Number(b.stock) - Number(a.stock));
  if(sort === "recent") filtered.sort((a,b) => Number(b.id) - Number(a.id));

  render(filtered);
}


/* =====================================================
   GALERÍA
===================================================== */

function galleryHTML(product){
  const images = getImages(product);
  if(!images.length) images.push("https://via.placeholder.com/600x600?text=Aqui+tai");

  const state = galleryStates[product.id] || { index: 0 };
  const mainImage = images[state.index] || images[0];

  if(images.length === 1){
    return `
      <div class="gallery single">
        <div class="main-image-wrap" onclick="openLightbox(${Number(product.id)},0)">
          <img class="main-image" src="${escapeHTML(mainImage)}" alt="${escapeHTML(product.name)}" loading="lazy">
        </div>
      </div>
    `;
  }

  return `
    <div class="gallery">
      <div class="main-image-wrap" onclick="openLightbox(${Number(product.id)},${state.index})">
        <img id="main-image-${Number(product.id)}" class="main-image" src="${escapeHTML(mainImage)}" alt="${escapeHTML(product.name)}" loading="lazy">
        <button class="gallery-arrow left" onclick="event.stopPropagation(); changeGallery(${Number(product.id)}, -1)">‹</button>
        <button class="gallery-arrow right" onclick="event.stopPropagation(); changeGallery(${Number(product.id)}, 1)">›</button>
        <div id="counter-${Number(product.id)}" class="photo-counter">${state.index + 1} / ${images.length}</div>
      </div>
      <div id="thumbs-${Number(product.id)}" class="thumbnails">
        ${images.map((img, i) => `
          <button class="thumb ${i === state.index ? "active" : ""}" onclick="event.stopPropagation(); selectGalleryImage(${Number(product.id)}, ${i})">
            <img src="${escapeHTML(img)}" loading="lazy">
          </button>
        `).join("")}
      </div>
    </div>
  `;
}


/* =====================================================
   CANTIDADES EN TARJETA PRODUCTO
===================================================== */

function changeCardQty(id, delta){
  const product = products.find(p => Number(p.id) === Number(id));
  if(!product) return;
  
  const stock = Number(product.stock || 0);
  let current = cardQuantities[id] || 1;
  current += delta;

  if(current < 1) current = 1;
  if(current > stock) current = stock;

  cardQuantities[id] = current;
  document.getElementById("qty-val-" + id).textContent = current;
}


/* =====================================================
   TOGGLE DESCRIPCIÓN
===================================================== */

function toggleDesc(id){
  expandedDescs[id] = !expandedDescs[id];
  filterProducts();
}


/* =====================================================
   RENDER PRODUCTOS
===================================================== */

function render(list){
  productCount.textContent = list.length + (list.length === 1 ? " producto disponible." : " productos disponibles.");

  if(!list.length){
    grid.innerHTML = `<div class="loading">🔎 No encontramos productos.</div>`;
    return;
  }

  const maxId = Math.max(...products.map(p => Number(p.id) || 0));

  grid.innerHTML = list.map(p => {
    const stock = Number(p.stock || 0);
    const disabled = stock <= 0 ? "disabled" : "";
    const isNew = Number(p.id) >= maxId - 2 && stock > 0;

    let badgeHTML = "";
    if(stock <= 0){
      badgeHTML = `<div class="badge out">Agotado</div>`;
    } else if(stock <= 3){
      badgeHTML = `<div class="badge low">¡Últimas unidades!</div>`;
    } else if(isNew){
      badgeHTML = `<div class="badge new">Nuevo</div>`;
    }

    const stockHTML = stock > 0
      ? `<div class="stock">📦 Disponible: ${stock}</div>`
      : `<div class="stock out">❌ Agotado</div>`;

    const fullDesc = p.description || "";
    const isLong = fullDesc.length > 90;
    const isExpanded = expandedDescs[p.id];
    let descHTML = escapeHTML(isLong && !isExpanded ? fullDesc.substring(0, 90) + "..." : fullDesc);

    const qty = cardQuantities[p.id] || 1;

    return `
      <article class="card">
        ${badgeHTML}
        ${galleryHTML(p)}
        <div class="body">
          <div class="cat">${escapeHTML(p.category || "General")}</div>
          <div class="name">${escapeHTML(p.name)}</div>
          
          <div class="desc">
            ${descHTML}
            ${isLong ? `
              <button class="btn-toggle-desc" onclick="toggleDesc(${Number(p.id)})">
                ${isExpanded ? "Ver menos" : "Ver más"}
              </button>
            ` : ""}
          </div>

          <div class="price">Bs ${Number(p.price || 0).toFixed(2)}</div>
          ${stockHTML}

          <div class="qty-control-card">
            <button class="qty-btn-card" ${disabled} onclick="changeCardQty(${Number(p.id)}, -1)">-</button>
            <span id="qty-val-${Number(p.id)}" class="qty-val-card">${qty}</span>
            <button class="qty-btn-card" ${disabled} onclick="changeCardQty(${Number(p.id)}, 1)">+</button>
            
            <button class="btn" ${disabled} onclick="add(${Number(p.id)})">
              ${stock > 0 ? "Agregar" : "Agotado"}
            </button>
          </div>

        </div>
      </article>
    `;
  }).join("");
}


/* =====================================================
   CONTROLES DE GALERÍA
===================================================== */

function changeGallery(id, direction){
  const state = galleryStates[id];
  if(!state || state.images.length <= 1) return;

  state.index += direction;
  if(state.index < 0) state.index = state.images.length - 1;
  if(state.index >= state.images.length) state.index = 0;

  updateGallery(id);
}

function selectGalleryImage(id, index){
  const state = galleryStates[id];
  if(!state) return;
  state.index = index;
  updateGallery(id);
}

function updateGallery(id){
  const state = galleryStates[id];
  const mainImage = document.getElementById("main-image-" + id);
  const counter = document.getElementById("counter-" + id);
  const thumbs = document.querySelectorAll("#thumbs-" + id + " .thumb");

  if(mainImage) mainImage.src = state.images[state.index];
  if(counter) counter.textContent = (state.index + 1) + " / " + state.images.length;

  thumbs.forEach((thumb, i) => thumb.classList.toggle("active", i === state.index));
}


/* =====================================================
   VISOR PROFESIONAL
===================================================== */

function openLightbox(id, index){
  const state = galleryStates[id];
  if(!state) return;
  currentLightboxImages = state.images;
  currentLightboxIndex = index;
  updateLightbox();
  lightbox.classList.add("open");
  document.body.style.overflow = "hidden";
}

function updateLightbox(){
  lightboxImage.src = currentLightboxImages[currentLightboxIndex];
  lightboxCounter.textContent = (currentLightboxIndex + 1) + " / " + currentLightboxImages.length;
  lightboxPrev.style.display = lightboxNext.style.display = currentLightboxImages.length <= 1 ? "none" : "flex";
}

function changeLightboxImage(dir){
  if(currentLightboxImages.length <= 1) return;
  currentLightboxIndex = (currentLightboxIndex + dir + currentLightboxImages.length) % currentLightboxImages.length;
  updateLightbox();
}

function closeLightbox(){
  lightbox.classList.remove("open");
  document.body.style.overflow = "";
}

function closeLightboxIfBackground(e){
  if(e.target === lightbox) closeLightbox();
}


/* =====================================================
   CARRITO
===================================================== */

function add(id){
  const product = products.find(p => Number(p.id) === Number(id));
  if(!product) return;

  const stock = Number(product.stock || 0);
  const addQty = cardQuantities[id] || 1;

  if(stock <= 0){
    alert("Este producto está agotado.");
    return;
  }

  const existing = cart.find(x => Number(x.id) === Number(id));

  if(existing){
    if(existing.qty + addQty > stock){
      alert("No puedes agregar más unidades de las disponibles en inventario.");
      return;
    }
    existing.qty += addQty;
  } else {
    cart.push({ ...product, qty: addQty });
  }

  updateCart();
  openCart();
}

function changeCartQty(index, delta){
  const item = cart[index];
  const stock = Number(item.stock || 0);
  item.qty += delta;

  if(item.qty <= 0){
    cart.splice(index, 1);
  } else if(item.qty > stock){
    alert("Has alcanzado el límite disponible en stock.");
    item.qty = stock;
  }

  updateCart();
}

function updateCart(){
  const quantity = cart.reduce((sum, item) => sum + Number(item.qty), 0);
  count.textContent = quantity;

  if(!cart.length){
    cartItems.innerHTML = "<p>Tu carrito está vacío.</p>";
    total.textContent = "Total: Bs 0.00";
    return;
  }

  cartItems.innerHTML = cart.map((item, index) => {
    const subtotal = Number(item.price || 0) * Number(item.qty || 0);
    return `
      <div class="row">
        <div>
          <b>${escapeHTML(item.name)}</b><br>
          Bs ${Number(item.price || 0).toFixed(2)} c/u<br>
          <strong>Subtotal: Bs ${subtotal.toFixed(2)}</strong>
        </div>
        <div style="display:flex; align-items:center; gap:6px;">
          <button class="cart-qty-btn" onclick="changeCartQty(${index}, -1)">-</button>
          <b>${item.qty}</b>
          <button class="cart-qty-btn" onclick="changeCartQty(${index}, 1)">+</button>
          <button onclick="changeCartQty(${index}, -${item.qty})" style="border:0; background:none; cursor:pointer; font-size:16px;">🗑️</button>
        </div>
      </div>
    `;
  }).join("");

  const grandTotal = cart.reduce((sum, item) => sum + Number(item.price || 0) * Number(item.qty || 0), 0);
  total.textContent = "Total: Bs " + grandTotal.toFixed(2);
}

function openCart(){ panel.classList.add("open"); updateCart(); }
function closeCart(){ panel.classList.remove("open"); }


/* =====================================================
   ENVÍO POR WHATSAPP
===================================================== */

function sendWhatsApp(){
  if(!cart.length){
    alert("Agrega al menos un producto.");
    return;
  }

  const name = customer.value.trim() || "No indicado";
  const addr = address.value.trim() || "No indicada";
  const grandTotal = cart.reduce((sum, item) => sum + Number(item.price || 0) * Number(item.qty || 0), 0);

  let message = "🛍️ *NUEVO PEDIDO - AQUÍ TÁI*\n\n";

  cart.forEach(item => {
    const subtotal = Number(item.price || 0) * Number(item.qty || 0);
    message += "• " + item.name + " × " + item.qty + " = Bs " + subtotal.toFixed(2) + "\n";
  });

  message += "\n💰 *Total: Bs " + grandTotal.toFixed(2) + "*";
  message += "\n👤 Cliente: " + name;
  message += "\n📍 Entrega: " + addr;

  const whatsappURL = "https://wa.me/59171440907?text=" + encodeURIComponent(message);
  window.location.href = whatsappURL;
}


/* =====================================================
   INICIALIZACIÓN
===================================================== */

search.addEventListener("input", filterProducts);

document.addEventListener("keydown", function(e){
  if(!lightbox.classList.contains("open")) return;
  if(e.key === "Escape") closeLightbox();
  if(e.key === "ArrowLeft") changeLightboxImage(-1);
  if(e.key === "ArrowRight") changeLightboxImage(1);
});

loadProducts();

</script>
