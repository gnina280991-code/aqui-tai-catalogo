<!DOCTYPE html>

<head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =====================================================
   GENERAL
===================================================== */

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{

button,

/* =====================================================
   HEADER
===================================================== */

header{

===================================================== */

   PRODUCT GRID
===================================================== */

.grid{

/* =====================================================
   PRODUCT CARD
===================================================== */

===================================================== */

  transition:transform .2s ease;
}

.main-image-wrap:hover .main-image{

/* =====================================================
   FLECHAS GALERÍA
===================================================== */

.gallery-arrow{
  position:absolute;
  top:50%;

  width:34px;

  border:0;
  border-radius:50%;

  background:rgba(255,255,255,.94);

  font-size:22px;

  display:flex;
  align-items:center;
  justify-content:center;

}

.gallery-arrow.left{

}

.gallery-arrow.right{
  right:8px;
}


/* =====================================================
   CONTADOR
===================================================== */

.photo-counter{
  position:absolute;
  left:8px;

  background:rgba(0,0,0,.72);
  color:#fff;

  border-radius:999px;

  padding:5px 9px;

  font-size:11px;
  font-weight:700;

  z-index:4;
}


/* =====================================================
   MINIATURAS
===================================================== */

.thumbnails,
.photo-info{
  display:none;
}


/* =====================================================
   CUERPO CARD
===================================================== */

.body{
  min-width:0;
  padding:18px 20px;

  display:grid;
  grid-template-columns:1fr auto;
  grid-template-rows:auto auto auto 1fr auto;

  column-gap:20px;
}

.cat{
  grid-column:1;
  font-size:13px;
  color:#777;
  margin-bottom:3px;
}

.name{
  grid-column:1;
  font-size:20px;
  font-weight:800;

}

.desc{
  grid-column:1;
  font-size:14px;
  color:#666;
  line-height:1.4;

  max-width:700px;

  display:-webkit-box;
  -webkit-line-clamp:3;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.price{
  grid-column:1;
  align-self:end;

  font-size:21px;
  font-weight:800;

  margin-top:10px;
}

.stock{
  grid-column:1;
  font-size:13px;

  margin-top:3px;
}

.stock.out{
  color:#c00020;
  font-weight:700;
}


/* =====================================================
   BOTÓN AGREGAR
===================================================== */

.btn{

  grid-row:4 / 6;

  align-self:end;

  min-width:160px;

  border:0;
  border-radius:12px;

  padding:12px 18px;

}

.btn:hover{

}

.btn:disabled{

  cursor:not-allowed;

}


/* =====================================================
   ESTADOS
===================================================== */

.loading,
.error{

.loading{

.error{

}

.error-icon{

===================================================== */

/* =====================================================

.panel{

.panel.open{
  display:flex;

.sheet{

}

.sheet h2{

.row{

}

textarea,
input[type=text]{

/* =====================================================

.lightbox-arrow{

.lightbox-arrow.left{

}

.lightbox-counter{

<!-- =====================================================

<main class="wrap">

<script>

/* =====================================================
   CONFIGURACIÓN SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://ztsthkoejosgwkhmz.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_PUxkUNfWJbdoNYuYGynqAA_3Z02D4MA";


/* =====================================================
   CLIENTE SUPABASE
===================================================== */

let supabaseClient = null;

try{

  if(
    window.supabase &&
    typeof window.supabase.createClient === "function"
  ){

    supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

  }

}catch(error){

  console.error(
    "No se pudo iniciar Supabase:",
    error
  );

}


/* =====================================================
   VARIABLES
===================================================== */

let products = [];

let cart = [];

let galleryStates = {};

let currentLightboxImages = [];

let currentLightboxIndex = 0;


/* =====================================================
   ELEMENTOS
===================================================== */

const grid =
  document.getElementById("grid");

const search =
  document.getElementById("search");

const count =
  document.getElementById("count");

const cartItems =
  document.getElementById("cartItems");

const total =
  document.getElementById("total");

const panel =
  document.getElementById("panel");

const customer =
  document.getElementById("customer");

const address =
  document.getElementById("address");

const productCount =
  document.getElementById("productCount");

const lightbox =
  document.getElementById("lightbox");

const lightboxImage =
  document.getElementById("lightboxImage");

const lightboxCounter =
  document.getElementById("lightboxCounter");

const lightboxPrev =
  document.getElementById("lightboxPrev");

const lightboxNext =
  document.getElementById("lightboxNext");


/* =====================================================
   CONVERTIR IMÁGENES EN ARRAY
===================================================== */

function getImages(value){

  if(!value){
    return [];
  }


  if(Array.isArray(value)){

    return value
      .map(x => String(x).trim())
      .filter(Boolean);

  }


  const text =
    String(value).trim();


  if(!text){
    return [];
  }


  /* JSON */

  if(
    text.startsWith("[") &&
    text.endsWith("]")
  ){

    try{

      const parsed =
        JSON.parse(text);

      if(Array.isArray(parsed)){

        return parsed
          .map(x => String(x).trim())
          .filter(Boolean);

      }

    }catch(error){

      console.warn(
        "No se pudo interpretar JSON de imágenes."
      );

    }

  }


  /* Saltos de línea */

  if(text.includes("\n")){

    return text
      .split(/\r?\n/)
      .map(x => x.trim())
      .filter(Boolean);

  }


  /* Comas */

  if(text.includes(",")){

    return text
      .split(",")
      .map(x => x.trim())
      .filter(Boolean);

  }


  return [text];

}


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   CARGAR PRODUCTOS
===================================================== */

async function loadProducts(){

  grid.innerHTML = `
    <div class="loading">
      ⏳ Cargando productos...
    </div>
  `;

  productCount.textContent =
    "Conectando con el catálogo...";


  try{

    if(!supabaseClient){

      throw new Error(
        "No se pudo iniciar la conexión con Supabase."
      );

    }


    const result =
      await supabaseClient
        .from("products")
        .select(
          "id,name,category,description,price,image,stock,active"
        )
        .eq("active", true)
        .order("id", {
          ascending:false
        });


    const data =
      result.data;

    const error =
      result.error;


    if(error){

      console.error(
        "SUPABASE ERROR:",
        error
      );

      showConnectionError(error);

      return;

    }


    products =
      Array.isArray(data)
      ? data
      : [];


    galleryStates = {};


    products.forEach(product => {

      galleryStates[product.id] = {

        images:
          getImages(product.image),

        index:0

      };

    });


    render(products);


  }catch(error){

    console.error(
      "ERROR DE CONEXIÓN:",
      error
    );

    showConnectionError(error);

  }

}


/* =====================================================
   ERROR DE CONEXIÓN
===================================================== */

function showConnectionError(error){

  let message =
    "No se pudo conectar con Supabase.";


  if(error){

    if(error.message){

      message =
        error.message;

    }else{

      message =
        String(error);

    }

  }


  /*
     Mensajes más fáciles de entender
  */

  if(
    message.toLowerCase().includes(
      "failed to fetch"
    )
  ){

    message =
      "El navegador no pudo comunicarse con Supabase. Verifica que la URL y la clave pública sean correctas y que el proyecto de Supabase esté disponible.";

  }


  if(
    message.toLowerCase().includes(
      "permission"
    ) ||
    message.toLowerCase().includes(
      "row-level"
    ) ||
    message.toLowerCase().includes(
      "rls"
    )
  ){

    message =
      "Supabase rechazó la lectura de la tabla products. Debes permitir SELECT para usuarios públicos en la tabla products.";

  }


  productCount.textContent =
    "No se pudo cargar el catálogo.";


  grid.innerHTML = `

    <div class="error">

      <div class="error-icon">
        ❌
      </div>

      <div class="error-title">
        No se pudo cargar el catálogo
      </div>

      <div class="error-message">
        ${escapeHTML(message)}
      </div>

      <button
        class="retry"
        onclick="loadProducts()"
      >
        🔄 Reintentar
      </button>

    </div>

  `;

}


/* =====================================================
   GALERÍA HTML
===================================================== */

function galleryHTML(product){

  let images =
    getImages(product.image);


  if(!images.length){

    images = [
      "https://via.placeholder.com/600x600?text=Aqui+tai"
    ];

  }


  if(!galleryStates[product.id]){

    galleryStates[product.id] = {

      images:images,

      index:0

    };

  }


  const state =
    galleryStates[product.id];


  state.images =
    images;


  if(
    state.index < 0 ||
    state.index >= images.length
  ){

    state.index = 0;

  }


  const mainImage =
    images[state.index];


  /* UNA FOTO */

  if(images.length === 1){

    return `

      <div class="gallery single">

        <div
          class="main-image-wrap"
          onclick="
            openLightbox(
              ${Number(product.id)},
              0
            )
          "
        >

          <img
            id="main-image-${Number(product.id)}"
            class="main-image"
            src="${escapeHTML(mainImage)}"
            alt="${escapeHTML(product.name)}"
            loading="lazy"
            onerror="
              this.onerror=null;
              this.src='https://via.placeholder.com/600x600?text=Sin+imagen';
            "
          >

        </div>

      </div>

    `;

  }


  /* VARIAS FOTOS */

  return `

    <div
      id="gallery-${Number(product.id)}"
      class="gallery"
    >

      <div
        class="main-image-wrap"
        onclick="
          openLightbox(
            ${Number(product.id)},
            ${state.index}
          )
        "
      >

        <img
          id="main-image-${Number(product.id)}"
          class="main-image"
          src="${escapeHTML(mainImage)}"
          alt="${escapeHTML(product.name)}"
          loading="lazy"
          onerror="
            this.onerror=null;
            this.src='https://via.placeholder.com/600x600?text=Sin+imagen';
          "
        >


        <button
          class="gallery-arrow left"
          onclick="
            event.stopPropagation();
            changeGallery(
              ${Number(product.id)},
              -1
            )
          "
          aria-label="Imagen anterior"
        >
          ‹
        </button>


        <button
          class="gallery-arrow right"
          onclick="
            event.stopPropagation();
            changeGallery(
              ${Number(product.id)},
              1
            )
          "
          aria-label="Imagen siguiente"
        >
          ›
        </button>


        <div
          id="counter-${Number(product.id)}"
          class="photo-counter"
        >
          ${state.index + 1} / ${images.length}
        </div>

      </div>

    </div>

  `;

}


/* =====================================================
   RENDER
===================================================== */

function render(list){

  productCount.textContent =
    list.length +
    (
      list.length === 1
      ? " producto disponible."
      : " productos disponibles."
    );


  if(!list.length){

    grid.innerHTML = `

      <div class="loading">
        🔎 No encontramos productos.
      </div>

    `;

    return;

  }


  grid.innerHTML =
    list.map(product => {

      const stock =
        Number(product.stock || 0);


      const disabled =
        stock <= 0
        ? "disabled"
        : "";


      const stockHTML =
        stock > 0

        ? `
          <div class="stock">
            📦 Stock: ${stock}
          </div>
        `

        : `
          <div class="stock out">
            ❌ Agotado
          </div>
        `;


      return `

        <article class="card">

          ${galleryHTML(product)}


          <div class="body">

            <div class="cat">
              ${escapeHTML(
                product.category ||
                "Sin categoría"
              )}
            </div>


            <div class="name">
              ${escapeHTML(
                product.name ||
                "Producto"
              )}
            </div>


            <div class="desc">
              ${escapeHTML(
                product.description ||
                ""
              )}
            </div>


            <div class="price">
              Bs ${Number(
                product.price || 0
              ).toFixed(2)}
            </div>


            ${stockHTML}


            <button
              class="btn"
              ${disabled}
              onclick="
                add(${Number(product.id)})
              "
            >

              ${
                stock > 0
                ? "🛒 Agregar al carrito"
                : "Agotado"
              }

            </button>

          </div>

        </article>

      `;

    }).join("");

}


/* =====================================================
   GALERÍA
===================================================== */

function changeGallery(id,direction){

  const state =
    galleryStates[id];


  if(!state){
    return;
  }


  const total =
    state.images.length;


  if(total <= 1){
    return;
  }


  state.index += direction;


  if(state.index < 0){

    state.index =
      total - 1;

  }


  if(state.index >= total){

    state.index = 0;

  }


  updateGallery(id);

}


function selectGalleryImage(id,index){

  const state =
    galleryStates[id];


  if(!state){
    return;
  }


  if(
    index < 0 ||
    index >= state.images.length
  ){

    return;

  }


  state.index =
    index;


  updateGallery(id);

}


function updateGallery(id){

  const state =
    galleryStates[id];


  if(!state){
    return;
  }


  const image =
    state.images[state.index];


  const mainImage =
    document.getElementById(
      "main-image-" + id
    );


  const counter =
    document.getElementById(
      "counter-" + id
    );


  if(mainImage){

    mainImage.src =
      image;

  }


  if(counter){

    counter.textContent =
      (state.index + 1) +
      " / " +
      state.images.length;

  }

}


/* =====================================================
   LIGHTBOX
===================================================== */

function openLightbox(id,index){

  const state =
    galleryStates[id];


  if(!state){
    return;
  }


  currentLightboxImages =
    state.images;


  currentLightboxIndex =
    index;


  updateLightbox();


  lightbox.classList.add("open");

  document.body.style.overflow =
    "hidden";

}


function updateLightbox(){

  if(
    !currentLightboxImages.length
  ){

    return;

  }


  lightboxImage.src =
    currentLightboxImages[
      currentLightboxIndex
    ];


  lightboxCounter.textContent =
    (currentLightboxIndex + 1) +
    " / " +
    currentLightboxImages.length;


  if(
    currentLightboxImages.length <= 1
  ){

    lightboxPrev.style.display =
      "none";

    lightboxNext.style.display =
      "none";

  }else{

    lightboxPrev.style.display =
      "flex";

    lightboxNext.style.display =
      "flex";

  }

}


function changeLightboxImage(direction){

  if(
    currentLightboxImages.length <= 1
  ){

    return;

  }


  currentLightboxIndex +=
    direction;


  if(currentLightboxIndex < 0){

    currentLightboxIndex =
      currentLightboxImages.length - 1;

  }


  if(
    currentLightboxIndex >=
    currentLightboxImages.length
  ){

    currentLightboxIndex = 0;

  }


  updateLightbox();

}


function closeLightbox(){

  lightbox.classList.remove("open");

  document.body.style.overflow =
    "";

}


function closeLightboxIfBackground(event){

  if(
    event.target === lightbox
  ){

    closeLightbox();

  }

}


/* =====================================================
   TECLADO
===================================================== */

document.addEventListener(
  "keydown",
  function(event){

    if(
      !lightbox.classList.contains("open")
    ){

      return;

    }


    if(event.key === "Escape"){

      closeLightbox();

    }


    if(event.key === "ArrowLeft"){

      changeLightboxImage(-1);

    }


    if(event.key === "ArrowRight"){

      changeLightboxImage(1);

    }

  }
);


/* =====================================================
   SWIPE CELULAR
===================================================== */

let touchStartX = 0;

lightbox.addEventListener(
  "touchstart",
  function(event){

    touchStartX =
      event.changedTouches[0].screenX;

  },
  {
    passive:true
  }
);


lightbox.addEventListener(
  "touchend",
  function(event){

    const touchEndX =
      event.changedTouches[0].screenX;


    const difference =
      touchStartX - touchEndX;


    if(Math.abs(difference) < 50){

      return;

    }


    if(difference > 0){

      changeLightboxImage(1);

    }else{

      changeLightboxImage(-1);

    }

  },
  {
    passive:true
  }
);


/* =====================================================
   BÚSQUEDA
===================================================== */

search.addEventListener(
  "input",
  function(){

    const q =
      search.value
        .trim()
        .toLowerCase();


    if(!q){

      render(products);

      return;

    }


    const filtered =
      products.filter(product => {

        const text =
          [
            product.name,
            product.description,
            product.category
          ]
          .filter(Boolean)
          .join(" ")
          .toLowerCase();


        return text.includes(q);

      });


    render(filtered);

  }
);


/* =====================================================
   CARRITO
===================================================== */

function add(id){

  const product =
    products.find(
      p =>
        Number(p.id) ===
        Number(id)
    );


  if(!product){

    alert(
      "Producto no encontrado."
    );

    return;

  }


  const stock =
    Number(product.stock || 0);


  if(stock <= 0){

    alert(
      "Este producto está agotado."
    );

    return;

  }


  const existing =
    cart.find(
      item =>
        Number(item.id) ===
        Number(id)
    );


  if(existing){

    if(
      existing.qty >= stock
    ){

      alert(
        "No puedes agregar más unidades de las disponibles."
      );

      return;

    }


    existing.qty++;

  }else{

    cart.push({

      ...product,

      qty:1

    });

  }


  updateCart();

  openCart();

}


function updateCart(){

  const quantity =
    cart.reduce(
      (sum,item) =>
        sum + Number(item.qty),
      0
    );


  count.textContent =
    quantity;


  if(!cart.length){

    cartItems.innerHTML =
      "<p>Tu carrito está vacío.</p>";


    total.textContent =
      "Total: Bs 0.00";


    return;

  }


  cartItems.innerHTML =
    cart.map((item,index) => {

      const subtotal =
        Number(item.price || 0) *
        Number(item.qty || 0);


      return `

        <div class="row">

          <div>

            <b>
              ${escapeHTML(
                item.name
              )}
            </b>

            <br>

            Bs ${Number(
              item.price || 0
            ).toFixed(2)}

            × ${item.qty}

            <br>

            <strong>
              Subtotal:
              Bs ${subtotal.toFixed(2)}
            </strong>

          </div>


          <button
            onclick="
              removeItem(${index})
            "
          >
            🗑️
          </button>

        </div>

      `;

    }).join("");


  const grandTotal =
    cart.reduce(
      (sum,item) =>
        sum +
        Number(item.price || 0) *
        Number(item.qty || 0),
      0
    );


  total.textContent =
    "Total: Bs " +
    grandTotal.toFixed(2);

}


function removeItem(index){

  cart.splice(index,1);

  updateCart();

}


function openCart(){

  panel.classList.add("open");

  updateCart();

}


function closeCart(){

  panel.classList.remove("open");

}

function sendWhatsApp(){

  if(!cart.length){

    alert(
      "Agrega al menos un producto."
    );

    return;

  }


  const name =
    customer.value.trim() ||
    "No indicado";


  const addr =
    address.value.trim() ||
    "No indicada";


  const grandTotal =
    cart.reduce(
      (sum,item) =>
        sum +
        Number(item.price || 0) *
        Number(item.qty || 0),
      0
    );


  let message =
    "🛍️ *NUEVO PEDIDO - AQUÍ TÁI*\n\n";


  cart.forEach(item => {

    const subtotal =
      Number(item.price || 0) *
      Number(item.qty || 0);


    message +=
      "• " +
      item.name +
      " × " +
      item.qty +
      " = Bs " +
      subtotal.toFixed(2) +
      "\n";

  });


  message +=
    "\n💰 *Total: Bs " +
    grandTotal.toFixed(2) +
    "*";


  message +=
    "\n👤 Cliente: " +
    name;


  message +=
    "\n📍 Entrega: " +
    addr;


  const encodedMessage =
    encodeURIComponent(message);


  const whatsappURL =
    "https://wa.me/59171440907?text=" +
    encodedMessage;


  window.location.href =
    whatsappURL;

}
