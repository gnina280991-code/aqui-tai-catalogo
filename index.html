<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aquí tái | Catálogo</title>

<meta
  name="description"
  content="Catálogo de productos Aquí tái - Bolivia"
>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f6f7f9;
  color:#171717;
}

/* HEADER */

header{
  background:#fff;
  border-bottom:1px solid #eee;
  position:sticky;
  top:0;
  z-index:10;
}

.top{
  max-width:1100px;
  margin:auto;
  padding:12px 16px;
  display:flex;
  align-items:center;
  gap:14px;
}

.logo{
  height:62px;
  width:62px;
  border-radius:50%;
  object-fit:cover;
  border:1px solid #eee;
}

.brand{
  font-size:25px;
  font-weight:800;
}

.sub{
  font-size:13px;
  color:#666;
}

/* CONTENEDOR */

.wrap{
  max-width:1100px;
  margin:auto;
  padding:22px 16px;
}

/* HERO */

.hero{
  background:#fff;
  border-radius:20px;
  padding:22px;
  margin-bottom:20px;
}

.hero h1{
  margin:0 0 6px;
  font-size:30px;
}

.hero p{
  margin:0;
  color:#666;
  line-height:1.5;
}

.search{
  width:100%;
  padding:14px 16px;
  border:1px solid #ddd;
  border-radius:14px;
  font-size:16px;
  margin-top:18px;
  outline:none;
}

.search:focus{
  border-color:#ff9d00;
}

/* CONTADOR */

.product-count{
  margin-top:16px;
  color:#666;
  font-size:15px;
}

/* GRID */

.grid{
  display:grid;
  grid-template-columns:
    repeat(auto-fill,minmax(210px,1fr));
  gap:16px;
}

/* CARD */

.card{
  background:#fff;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 3px 15px #0000000c;
}

.pic{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  background:#fafafa;
  display:block;
}

.body{
  padding:14px;
}

.cat{
  font-size:12px;
  color:#777;
}

.name{
  font-size:18px;
  font-weight:700;
  margin:5px 0;
}

.desc{
  font-size:13px;
  color:#666;
  line-height:1.4;
  min-height:54px;
}

.price{
  font-size:22px;
  font-weight:800;
  margin:12px 0 5px;
}

.stock{
  font-size:13px;
  color:#555;
  margin-bottom:12px;
}

.stock.out{
  color:#c00;
  font-weight:700;
}

.btn{
  width:100%;
  border:0;
  border-radius:12px;
  padding:13px;
  background:#111;
  color:#fff;
  font-weight:700;
  font-size:15px;
  cursor:pointer;
}

.btn:disabled{
  background:#aaa;
  cursor:not-allowed;
}

/* CARRITO */

.cart{
  position:fixed;
  right:18px;
  bottom:18px;
  border:0;
  border-radius:999px;
  padding:15px 20px;
  background:#ff9d00;
  color:#111;
  font-weight:800;
  box-shadow:0 5px 20px #0003;
  cursor:pointer;
  z-index:15;
}

/* PANEL */

.panel{
  position:fixed;
  inset:0;
  background:#0008;
  display:none;
  z-index:20;
}

.panel.open{
  display:flex;
  align-items:flex-end;
  justify-content:center;
}

.sheet{
  background:#fff;
  width:min(100%,560px);
  max-height:90vh;
  overflow:auto;
  border-radius:22px 22px 0 0;
  padding:20px;
}

.close{
  float:right;
  border:0;
  background:#eee;
  border-radius:50%;
  width:36px;
  height:36px;
  cursor:pointer;
  font-size:18px;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.row button{
  border:0;
  background:#eee;
  border-radius:10px;
  padding:8px 10px;
  cursor:pointer;
}

textarea,
input[type=text]{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
  margin:6px 0 12px;
  font:inherit;
}

textarea{
  min-height:90px;
  resize:vertical;
}

/* ESTADOS */

.loading{
  background:#fff;
  border-radius:18px;
  padding:30px;
  text-align:center;
  color:#666;
}

.error{
  background:#fff;
  border-radius:18px;
  padding:25px;
  text-align:center;
  color:#b00020;
}

/* MOBILE */

@media(max-width:480px){

  .grid{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
    gap:10px;
  }

  .card{
    border-radius:14px;
  }

  .body{
    padding:10px;
  }

  .name{
    font-size:15px;
  }

  .desc{
    font-size:12px;
    min-height:70px;
  }

  .price{
    font-size:18px;
  }

  .hero h1{
    font-size:24px;
  }

  .hero{
    padding:20px;
  }

  .brand{
    font-size:23px;
  }

  .logo{
    width:58px;
    height:58px;
  }

  .cart{
    right:12px;
    bottom:14px;
  }
}
</style>
</head>

<body>

<header>

  <div class="top">

    <img
      class="logo"
      src="logo.png"
      alt="Aquí tái"
      onerror="this.style.display='none'"
    >

    <div>
      <div class="brand">
        Aquí tái
      </div>

      <div class="sub">
        Catálogo de productos · Bolivia
      </div>
    </div>

  </div>

</header>


<main class="wrap">

  <section class="hero">

    <h1>
      🛍️ Nuestro catálogo
    </h1>

    <p>
      Elige tus productos y envíanos tu pedido
      directamente por WhatsApp.
    </p>

    <input
      id="search"
      class="search"
      type="text"
      placeholder="🔎 Buscar productos..."
      autocomplete="off"
    >

    <div
      id="productCount"
      class="product-count"
    >
      Cargando productos...
    </div>

  </section>


  <section
    id="grid"
    class="grid"
  >

    <div class="loading">
      ⏳ Cargando catálogo...
    </div>

  </section>

</main>


<button
  class="cart"
  onclick="openCart()"
>
  🛒 Carrito (<span id="count">0</span>)
</button>


<!-- PANEL DEL CARRITO -->

<div
  id="panel"
  class="panel"
  onclick="if(event.target===this)closeCart()"
>

  <div class="sheet">

    <button
      class="close"
      onclick="closeCart()"
    >
      ✕
    </button>

    <h2>
      🛒 Tu pedido
    </h2>

    <div id="cartItems"></div>

    <div
      id="total"
      style="
        font-size:20px;
        font-weight:800;
        margin:16px 0;
      "
    >
      Total: Bs 0
    </div>


    <label>
      Tu nombre
    </label>

    <input
      id="customer"
      type="text"
      placeholder="Ej. Juan Pérez"
    >


    <label>
      Dirección o zona de entrega
    </label>

    <textarea
      id="address"
      placeholder="Ej. Zona Central"
    ></textarea>


    <button
      class="btn"
      onclick="sendWhatsApp()"
    >
      📲 Enviar pedido por WhatsApp
    </button>

  </div>

</div>


<script>

/* =====================================================
   CONFIGURACIÓN SUPABASE
   ===================================================== */

const SUPABASE_URL =
  "https://ztsthkoejosgwkhmzfbd.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_PUxkUNfWJbdoNYuYGynqAA_3Z02D4MA";


/* Crear conexión */

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   VARIABLES
   ===================================================== */

let products = [];
let cart = [];


/* =====================================================
   ELEMENTOS HTML
   ===================================================== */

const grid =
  document.getElementById("grid");

const search =
  document.getElementById("search");

const count =
  document.getElementById("count");

const cartItems =
  document.getElementById("cartItems");

const total =
  document.getElementById("total");

const panel =
  document.getElementById("panel");

const customer =
  document.getElementById("customer");

const address =
  document.getElementById("address");

const productCount =
  document.getElementById("productCount");


/* =====================================================
   CARGAR PRODUCTOS DESDE SUPABASE
   ===================================================== */

async function loadProducts(){

  grid.innerHTML = `
    <div class="loading">
      ⏳ Cargando productos...
    </div>
  `;

  productCount.textContent =
    "Cargando productos...";


  try{

    const { data, error } =
      await supabaseClient
        .from("products")
        .select(
          "id,name,category,description,price,image,stock,active"
        )
        .eq("active", true)
        .order("id", {
          ascending:false
        });


    if(error){

      console.error(
        "Error Supabase:",
        error
      );

      grid.innerHTML = `
        <div class="error">
          ❌ No se pudieron cargar los productos.
          <br><br>
          Revisa la conexión con Supabase.
        </div>
      `;

      productCount.textContent =
        "Error al cargar productos.";

      return;
    }


    products = data || [];

    render(products);

  }catch(error){

    console.error(error);

    grid.innerHTML = `
      <div class="error">
        ❌ Ocurrió un error al cargar
        el catálogo.
      </div>
    `;

    productCount.textContent =
      "Error al cargar productos.";
  }
}


/* =====================================================
   ESCAPAR TEXTO
   ===================================================== */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =====================================================
   MOSTRAR PRODUCTOS
   ===================================================== */

function render(list){

  productCount.textContent =
    list.length +
    (
      list.length === 1
      ? " producto disponible."
      : " productos disponibles."
    );


  if(!list.length){

    grid.innerHTML = `
      <div class="loading">
        🔎 No encontramos productos.
      </div>
    `;

    return;
  }


  grid.innerHTML =
    list.map(p => {

      const stock =
        Number(p.stock || 0);

      const image =
        p.image ||
        "https://via.placeholder.com/600x600?text=Aqui+tai";


      const disabled =
        stock <= 0
        ? "disabled"
        : "";


      const stockHTML =
        stock > 0
        ? `
          <div class="stock">
            📦 Disponible: ${stock}
          </div>
        `
        : `
          <div class="stock out">
            ❌ Agotado
          </div>
        `;


      return `

        <article class="card">

          <img
            class="pic"
            src="${escapeHTML(image)}"
            alt="${escapeHTML(p.name)}"
            loading="lazy"
            onerror="
              this.src='https://via.placeholder.com/600x600?text=Sin+imagen'
            "
          >

          <div class="body">

            <div class="cat">
              ${escapeHTML(p.category || "Sin categoría")}
            </div>

            <div class="name">
              ${escapeHTML(p.name)}
            </div>

            <div class="desc">
              ${escapeHTML(p.description || "")}
            </div>

            <div class="price">
              Bs ${Number(p.price || 0).toFixed(2)}
            </div>

            ${stockHTML}

            <button
              class="btn"
              ${disabled}
              onclick="add(${Number(p.id)})"
            >
              ${
                stock > 0
                ? "Agregar al carrito"
                : "Agotado"
              }
            </button>

          </div>

        </article>

      `;

    }).join("");
}


/* =====================================================
   BÚSQUEDA
   ===================================================== */

search.addEventListener(
  "input",
  function(){

    const q =
      search.value
        .trim()
        .toLowerCase();


    if(!q){

      render(products);

      return;
    }


    const filtered =
      products.filter(p => {

        const text =
          [
            p.name,
            p.description,
            p.category
          ]
          .filter(Boolean)
          .join(" ")
          .toLowerCase();


        return text.includes(q);

      });


    render(filtered);
  }
);


/* =====================================================
   AGREGAR AL CARRITO
   ===================================================== */

function add(id){

  const product =
    products.find(
      p => Number(p.id) === Number(id)
    );


  if(!product){

    alert(
      "Producto no encontrado."
    );

    return;
  }


  const stock =
    Number(product.stock || 0);


  if(stock <= 0){

    alert(
      "Este producto está agotado."
    );

    return;
  }


  const existing =
    cart.find(
      x => Number(x.id) === Number(id)
    );


  if(existing){

    if(existing.qty >= stock){

      alert(
        "No puedes agregar más unidades de las disponibles."
      );

      return;
    }


    existing.qty++;

  }else{

    cart.push({
      ...product,
      qty:1
    });

  }


  updateCart();

  openCart();
}


/* =====================================================
   ACTUALIZAR CARRITO
   ===================================================== */

function updateCart(){

  const quantity =
    cart.reduce(
      (sum,item) =>
        sum + Number(item.qty),
      0
    );


  count.textContent =
    quantity;


  if(!cart.length){

    cartItems.innerHTML =
      "<p>Tu carrito está vacío.</p>";

    total.textContent =
      "Total: Bs 0.00";

    return;
  }


  cartItems.innerHTML =
    cart.map((item,index) => {

      const subtotal =
        Number(item.price || 0) *
        Number(item.qty || 0);


      return `

        <div class="row">

          <div>

            <b>
              ${escapeHTML(item.name)}
            </b>

            <br>

            Bs ${Number(item.price || 0).toFixed(2)}
            ×
            ${item.qty}

            <br>

            <strong>
              Subtotal: Bs ${subtotal.toFixed(2)}
            </strong>

          </div>

          <button
            onclick="removeItem(${index})"
          >
            🗑️
          </button>

        </div>

      `;

    }).join("");


  const grandTotal =
    cart.reduce(
      (sum,item) =>
        sum +
        Number(item.price || 0) *
        Number(item.qty || 0),
      0
    );


  total.textContent =
    "Total: Bs " +
    grandTotal.toFixed(2);
}


/* =====================================================
   ELIMINAR DEL CARRITO
   ===================================================== */

function removeItem(index){

  cart.splice(index,1);

  updateCart();
}


/* =====================================================
   ABRIR / CERRAR CARRITO
   ===================================================== */

function openCart(){

  panel.classList.add("open");

  updateCart();
}


function closeCart(){

  panel.classList.remove("open");
}


/* =====================================================
   ENVIAR PEDIDO POR WHATSAPP
   ===================================================== */

function sendWhatsApp(){

  if(!cart.length){

    alert(
      "Agrega al menos un producto."
    );

    return;
  }


  const name =
    customer.value.trim() ||
    "No indicado";


  const addr =
    address.value.trim() ||
    "No indicada";


  const grandTotal =
    cart.reduce(
      (sum,item) =>
        sum +
        Number(item.price || 0) *
        Number(item.qty || 0),
      0
    );


  let message =
    "🛍️ *NUEVO PEDIDO - AQUÍ TÁI*\n\n";


  cart.forEach(item => {

    const subtotal =
      Number(item.price || 0) *
      Number(item.qty || 0);


    message +=
      "• " +
      item.name +
      " × " +
      item.qty +
      " = Bs " +
      subtotal.toFixed(2) +
      "\n";

  });


  message +=
    "\n💰 *Total: Bs " +
    grandTotal.toFixed(2) +
    "*";


  message +=
    "\n👤 Cliente: " +
    name;


  message +=
    "\n📍 Entrega: " +
    addr;


  const encodedMessage =
    encodeURIComponent(message);


  /*
    Número de WhatsApp:
    Bolivia +591
    Número: 71440907
  */

  const whatsappURL =
    "https://wa.me/59171440907?text=" +
    encodedMessage;


  window.location.href =
    whatsappURL;
}


/* =====================================================
   INICIAR
   ===================================================== */

loadProducts();

</script>

</body>
</html>
