<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aquí tái | Tienda en Línea</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --accent-color: #ff9d00;
      --whatsapp-color: #25d366;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      padding-bottom: 40px;
    }

    header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 16px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .top {
      max-width: 1000px;
      margin: auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand {
      font-size: 20px;
      font-weight: 800;
    }

    .grid {
      max-width: 1000px;
      margin: 20px auto;
      padding: 0 16px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 16px;
    }

    .prod-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform .2s;
    }

    .prod-card:active { transform: scale(0.98); }

    .prod-img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 10px;
      background: var(--bg-main);
    }

    .prod-title {
      font-size: 15px;
      font-weight: 700;
      margin: 10px 0 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .prod-price {
      font-size: 16px;
      font-weight: 800;
      color: var(--accent-color);
      margin-top: auto;
    }

    /* MODAL CON ESTILO EXACTO A LA IMAGEN */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 300;
      padding: 16px;
    }

    .modal.open { display: flex; }

    .modal-content {
      background: #1e293b;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      width: min(100%, 460px);
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-title {
      font-size: 20px;
      font-weight: 800;
      margin: 0;
      padding-right: 10px;
    }

    .modal-close {
      background: #334155;
      color: #fff;
      border: 0;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .modal-gallery {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      margin-bottom: 20px;
      padding-bottom: 6px;
    }

    .modal-img {
      width: 140px;
      height: 140px;
      border-radius: 14px;
      object-fit: cover;
      border: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #334155;
      font-size: 15px;
    }

    .detail-label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-main);
    }

    .detail-value {
      font-weight: 700;
    }

    .detail-desc-title {
      margin-top: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
    }

    .detail-desc {
      margin-top: 8px;
      line-height: 1.5;
      color: #cbd5e1;
      font-size: 14px;
      white-space: pre-line;
    }

    .btn-ws {
      width: 100%;
      background: var(--whatsapp-color);
      color: #fff;
      border: 0;
      border-radius: 12px;
      padding: 14px;
      font-weight: 800;
      font-size: 16px;
      margin-top: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
  </style>
</head>
<body>

  <header>
    <div class="top">
      <div class="brand">Aquí tái</div>
    </div>
  </header>

  <main class="grid" id="catalogGrid">
    <div style="grid-column: 1/-1; text-align: center; padding: 40px;">⏳ Cargando catálogo...</div>
  </main>

  <!-- MODAL ESTILO MÓVIL EXACTO A LA IMAGEN -->
  <div id="viewModal" class="modal" onclick="if(event.target===this)closeModal()">
    <div class="modal-content">

      <div class="modal-header">
        <h3 id="modalTitle" class="modal-title">-</h3>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>

      <div id="modalGallery" class="modal-gallery"></div>

      <div class="detail-row">
        <span class="detail-label">🏷️ Categoría:</span>
        <span id="modalCat" class="detail-value">-</span>
      </div>

      <div class="detail-row">
        <span class="detail-label">💵 Precio:</span>
        <span id="modalPrice" class="detail-value" style="color: var(--accent-color);">-</span>
      </div>

      <div class="detail-row">
        <span class="detail-label">📦 Stock disponible:</span>
        <span id="modalStock" class="detail-value">-</span>
      </div>

      <div class="detail-desc-title">📝 Descripción / Características:</div>
      <div id="modalDesc" class="detail-desc"></div>

      <button id="modalWsBtn" class="btn-ws" onclick="orderWhatsapp()">
        💬 Pedir por WhatsApp
      </button>

    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://ztsthkoejosgwkhmzfbd.supabase.co";
    const SUPABASE_KEY = "sb_publishable_PUxkUNfWJbdoNYuYGynqAA_3Z02D4MA";
    const PHONE_NUMBER = "59100000000"; // Reemplaza por tu número de WhatsApp

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let products = [];
    let currentSelectedProduct = null;

    async function loadCatalog() {
      const grid = document.getElementById("catalogGrid");
      try {
        const { data, error } = await supabaseClient
          .from("products")
          .select("*")
          .order("id", { ascending: false });

        if (error) throw error;

        products = data || [];
        renderCatalog(products);
      } catch (e) {
        grid.innerHTML = `<div style="grid-column:1/-1; text-align:center;">❌ Error al cargar los productos.</div>`;
      }
    }

    function renderCatalog(list) {
      const grid = document.getElementById("catalogGrid");
      if (!list.length) {
        grid.innerHTML = `<div style="grid-column:1/-1; text-align:center;">No hay productos disponibles.</div>`;
        return;
      }

      grid.innerHTML = list.map(p => {
        const images = getImagesArray(p);
        const mainImg = images[0] || 'https://via.placeholder.com/300?text=Sin+Imagen';

        return `
          <div class="prod-card" onclick="openModal(${p.id})">
            <img class="prod-img" src="${escapeHTML(mainImg)}" alt="Foto">
            <div class="prod-title">${escapeHTML(p.name)}</div>
            <div class="prod-price">Bs ${Number(p.price || 0).toFixed(2)}</div>
          </div>
        `;
      }).join("");
    }

    function openModal(id) {
      const p = products.find(x => x.id === id);
      if (!p) return;

      currentSelectedProduct = p;

      document.getElementById("modalTitle").textContent = p.name || "Producto";
      document.getElementById("modalCat").textContent = p.category || "General";
      document.getElementById("modalPrice").textContent = "Bs " + Number(p.price || 0).toFixed(2);
      document.getElementById("modalStock").textContent = (p.stock || 0) + " unidades";
      document.getElementById("modalDesc").textContent = p.description || "Sin descripción registrada.";

      const images = getImagesArray(p);
      const gallery = document.getElementById("modalGallery");

      if (images.length) {
        gallery.innerHTML = images.map(img => `<img src="${escapeHTML(img)}" class="modal-img">`).join("");
        gallery.style.display = "flex";
      } else {
        gallery.style.display = "none";
      }

      document.getElementById("viewModal").classList.add("open");
    }

    function closeModal() {
      document.getElementById("viewModal").classList.remove("open");
    }

    function orderWhatsapp() {
      if (!currentSelectedProduct) return;
      const msg = `¡Hola! Quisiera comprar el producto: *${currentSelectedProduct.name}* (Bs ${Number(currentSelectedProduct.price).toFixed(2)}). ¿Tienen disponibilidad?`;
      window.open(`https://wa.me/${PHONE_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    function getImagesArray(product) {
      if (Array.isArray(product.images)) return product.images;
      if (typeof product.images === 'string') {
        try { return JSON.parse(product.images); } catch (e) {}
      }
      if (product.image) return [product.image];
      return [];
    }

    function escapeHTML(str) {
      return String(str || '')
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    loadCatalog();
  </script>
</body>
</html>
